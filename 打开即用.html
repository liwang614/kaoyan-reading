 the future, as climate change alters the planet's environment, write the authors.\n"},{"year":2026,"sec":"reading","label":"阅读 Text 2","text":"There's no business like show business - but in Los Angeles, it feels like there's no business at all.\n\nIf that sounds melodramatic, consider this: The Art Directors Guild, a labor union representing about 3,000 film workers, has suspended a training program and issued a statement explaining that \"we cannot in good conscience encourage you to pursue our profession while so many of our members remain unemployed.\" The guild's pessimism is a reaction to Hollywood's decline, which is reaching a critical point for the industry and Southern California.\n\nProduction has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present. Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust. Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Georgia promotional logo.\n\nEven as California lost a huge volume of production to other locations, there was still plenty of film production taking place in Los Angeles before this year. We were kept afloat by \"peak TV\": the glut of content that was required by the explosion of streaming services.\n\nBut 2022 was the peak of peak TV. Back then platforms such as Netflix, Amazon and Apple TV blew billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series being released that year. As the streamers' emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023, with the number expected to dip into the 300s within a few years.\n\nIf productions in Southern California dip below a critical level for too long, the industry's essential talent will drift away along with enormous sums of revenue. Persuading studios to film here would become much more challenging if we couldn't offer a deep bench of local film workers, on-screen talent and local businesses that support the entertainment industry.\n\nThat's why the California Film Commission and its Los Angeles counterpart, FilmLA, should act now, before it's too late. Those agencies and other government bodies should dramatically improve incentives to keep our current shows and attract new productions to Los Angeles. Let's go on with the show... and make sure the show doesn't go on without us.\n"},{"year":2026,"sec":"reading","label":"阅读 Text 3","text":"The pioneers of wireless saw it as a gift to all the people. Sir John Reith said that it would end \"isolation of the spirit\" and rejoiced: \"It does not matter how many thousands may be listening, there is always enough for others... the genius and the fool, the wealthy and the poor listen simultaneously.\"\n\nBetween two great wars this technological innovation built a new kind of national consciousness. Opening this week, a book and exhibition curated by Beaty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939. She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.\n\nThere's fun in testimonies of people enjoying the sheer newness. A cartoon mocks a group failing to converse because they're all in headphones. People report that broadcast music made workmen whistle new tunes. A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and \"talking on the brush handle\".\n\nBy and large the wireless was welcome. I loved the man from the Thirties research who found that wireless suddenly offered \"a lot of variety... things I thought I'd never be interested in... ice hockey perhaps\". True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivenings of a car journey or dull manual task. In my own book about radio I recorded how, on one drive: \"I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious programme on the history of the stethoscope.\"\n\nBut radio's enriching serendipity is ebbing. With multiple networks and countless podcasts, a smartphone user selects what to hear and when. And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.\n\nA hundred years on from Reith, is the art of mere listening endangered? Some will say the audiobook boom revives it, though I suppose you can then worry about the decline of reading. But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest. Whatever we do, innovation will happen. Today we worry about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wirelesses, it lost the neighbourly habit of \"talking on the brush handle\". It's enough to make a person put down the smartphone and go out front with a yard broom.\n"},{"year":2026,"sec":"reading","label":"阅读 Text 4","text":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to \"put everything out,\" he recalled. But when Swetnam enrolled in graduate school at the University of Arizona's Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating back hundreds of years before European colonists arrived on the continent. Some of the trees he analyzed bore more than 20 fire scars spaced among their rings.\n\nThe fact that fires happened so often meant they couldn't have been severe enough to kill most trees. Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier. They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease. Because flammable material couldn't build up on the landscape, blazes tended to move slowly and peter out when they reached the footprints of previous burns.\n\nIn 2022, Swetnam and other scientists teamed up to compile a database of fire-scarred trees from across the continent. Their North American tree-ring fire-scar network (NAFSN) provided the basis for a study published last month. In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall. The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.\n\nThis deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire. Yet the combined consequences of suppression and climate change have eroded humanity's ability to suppress fires, particularly those that ignite under the most dangerous weather conditions.\n\nTo prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it. At Yosemite National Park, Martin oversaw the use of what are known as prescribed burns to make the landscape more resilient. These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of fuel that had built up around important park facilities. Research shows that these prescribed burns make subsequent wildfires less severe, even if the later fires happen under the most dangerous weather conditions.\n\nYet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts said. \"It's a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challenging,\" said Susan Prichard, a fire ecologist at the University of Washington.\n"},{"year":2010,"sec":"cloze","label":"完形","text":"In 1924 America's National Research Council sent two engineers to supervise a series of experiments at a telephone-parts factory called the Hawthorne Plant near Chicago. It hoped they would learn how shop-floor lighting ] workers 5 productivity. Instead, the studies ended 2 giving their name to the \"Hawthorne effectJ the extremely influential idea that the very 3 of being experimented upon changed subjects 5 behavior.\n\nThe idea arose because of the 4 behavior of the women in the plant. According to 5 of the experiments, their hourly output rose when lighting was increased, but also when it was dimmed. It did not 6 what was done in the experiment; 7 something was changed, productivity rose. A(n) 8 that they were being experimented upon seemed to be 9 to alter workers 5 behavior 10 itselfl\n\nAfter several decades, the same data were 11 to econometric analysis. The Hawthorne experiments had another surprise in store. 12 the descriptions on record, no systematic 13 was found that levels of productivity were related to changes in lighting.\n\nIt turns out that the peculiar way of conducting the experiments may have led to 14 interpretations of what happened. 15 , lighting was always changed on a Sunday. When work started again on Monday, output 16 rose compared with the previous Saturday and 17 to rise for the next couple of days. 18 . a comparison with data for weeks when there was no experimentation showed that output always went up on Mondays. Workers 19 to be diligent for the first few days of the week in any case, before 20 a plateau and then slackening off. This suggests that the alleged cc Hawthorne effect 55 is hard to pin down.\n\n1. [A ] affected [B ] achieved EC] extracted [D ] restored\n\n2. [ A ] at [B ] up c] with [D ] off\n\n3. [A ] truth [B ] sight [c] act [D ] proof\n\n4. [A ] \u003ccontroversial [B ] perplexing [C] mischievous [D ] ambiguous\n\n6. [A ] \u003cconclude [B ] matter [c] indicate [D ] work\n\n7. as far as [B ] for fear that [c] in case that [D ] so long as\n\n8. [A ] iawareness [B ] expectation c] sentiment [D ] illusion\n\n9. [ A ] ;suitable [B ] excessive [c] enough [D ] abundant\n\n10. [A ] about [B ] for [C] on [D ] by\n\n11. [A ] compared [B ] shown [C] subjected [D ] conveyed\n\n12. [A ] Contrary to [B ] Consistent with [C] Parallel with [D ] Peculiar to\n\n13. [A ] evidence [B ] guidance [C] implication [D ] source\n\n14. [A ] disputable [B ] enlightening [C] reliable [D ] misleading\n\n15. [A ] In contrast [B ] For example [C ] In consequence [D ] As usual\n\n16. [A ] duly [B ] accidentally [C ] unpredictably [D ] suddenly\n\n17. [A ] failed [B ] ceased [c] started [D ] continued\n\n18. [A ] Therefore [B ] Furthermore [C] However [D ] Meanwhile\n\n19. [A ] attempted [B ] tended [C] chose [D ] intended\n\n20. [A ] breaking [B ] climbing [C l surpassing [D ] hitting\n"},{"year":2010,"sec":"partb","label":"新题型","text":"m artB\n\nD irections:\n\nFor questions 41-45, choose the most suitable paragraphs from the list A-G and fill them into the numbered boxes to form a coherent text. Paragraph E has been correctly placed. There is one paragraph which does not fit in with the text. Mark your answers on ANSWER SHEET 1. (10 points)\n\n[A ] The first and more important is the consumer's growing preference for eating out: the consumption of food and drink in places other than homes has risen from about 32 percent of total consumption in 1995 to 35 percent in 2000 and is expected to approach 38 percent by 2005. This development is boosting wholesale demand from the food service segment by 4 to 5 percent a year across Europe, compared with growth in retail demand of 1 to 2 percent. Meanwhile, as the recession is looming large, people are getting anxious. They tend to keep a tighter hold on their purse and consider eating at home a realistic alternative.\n\n[B ] Retail sales of food and drink in Europe 5 s largest markets are at a standstill, leaving European grocery retailers hungry for opportunities to grow. Most leading retailers have already tried e-commerce with limited success, and expansion abroad. But almost all have ignored the big, profitable opportunity in their own backyard: the wholesale food and drink trade, which appears to be just the kind of market retailers need.\n\n[C ] Will such variations bring about a change in the overall structure of the food and drink market? Definitely not. The functioning of the market is based on flexible trends dominated by potential buyers. In other words, it is up to the buyer, rather than the seller, to decide what to buy. At any rate, this change will ultimately be acclaimed by an ever-growing number of both domestic and international consumers, regardless of how long the current consumer pattern will take hold.\n\n[D ] All in all, this clearly seems to be a market in which big retailers could profitably apply their gigantic scale, existing infrastructure, and proven skills in the management of product ranges, logistics, and marketing intelligence. Retailers that master the intricacies of wholesaling in Europe may well expect to rake in substantial profits thereby. At least, that is how it looks as a whole. Closer inspection reveals important differences among the biggest national markets, especially in their customer segments and wholesale structures, as well as the competitive dynamics of individual food and drink categories. Big retailers must understand these differences before they can identify the segments of European wholesaling in which their particular abilities might unseat smaller but entrenched competitors. New skills and unfamiliar business models are needed too.\n\n[E ] Despite variations in detail, wholesale markets in the countries that have been closely examined- France, Germany, Italy and Spain- are made out of the same building blocks. Demand comes mainly from two sources: independent momand-pop grocery stores which, unlike large retail chains, are too small to buy straight from producers, and food service operators that cater to consumers when they don't eat at home. Such food service operators range from snack machines to large institutional catering ventures, but most of these businesses are known in the trade as u horeca\": hotels, restaurants, and cafes. Overall, Europe's wholesale market for food and drink is growing at the same sluggish pace as the retail market, but the figures, when added together, mask two opposing trends.\n\n[F ] For example, wholesale food and drink sales came to \\$ 268 billion in France, Germany, Italy, Spain, and the United Kingdom in 2000- more than 40 percent of retail sales. Moreover, average overall margins are higher in wholesale than in retail; wholesale demand from the food service sector is growing quickly as more Europeans eat out more often; and changes in the competitive dynamics of this fragmented industry are at last making it feasible for wholesalers to consolidate.\n\n[G ] However, none of these requirements should deter large retailers (and even some large food producers and existing wholesalers) from trying their hand, for those that master the intricacies of wholesaling in Europe stand to reap considerable gains.\n"},{"year":2010,"sec":"partc","label":"翻译","text":"mart`\n\nOne basic weakness in a conservation system based wholly on economic motives is that most members of the land community have no economic value. Yet these creatures are members of the biotic community and, if its stability depends on its integrity, they are entitled to continuance.\n\nWhen one of these noneconomic categories is threatened and, if we happen to love it, we invent excuses to give it economic importance. At the beginning of the century songbirds were supposed to be disappearing. (46) Scientists jumped to the rescue with some distinctly shaky evidence to the effect that insects would eat us up if birds failed to control them. The evidence had to be economic in order to be valid.\n\nIt is painful to read these roundabout accounts today. We have no land ethic yet, (47) but we have at least drawn nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or absence of economic advantage to us.\n\nA parallel situation exists in respect of predatory mammals and fish-eating birds. (48) Time was when biologists somewhat overworked the evidence that these creatures preserve the health of game by killing the physically weak\\* or that they prey only on 'SvorthleW species. Here again, the evidence had to be economic in order to be valid. It is only in recent years that we hear the more honest argument that predators are members of the community, and that no special interest has the right to exterminate them for the sake ofa benefit, real or fancied, to itself.\n\nSome species of trees have been \"read out of the party\" by economics-minded foresters because they grow too slowly, or have too low a sale value to pay as timber crops. (49) In Europe, where forestry is ecologically more advanced the noncommercia tree species are recognized as members of the native forest community, to be preserved as such within reason. Moreover, some have been found to have a valuable function in building up soil fertility. The interdependence of the forest and its constituent tree species, ground flora, and fauna is taken for granted.\n\nTo sum up: a system of conservation based solely on economic self-interest is hopelessly lopsided. (50) It tends to ignore, and thus eventually to eliminate, many elements in the land community that lack commercial value, but that are essential to it healthy functioning. It assumes, falsely, that the economic parts of the biotic clock will function without the uneconomic parts.\n"},{"year":2010,"sec":"questions","label":"阅读题目","text":"21. It is indicated in Paragraphs 1 and 2 th [A ] arts criticism has disappeared from big-city newspapers [B ] English-language newspapers used to carry more arts reviews [C ] high-quality newspapers retain a large body of readers [D ] young readers doubt the suitability of criticism on dailie\n\n22. Newspaper reviews in England before World War II were characterized b [A ] free themes [B ] casual style [C ] elaborate layout [D ] radical viewpoints\n\n23. Which of the following would Shaw and Newman most probably agree o [A ] It is writers 9 duty to fulfilljournalistic goals [B ] It is contemptible for writers to bejournalists [C ] Writers are likely to be tempted intojournalism [D ] Not all writers are capable ofjoumalistic writing\n\n24. What can be learned about Cardus according to the last two paragraph [A ] His music criticism may not appeal to readers today [B ] His reputation as a music critic has long been in dispute [C ] His style caters largely to modem specialists [D ] His writings fail to follow the amateur tradition\n\n25. What would be the best title for the tex [A ] Newspapers of the Good Old Day [B ] The Lost Horizon in Newspaper [C ] Mournful Decline of Journalism [D ] Prominent Critics in Memor\n\n26. Business-method patents have recently aroused concern because o [A ] their limited value to businesses [B ] their connection with asset allocation [C ] the possible restriction on their granting [D ] the controversy over their authorization\n\n27. Which of the following is true of the Bilski case [A ] Its ruling complies with the court decisions [B ] It involves a very big business transaction [C ] It has been dismissed by the Federal Circuit [D ] It may change the legal practices in the U.S\n\n28. The word cc about-face(L ine 1 Para. 3) most probably mean [A ] loss of goodwill [B ] increase of hostility [C ] change of attitude [D ] enhancement of dignity\n\n29. We learn from the last two paragraphs that business-method paten [A ] are immune to legal challenges [B ] are often unnecessarily issued [C ] lower the esteem for patent holders [D ] increase the incidence of risks\n\n30. Which of the following would be the subject of the tex [A ] A looming threat to business-method patents [B ] Protection for business-method patent holders [C ] A legal case regarding business-method patents [D ] A prevailing trend against business-method patents\n\n31. By citing the book The TippingPointy the author intends t [A ] analyze the consequences of social epidemics [B ] discuss influential 5 fimction in spreading ideas [C ] exemplify people's intuitive response to social epidemics [D ] describe the essential characteristics of influentials\n\n32. The author suggests that the C4 two-step-flow theory [A ] serves as a solution to marketing problems. [B ] has helped explain certain prevalent trends [C ] has won support from influentials [D ] requires solid evidence for its validity\n\n33. What the researchers have observed recently shows th [A ] the power of influence goes with social interactions [B ] interpersonal links can be enhanced through the media EC] influentials have more channels to reach the public. [D ] most celebrities enjoy wide media attention\n\n34. The underlined phrase these people 59 in Paragraph 4 refers to the ones wh [A ] stay outside the network of social influence [B ] have little contact with the source of influence [C ] are influenced and then influence others [D ] are influenced by the initial influential\n\n35. What is the essential element in the dynamics of social influence [A ] The eagerness to be accepted [B ] The impulse to influence others [C ] The readiness to be influenced [D ] The inclination to rely on others\n\n36. Bankers complained that they were forced t [A ] follow unfavorable asset evaluation rules [B ] collect payments from third parties [C ] cooperate with the price managers. [D ] reevaluate some of their asset\n\n37. According to the author, the rule changes of the FASB may result [A ] the diminishing role of management [B ] the revival of the banking system [C ] the banks 9 long-term asset losses [D ] the weakening of its independence\n\n38. According to Paragraph 4, McCreevy objects to the IASB ? s attempt t [A ] keep away from political influences [B ] evade the pressure from their peers [C ] act on their own in rule-setting [D ] take gradual measures in reform\n\n39. The author thinks the banks were Cfi on the wrong planet 59 in that th [A ] misinterpreted market price indicators [B ] exaggerated the real value of their assets [C ] neglected the likely existence of bad debts [D ] denied booking losses in their sale of assets\n\n40. The author's attitude towards standard-setters is one o [A ] satisfection [B ] skepticism [C ] objectiveness [D ] sympathy.\n"},{"year":2010,"sec":"writing","label":"写作","text":"You are supposed to write for the Postgraduates 9 Association a notice to recruit volunteers for an international conference on globalization. The notice should include the basic qualifications for applicants and other information which you think is relevant.\n\nmartB\n\n52. Direction\n\n2) explain its intended meaning, an\n"},{"year":2011,"sec":"cloze","label":"完形","text":"Ancient Greek philosopher Aristotle viewed laughter as cc a bodily exercise precious to health? 9 But ] some claims to the contrary, laughing probably has little influence on physical fitness. Laughter does 2 short-term changes in the function of the heart and its blood vessels, 3 heart rate and oxygen consumption. But because hard laughter is difficult to 4 . a good laugh is unlikely to have 5 benefits the way, say, walking orjogging does.\n\n6 , instead of straining muscles to build them, as exercise does, laughter apparently accomplishes the 7 . Studies dating back to the 1930s indicate that laughter 8 muscles, decreasing muscle tone for up to 45 minutes after the laugh dies down.\n\nSuch bodily reaction might conceivably help 9 the effects of psychological stress. Anyway, the act of laughing probably does produce other types of 10 feedback that improve an individual 9 s emotional state. 11 one classical theory of emotion, our feelings are partially rooted 12 physical reactions. It was argued at the end of the 19th century that humans do not cry 13 they are sad but they become sad when the tears begin to flow.\n\nAlthough sadness also 14 tears, evidence suggests that emotions can flow 15 muscular responses. In an experiment published in 1988 social psychologist Fritz Strack of the University of Wurzburg in Germany asked volunteers to 16 a pen either with their teeth- thereby creating an artificial smile- or with their lips, which would produce a(n) 17 expression. Those forced to exercise their smiling muscles 18 more enthusiastically to funny cartoons than did those whose mouths were contracted in a frown, 19 that expressions may influence emotions rather than just the other way around. 20 the physical act of laughter could improve mood.\n\n1. [A] among [B] except [C] despite [D] like 2. [A] reflect [B] demand [C] indicate [D] produce 3. [A] stabilizing [B] boosting [C] impairing [D] determining 4. [A] transmit [B] sustain [C] evaluate [D] observe 5. [A] measurable [B] manageable [C] affordable [D] renewable 6. [A] In turn [B] In fact [C] In addition [D] In brief 7. [A] opposite [B] impossible [C] average [D] expected 8. [A] hardens [B] weakens [C] tightens [D] relaxes 9. [A] aggravate [B] generate [C] moderate [D] enhance 10. [A] physical [B] mental [C] subconscious [D] internal 11. [A] Except for [B] According to [C] Due to [D] As for 12. [A] with [B] on [C] in [D] at 13. [A] unless [B] until [C] if [D] because 14. [A] exhausts [B] follows [C] precedes [D] suppresses 15. [A] into [B] from [C] towards [D] beyond 16. [A] fetch [B] bite [C] pick [D] hold 17. [A] disappointed [B] excited [C] joyful [D] indifferent 18. [A] adapted [B] catered [C] turned [D] reacted 19. [A] suggesting [B] requiring [C] mentioning [D] supposing 20. [A] Eventually [B] Consequently [C] Similarly [D] Conversely\n"},{"year":2011,"sec":"partb","label":"新题型","text":"martB\n\nThe following paragraphs are given in a wrong order. For questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-G and filling them into the numbered boxes. Paragraphs E and G have been correctly placed. Mark your answers on ANSWER SHEET 1. (10 points)\n\n[A ] No disciplines have seized on professionalism with as much enthusiasm as the humanities. You can, Mr Menand points out, become a lawyer in three years and a medical doctor in four. But the regular time it takes to get a doctoral degree in the humanities is nine years. Not surprisingly, up to half of all doctoral students in English drop out before getting their degrees.\n\n[B ] His concern is mainly with the humanities: literature, languages, philosophy and so on. These are disciplines that are going out of style: 22% of American college graduates now major in business compared with only 2% in history and 4% in English. However, many leading American universities want their undergraduates to have a grounding in the basic canon of ideas that every educated person should possess. But most find it difficult to agree on what a \" general educationshould look like. At Harvard, Mr Menand notes, tc the great books are read because they have been read\" they form a sort of social glue.\n\n[C ] Equally unsurprisingly, only about half end up with professorships for which they entered graduate school. There are simply too few posts. This is partly because universities continue to produce ever more PhDs. But fewer students want to study humanities subjects: English departments awarded more bachelor's degrees in 1970-71 than they did 20 years later. Fewer students require fewer teachers. So, at the end of a decade of thesis-writing, many humanities students leave the profession to do something for which they have not been trained.\n\n[D ] One reason why it is hard to design and teach such courses is that they cut across the insistence by top American universities that liberal-arts education and professional education should be kept separate, taught in different schools. Many students experience both varieties. Although more than half of Harvard undergraduates end up in law, medicine or business, future doctors and lawyers must study a non-specialist liberal-arts degree before embarking on a professional qualification.\n\n[E ] Besides professionalising the professions by this separation, top American universities have professionalised the professor. The growth in public money for academic research has speeded the process: federal research grants rose fourfold between 1960 and 1990, but feculty teaching hours fell by half as research took its toll. Professionalism has turned the acquisition of a doctoral degree into a prerequisite for a successful academic career: as late as 1969 a third of American professors did not possess one. But the key idea behind professionalisation, argues Mr Menand, is that \"the knowledge and skills needed for a particula specialisation are transmissible but not transferable.\" So disciplines acquire a monopoly not just over the production of knowledge, but also over the production of the producers of knowledge.\n\n[F ] The key to reforming higher education, concludes Mr Menand, is to alter the wa in which 6t the producers of knowledge are produced. 59 Otherwise, academics will continue to think dangerously alike, increasingly detached from the societies which they study, investigate and criticise. ''Academic inquiry, at least in some fields, may need to become less exclusionary and more holistic? 5 Yet quite how that happens, Mr Menand does not say.\n\n[G ] The subtle and intelligent little book The Marketplace of Ideas: Reform and Resistance in the American University should be read by every student thinking of applying to take a doctoral degree. They may then decide to go elsewhere. For something curious has been happening in American universities, and Louis Menand, a professor of English at Harvard University, captured it skillfully.\n"},{"year":2011,"sec":"partc","label":"翻译","text":"mart`\n\nWith its theme that\" Mind is the master weaver/ 9 creating our inner character and outer circumstances, the book As a Man Thinketh by James Allen is an in-depth exploration of the central idea of self-help writing.\n\n(46) Alien's contribution was to take an assumption we all share- that because we are not robots we therefore control our thoughts — and reveal its erroneous nature. Because most of us believe that mind is separate from matter, we think that thoughts can be hidden and made powerless; this allows us to think one way and act another. However, Allen believed that the unconscious mind generates as much action as the conscious mind, and (47) while we may be able to sustain the illusion of control through the conscious mind alone, in reality we are continually fkced with a question: \"Why cannot I make myselfdo this or achieve that?\"\n\nSince desire and will are damaged by the presence of thoughts that do not accord with desire, Allen concluded: \"We do not attract what we want, but what we are.\" Achievement happens because you as a person embody the external achievement; you don't \"get\" success but become it. There is no gap between mind and matter.\n\nPart of the fame of Allen 5 s book is its contention that \"Circumstances do not make a person, they reveal him.\" (48) This seems a justification for neglect of those in need, and a rationalization of exploitation^ of the superiority of those at the top and the inferiority of those at the bottom.\n\nThis, however, would be a knee-jerk reaction to a subtle argument. Each set o circumstances, however bad, offers a unique opportunity for growth. If circumstances always determined the life and prospects of people, then humanity would never have progressed. In fact, (49) circumstances seem to be designed to bring out the best in us\" and if we fbel that we have been 'Svronged\" then we are unlikely to begin a conscious effort to escape fix)m our situation. Nevertheless, as any biographer knows, a person's early life and its conditions are often the greatest gift to an individual.\n\nThe sobering aspect of Allen 5 s book is that we have no one else to blame for our present condition except ourselves. (50) The upside is the possibilities contained in knowing that everything is up to us; where before we were experts in the array of limitations, now we become authorities of what is possible.\n"},{"year":2011,"sec":"questions","label":"阅读题目","text":"21. We learn from Paragraph 1 that Gilbert 9 s appointment h [A ] in curred criticism [B ] raised suspicion [C ] received acclaim [D ] aroused curiosity\n\n22. Tommasini regards Gilbert as an artist who [A ] influential [B ] modest [C ] respectable [D ] talented\n\n23. The author believes that the devoted concertgoe [A ] ignore the expenses of live performances [B ] reject most kinds of recorded performances [C ] exaggerate the variety of live performances [D ] overestimate the value of live performances\n\n24. According to the text, which of the following is true of recording [A ] They are often inferior to live concerts in quality [B ] They are easily accessible to the general public [C ] They help improve the quality of music [D ] They have only covered masterpieces\n\n25. Regarding Gilbert's role in revitalizing the Philharmonic, the author fee [A ] doubtful [B ] enthusiastic [C ] confident. [D ] puzzled\n\n26. When McGee announced his departure, his maimer can best be described as bein [A ] arrogant. [B ] frank. [C ] self-centered [D ] impulsive.\n\n27. According to Paragraph 2, senior executives 5 quitting may be spurred [A ] their expectation of better financial status [B ] their need to reflect on their private life [C ] their strained relations with the boards [D ] their pursuit of new career goals\n\n28. The word \"poached\" (Line 3, Paragraph 4) most probably mean [A ] approved o [B ] attended to [C ] hunted for [D ] guarded against\n\n29. It can be inferred from the last paragraph th [A ] top performers used to cling to their posts [B ] loyalty of top performers is getting out-dated [C ] top performers care more about reputations ED] it's safer to stick to the traditional rules.\n\n30. Which of the following is the best title for the text [A ] CEOs: Where to Go? [B ] CEOs: All the Way Up? [C ] Top Managers Jump without a Ne [D ] The Only Way Out for Top Performer\n\n31 . Consumers may create \"earned\" media when they a [A ] obsessed with on line shopping at certain Web sites [B ] inspired by product-promoting e-mails sent to them [C ] eager to help their friends promote quality products [D ] enthusiastic about recommending their favorite products\n\n32 .According to Paragraph 2, sold media featu [A ] a safe business environment [B ] random competition [C ] strong user traffic. [D ] flexibility in organization\n\n33 .The author indicates in Paragraph 3 that earned med [A ] invite constant conflicts with passionate consumers [B ] can be used to produce negative effects in marketing [C ] may be responsible for fiercer competition [D ] deserve all the negative comments about them\n\n34 .Toyota Motor 9 s experience is cited as an example [A ] responding effectively to hijacked media [B ] persuading customers into boycotting products [C ] cooperating with supportive consumers. [D ] taking advantage of hijacked media\n\n35 .Which of the following is the text mainly abou [A ] Alternatives to conventional paid media [B ] Conflict between hijacked and earned media [C ] Dominance of hijacked media [D ] Popularity of owned media.\n\n36. Jennifer Senior suggests in her article that raising a child can brin [A ] temporary delight [B ] enjoyment in progress. [C ] happiness in retrospect [D ] lasting reward\n\n37. We learn from Paragraph 2 th [A ] celebrity moms are a permanent source for gossip [B ] single mothers with babies deserve greater attention [C ] news about pregnant celebrities is entertaining. [D ] having children is highly valued by the public\n\n38. It is suggested in Paragraph 3 that childless fol [A ] are constantly exposed to criticism [B ] are largely ignored by the media [C ] fail to fulfill their social responsibilities [D ] are less likely to be satisfied with their life\n\n39. According to Paragraph 4, the message conveyed by celebrity magazines [A ] soothing. [B ] ambiguous [C ] compensatory [D ] misleading\n\n40. Which of the following can be inferred from the last paragraph [A ] Having children contributes little to the glamour of celebrity moms [B ] Celebrity moms have influenced our attitude towards child rearing [C ] Having children intensifies our dissatisfaction with life [D ] We sometimes neglect the happiness from child rearing\n"},{"year":2011,"sec":"writing","label":"写作","text":"Write a letter to a friend of yours to\n\n1) recommend one of your favorite movies an\n\n2) give reasons for your recommendatio\n\nmartB\n\n52. Direction\n\n2) explain its intended meaning, an\n"},{"year":2012,"sec":"cloze","label":"完形","text":"The ethical judgments of the Supreme Court justices have become an important issue recently. The court cannot ] its legitimacy as guardian of the rule of law 2 justices behave like politicians. Yet, in several instances, justices acted in ways that 3 the court 5 s reputation for being independent and impartial.\n\nJustice Antonin Scalia, for example, appeared at political events. That kind of activity makes it less likely that the court 5 s decisions will be 4 as impartial judgments. Part of the problem is that the justices are not 5 by an ethics code. At the very least, the court should make itself 6 to the code of conduct that 7 to the rest of the federaljudiciary.\n\nThis and other similar cases 8 the question of whether there is still a 9 between the court and politics.\n\nThe framers of the Constitution envisioned law 10 having authority apart from politics. They gave justices permanent positions 11 they would be free to 12 those in power and have no need to 13 political support. Our legal system was designed to set law apart from politics precisely because they are so closely 14\n\nConstitutional law is political because it results from choices rooted in fundamental social 15 like liberty and property. When the court deals with social policy decisions, the law it 16 is inescapably political- which is why decisions split along ideological lines are so easily 17 as unjust.\n\nThejustices must 18 doubts about the court 9 s legitimacy by making themselves 19 to the code of conduct. That would make their rulings more likely to be seen as separate from politics and, 20 convincing as law.\n\n9. [A ] line [ B ] barrier [C ] similarity [D ] conflict\n\n1. [A ] emphasize [B ] maintain [C ] modify [D ] recognize\n\n3. [A ] restored [B ] weakened [C ] established [D ] eliminated\n\n4. [A ] challenged [B ] compromised [C ] suspected [D ] accepted\n\n5. [A ] advanced [B ] caught EC] bound [D ] founded\n\n6. [A ] resistant [B ] subject [C ] immune [D ] prone\n\n7. [A ] resorts [ B ] sticks [C ] leads [D ] applies\n\n10. LA] by [ B ] as [C ] through [D ] towards\n\n11. [A ] so [B ] since [C ] provided [D ] though\n\n12. [A ] serve [ B ] satisfy [C ] upset [D ] replace\n\n13. [A ] confirm [B ] express [C ] cultivate [D ] offer\n\n14. [A ] guarded [B ] followed [C ] studied [D ] tied\n\n15. [A ] concepts [B ] theories [C ] divisions [D ] conventions\n\n16. [A ] excludes [B ] questions [C ] shapes [D ] controls\n\n17. [A ] dismissed [B ] released [C ] ranked [D ] distorted\n\n18. [A ] suppress [ B ] exploit [C ] address [D ] ignore\n\n19. [A ] accessible [B ] amiable [C ] agreeable [D ] accountable\n\n20. [A ] by all means [B ] at all costs [C ] in a word [D ] as a result\n"},{"year":2012,"sec":"partb","label":"新题型","text":"martB\n\nIn the following text, some sentences have been removed. For Questions 41 -4 5 , choose the most suitable one from the list A - G to fit into each of the numbered blanks. There are two extra choices, which do not fit in any of the blanks. Mark your answers on ANSWER SHEET 1.(10 points)\n\nThink of those fleeting moments when you look out of an aeroplane window and realise that you are flying, higher than a bird. Now think of your laptop, thinner than a brown-paper envelope, or your cellphone in the palm of your hand. Take a moment or two to wonder at those marvels. You are the lucky inheritor ofa dream come true.\n\nThe second half of the 20th century saw a collection of geniuses, warriors, entrepreneurs and visionaries labour to create a fabulous machine that could function as a typewriter and printing press, studio and theatre, paintbrush and gallery, piano and radio, the mail as well as the mail carrier. (41)\n\nThe networked computer is an amazing device, the first media machine that serves as the mode of production, means of distribution, site of reception, and place of praise and critique. The computer is the 21st century 5 s culture machine.\n\nBut for all the reasons there are to celebrate the computer, we must also act with caution. ( I call it a secret war for two reasons. First, most people do not realise that there are strong commercial agendas at work to keep them in passive consumption mode. Second, the majority of people who use networked computers to upload are not even aware of the significance of what they are doing.\n\nAll animals download, but only a few upload. Beavers build dams and birds make nests. Yet for the most part, the animal kingdom moves through the world downloading. Humans are unique in their capacity to not only make tools but then turn around and use them to create superfluous material goods paintings, sculpture and architecture and superfluous experiences music, literature, religion and philosophy.(43)\n\nFor all the possibilities of our new culture machines, most people are still stuck in download mode. Even after the advent of widespread social media, a pyramid of production remains, with a small number of people uploading material, a slightly larger group commenting on or modifying that content, and a huge percentage remaining content to just consume. (44)\n\nTelevision is a one-way tap flowing into our homes. The hardest task that television asks of anyone is to turn the power offafter he has turned it on. (45)\n\nWhat counts as meaningful uploading? My definition revolves around the concept of \" stickiness , , creations and experiences to which others adhere.\n\n[A ] Of course, it is precisely these superfluous things that define human culture and ultimately what it is to be human. Downloading and consuming culture requires great skills, but failing to move beyond downloading is to strip oneself of a defining constituent of humanity.\n\n[B ] Applications like , which allow users to combine pictures, words andtumblr.com other media in creative ways and then share them, have the potential to add stickiness by amusing, entertaming and enlightening others.\n\n[C ] Not only did they develop such a device but by the turn of the millennium they had also managed to embed it in a worldwide system accessed by billions o people every day.\n\n[D ] This is because the networked computer has sparked a secret war between downloading and uploading between passive consumption and active creation whose outcome will shape our collective future in ways we can only begin to imagine.\n\n[E ] The challenge the computer mounts to television thus bears little similarity to on format being replaced by another in the maimer of record players being replaced by CD players.\n\n[F ] One reason for the persistence of this pyramid of production is that for the past half-century, much of the world's media culture has been defined by a single medium—television and television is defined by downloading.\n\n[G ] The networked computer offers the first chance in 50 years to reverse the flow, t encourage thoughtfill downloading and, even more importantly, meaningfu uploading.\n"},{"year":2012,"sec":"partc","label":"翻译","text":"mart`\n\nSince the days of Aristotle, a search for universal principles has characterized the scientific enterprise. In some ways, this quest for commonalities defines science. Newton's laws of motion and Darwinian evolution each bind a host of different phenomena into a single explicatory framework.\n\n(46) In physics, one approach takes this impulse for unification to its extreme, and seeks a theory of everything—a single generative equation for all we see. It is becoming less clear, however, that such a theory would be a simplification, given the dimensions and universes that it might entail. Nonetheless, unification of sorts remains a major goal.\n\nThis tendency in the natural sciences has long been evident in the social sciences too. (47) Here, Darwinism seems to ofiferjustification, for if all humans share common origins, it seems reasonable to suppose that cultural diversity could also be traced to more constrained beginnings. Just as the bewildering variety of human courtship rituals might all be considered forms of sexual selection, perhaps the world 5 s languages, music, social and religious customs and even histoiy are governed by universal features. (48) To filte out what is unique firom what is shared might enable us to understand how complex cultural behavior arose and what guides it in evolutionary or cognitive terms.\n\nThat, at least, is the hope. But a comparative study of linguistic traits published on line today supplies a reality check. Russell Gray at the University ofAuckland and his colleagues consider the evolution of grammars in the light of two previous attempts to find universality in language.\n\nThe most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are bom with an innate language-acquisition capacity that dictates a universal grammar. A few generative rules are then sufficient to unfold the entire fundamental structure ofa language, which is why children can learn it so quickly.\n\n(49) The second, by Joshua Greenberg\" takes a more empirical approach to universality, identifidng traits (particularly in word order) shared by many languages, which are considered to represent biases that result fu)m cognitive constraints.\n\nGray and his colleagues have put them to the test by examining four family trees that between them represent more than 2,000 languages. (50) Chomsky's grammar should show patterns of language change that are independent of the family tree or the pathway tracked through it- whereas Greenbergian universality predicts strong c o dependencies between particular types of word-order relations. Neither of these patterns is borne out by the analysis, suggesting that the structures of the languages are lineagespecific and not governed by universals.\n"},{"year":2012,"sec":"questions","label":"阅读题目","text":"21. According to the first paragraph, peer pressure often emerges [A ] a supplement to the social cure [B ] a stimulus to group dynamics [C ] an obstacle to social progress [D ] a cause of undesirable behaviors\n\n22. Rosenberg holds that public-health advocates shou [A ] recruit professional advertisers [B ] learn from advertisers 5 experience [C ] stay away from commercial advertisers. [D ] recognize the limitations of advertisements\n\n23. In the author's view, Rosenberg 5 s book fails [A ] adequately probe social and biological fectors [B ] effectively evade the flaws of the social cure [C ] illustrate the functions of state funding [D ] produce a long-lasting social effect\n\n24. Paragraph 5 shows that our imitation ofbehavio [A ] is harmful to our networks of friends [B ] will mislead behavioral studies [C ] occurs without our realizing it [D ] can produce negative health habits\n\n25. The author suggests in the last paragraph that the effect of peer pressure [A ] harmful [B ] desirable [C ] profound [D ] questionable\n\n26. The phrase cc reneging on \" (Line 3, Para. 1) is closest in meaning [A ] condemning [B ] reaffirming [C ] dishonoring [D ] securing\n\n27. By entering into the 2002 agreement, Entergy intended t [A ] obtain protection from Vermont regulators [B ] seek favor from the federal legislature [C ] acquire an extension of its business license. [ D [ get permission to purchase a power pla\n\n28. According to Paragraph 4, Entergy seems to have problems with i [A ] managerial practices [B ] technical innovativeness [C ] financial goals [D ] business vision\n\n29. In the author's view, the Vermont case will te [A ] Entergy's capacity to fillfill all its promises [B ] the nature of states' patchwork regulations [C ] the federal authority over nuclear issues [D ] the limits of states 5 power over nuclear issues\n\n30. It can be inferred from the last paragraph th [A ] Entergy's business elsewhere might be affected [B ] the authority of the NRC will be defied [C ] Entergy will withdraw its Plymouth application [D ] Vermont 5 S reputation might be damaged\n\n31. According to the first paragraph, the process of discovery is characterized by i [A ] uncertainty and complexity [B ] misconception and deceptiveness [C ] logicality and objectivity [D ] systematicness and regularity\n\n32. It can be inferred from Paragraph 2 that the credibility process requir [A ] strict inspection. [B ] shared efforts [C ] individual wisdom [D ] persistent innovation\n\n33. Paragraph 3 shows that a discovery claim becomes credible after [A ] has attracted the attention of the general public [B ] has been examined by the scientific community [C ] has received recognition from editors and reviewers [D ] has been frequently quoted by peer scientists\n\n34. Albert Szent-Gyorgyi would most likely agree th [A ] scientific claims will survive challenges [B ] discoveries today inspire fixture research [C ] efforts to make discoveries arejustified [D ] scientific work calls for a critical mind\n\n35. Which of the following would be the best title of the tex [A ] Novelty as an Engine of Scientific Developmen [B ] Collective Scrutiny in Scientific Discovery [C ] Evolution of Credibility in Doing Science [D ] Challenge to Credibility at the Gate to Science\n\n36. It can be learned from the first paragraph th [A ] Teamsters still have a large body of members [B ] Jimmy Hoffa used to work as a civil servant [C ] unions have enlarged their public-sector membership [D ] the government has improved its relationship with unionists\n\n37. Which of the following is true of Paragraph 2 [A ] Public-sector unions are prudent in taking actions [B ] Education is required for public-sector union membership [C ] Labor Party has long been fighting against public-sector unions [D ] Public-sector unions seldom get in trouble for their actions\n\n38. It can be learned from Paragraph 4 that the income in the state sector [A ] illegally secured [B ] indirectly augmented [C ] excessively increased [D ] fairly adjusted\n\n39. The example of the unions in Wisconsin shows that unio [A ] often run against the current political system [B ] can change people's political attitudes [C ] may be a barrier to public-sector reforms [D ] are dominant in the government\n\n40. John Donahue 5 s attitude towards the public-sector system is one [A ] disapproval. [B ] appreciation [C ] tolerance [D ] indifference\n"},{"year":2012,"sec":"writing","label":"写作","text":"Some international students are coming to your university. Write them an email in the name of the Students' Union to\n\n1) extend your welcome an\n\n2) provide some suggestions for their campus life here\n\nmartB\n\n52. Direction\n\n2) explain its intended meaning, an\n"},{"year":2013,"sec":"cloze","label":"完形","text":"People are, on the whole, poor at considering background information when making individual decisions. At first glance this might seem like a strength that 1\\_ the ability to make judgments which are unbiased by \\_2\\_ factors. But Dr Uri Simonsohn speculated that an inability to consider the big 3 was leading decision-makers to be biased by the daily samples of information they were working with. \\_4�\\_, he theorised that a judge 5 of appearing too soft -�6- cnme might be more likely to send someone to prison 7 he had already sentenced five or six other defendants only to forced community service on that day.\n\nTo \\_\\_ 8\\_ this idea, he turned to the university-admissions process. In theory, the \\_9\\_ of an applicant should not depend on the few others 10 randomly for interview during the same day, but Dr Simonsohn suspected the truth was 11\n\nHe studied the results of 9,323 MBA interviews 12 by 31 admissions officers. The interviewers had 13 applicants on a scale of one to five. This scale 14 numerous factors into consideration. The scores were --- 15 used in conjunction with an applicant's score on the Graduate Management Admission Test, or GMAT, a standardised exam which is 16 out of 800 points, to make a decision on whether to accept him or her.\n\nDr Simonsohn found if the score of the previous candidate in a daily series of interviewees was 0.75 points or more higher than that of the one �1�7- that, then the score for the next applicant would --=1 =- 8- by an average of 0.075 points. This might sound small, but to -�1�9- the effects of such a decrease a candidate would need 30 more GMAT points than would otherwise have been 20\n\n1. [AJ grants [BJ submits [CJ transmits [DJ delivers\n\n2. [AJ minor [BJ external [CJ crucial [DJ objective\n\n3. [AJ issue [BJ vision [C] picture [D] moment\n\n4. [AJ Above all [B] On average [CJ In principle [D] For example\n\n5. [AJ fond [BJ fearful [CJ capable [DJ thoughtless\n\n6. [AJ in [B] for [CJ to [DJ on\n\n7. [AJ if [B] until [CJ though [DJ unless\n\n8. [AJ test [B] emphasize [CJ share [D] promote\n\n9. [ A J decision [B] quality [C] status [D] success\n\n10. [AJ found [BJ studied [CJ chosen [DJ identified\n\n11. [ A J otherwise [BJ defensible [CJ replaceable [D] exceptional\n\n12. [AJ inspired [B] expressed [C] conducted [DJ secured\n\n13. [AJ assigned [BJ rated [C] matched [D] arranged\n\n14. [AJ put [B] got [CJ took [DJ gave\n\n15. [AJ instead [BJ then [CJ ever [DJ rather\n\n16. [ A J selected [BJ passed [C] marked [DJ introduced\n\n17. [AJ below [B] after [CJ above [DJ before\n\n18. [AJjump [B] float [CJ fluctuate [DJ drop\n\n19. [AJ achieve [BJ undo [C] maintain [D] disregard\n\n20. [AJ necessary [B] possible [CJ promising [DJ helpful\n"},{"year":2013,"sec":"partb","label":"新题型","text":"martB\n\nIn the following text, some sentences have been removed. For Questions 41-45, choose the most suitable one from the list A-G to fit into each of the numbered blanks. There are two extra choices, which do not fit in any of the blanks. Mark your answers on ANSWER SHEET. (10 points)\n\nThe social sciences are flourishing. As of 2005, there were almost half a million professional social scientists from all fields in the world, working both inside and outside academia. According to the World Social Science Report 2010, the number of social-science students worldwide has swollen by about 11 % every year since 2000.\n\nYet this enormous resource is not contributing enough to today's global challenges, including climate change, security, sustainable development and health. ( 4 1 ) Humanity has the necessary agro-technological tools to eradicate hunger, from genetically engineered crops to artificial fertilizers. Here, too, the problems are social: the organization and distribution of food, wealth and prosperity.\n\n(42) This is a shame - the community should be graspmg the opportunity to raise its influence in the real world. To paraphrase the great social scientist Joseph Schumpeter: there is no radical innovation without creative destruction.\n\nToday, the social sciences are largely focused on disciplinary problems and internal scholarly debates, rather than on topics with external impact. Analyses reveal that the number of papers including the keywords \"environmental change\" or \"climate change\" have increased rapidly since 2004. (43)\n\nWhen social scientists do tackle practical issues, their scope is often local: Belgium is interested mainly in the effects of poverty on Belgium, for example. And whether the community's work contributes much to an overall accumulation of knowledge is doubtful.\n\nThe problem is not necessarily the amount of available funding. ( 44 ) This is an adequate amount so long as it is aimed in the right direction. Social scientists who complain about a lack of funding should not expect more in today's economic climate.\n\nThe trick is to direct these funds better. The European Union Framework funding programs have long had a category specifically targeted at social scientists. This year, it was proposed that the system be changed: Horizon 2020, a new program to be enacted in 2014, would not have such a category. This has resulted in protests from social scientists. But the intention is not to neglect social science; rather, the complete opposite. (45) That should create more collaborative endeavors and help to develop projects aimed directly at solving global problems.\n\n[A] The idea is to force social scientists to integrate their work with other categories, including health and demographic change; food security; marine research and the bio-economy; clean, efficient energy; and inclusive, innovative and secure societies.\n\n[B] The solution is to change the mindset of the academic community, and what it considers to be its main goal. Global challenges and social innovation ought to receive much more attention from scientists, especially the young ones.\n\n[C] It could be that we are evolving two communities of social scientists: one that is discipline-oriented and publishing in highly specialized journals, and one that is problem-oriented and publishing elsewhere, such as policy briefs.\n\n[D] However, the numbers are still small: in 20 10, about 1,600 of the 100,000 social-sciences papers published globally included one of these keywords.\n\n[E] These issues all have root causes in human behavior: all require behavioral change and social innovations, as well as technological development. Steming climate change, for example, is as much about changing consumption patterns and promoting tax acceptance as it is about developing clean energy.\n\n[F] Despite these factors, many social scientists seem reluctant to tackle such problems. And in Europe, some are up in arms over a proposal to drop a specific funding category for social-science research and to integrate it within cross-cutting topics of sustainable development.\n\n[G] During the late 1990s, national spending on social sciences and the humanities as a percentage of all research and development funds - including government, higher education, non-profit and corporate - varied from around 4% to 25%; in most European nations, it is about 15%.\n"},{"year":2013,"sec":"partc","label":"翻译","text":"mart`\n\nIt is speculated that gardens arise from a basic human need in the individuals who made them: the need for creative expression. There is no doubt that gardens evidence an irrepressible urge to create, express, fashion, and beautify and that self-expression is a basic human urge; ( 46) yet when one looks at the photographs of the gardens created by the homeless, it strikes one that, for all their diversity of styles, these gardens speak of various other fundamental urges, beyond that of decoration and creative expression.\n\nOne of these urges has to do with creating a state of peace in the midst of turbulence, a \"still point of the turning world,\" to borrow a phrase from T. S. Eliot. ( 4 7) A sacred place of peace, however crude it may be, is a distinctly human need, as opposed to shelter, which is a distinctly animal need. This distinction is so much so that where the latter is lacking, as it is for these unlikely gardeners, the former becomes all the more urgent. Composure is a state of mind made possible by the structuring of one's relation to one's environment. ( 48) The gardens of the homeless, which are in effect homeless gardens, introduce form into an urban environment where it either didn't exist or was not discernible as such. In so doing they give composure to a segment of the inarticulate environment in which they take their stand.\n\nAnother urge or need that these gardens appear to respond to, or to arise from, is so intrinsic that we are barely ever conscious of its abiding claims on us. When we are deprived of green, of plants, of trees, ( 49) most of us give in to a demoralization of spirit which we usually blame on some psychological conditions, until one day we find ourselves in a garden and feel the oppression vanish as if by magic. In most of the homeless gardens of New York City the actual cultivation of plants is unfeasible, yet even so the compositions often seem to represent attempts to call forth the spirit of plant and animal life, if only symbolically, through a clumplike arrangement of materials, an introduction of colors, small pools of water, and a frequent presence of petals or leaves as well as of stuffed animals. On display here are various fantasy elements whose reference, at some basic level, seems to be the natural world. (50) 1t is this implicit or explicit reference to nature that fully justifies the use of the word garden, though in a \"liberated\" sense, to describe these synthetic constructions. In them we can see biophilia - a yearning for contact with nonhuman life - assuming uncanny representational forms.\n"},{"year":2013,"sec":"questions","label":"阅读题目","text":"2 1. Priestly criticizes her assistant for her [A] insensitivity to fashion. [B] obsession with high fashion. [C] poor bargaining skill. [D] lack of imagination.\n\n22. According to Cline, mass-market labels urge consumers to [A] combat unnecessary waste. [B] shop for their garments more frequently. [C] resist the inf l uence of advertisements. [D] shut out the feverish fashion world.\n\n23. The word \"indictment\" (Line 3, Para.2) is closest in meaning to [A] tolerance. [B] indifference. [C] enthusiasm. [D] accusation.\n\n24. Which of the following can be inferred from the last paragraph? [A] Vanity has more often been found in idealists. [B] The fast-fashion industry ignores sustainability. [C] Pricing is vital to environment-friendly purchasing. [D] People are more interested in unaffordable garments.\n\n25. What is the subject of the text? [A] Satire on an extravagant lifestyle. [B] Challenge to a high-fashion myth. [C] Criticism of the fast-fashion industry. [D] Exposure of a mass-market secret.\n\n26. It is suggested in Paragraph 1 that \"behavioural\" ads help advertisers to [A] provide better on line services. [BJ ease competition among themselves. [CJ avoid complaints from consumers. [D] lower their operational costs.\n\n27. \"the industry\" (Line 5, Para.3) refers to [A] internet browser developers. [BJ digital information analysts. [C] e-commerce conductors. [D] on line advertisers.\n\n28. Bob Liodice holds that setting DNT as a default [A] may cut the number of junk ads. [BJ fails to affect the ad industry. [C] will not benefit consumers. [D] goes against human nature.\n\n29. Which of the following is true according to Paragraph 6? [A] Advertisers are willing to implement DNT. [B] DNT may not serve its intended purpose. [C] DNT is losing its popularity among consumers. [D] Advertisers are obliged to ofer behavioural ads.\n\n30. The author's attitude towards what Brendon Lynch said in his blog is one of [A] indulgence. [B] understanding. [ CJ appreciation. [D] skepticism.\n\n31. Our vision of the future used to be inspired by [A] our desire for lives of fulfillment. [B] our faith in science and technology. [C] our awareness of potential risks. [D] our belief in equal opportunity.\n\n32. The IUCN's \"Red List\" suggests that human beings are [A] a sustained species. [B] the world's dominant power. [C] a threat to the environment. [D] a misplaced race.\n\n33. Which of the following is true according to Paragraph 5? [A] The interest in science fiction is on the rise. [B] Arc helps limit the scope of futurological studies. [C] Technology ofers solutions to social problems. [D] Our immediate future is hard to conceive.\n\n34. To ensure the future of mankind, it is crucial to [A] adopt an optimistic view of the world. [B] draw on our experience from the past. [C] explore our planet's abundant resources. [D] curb our ambition to reshape history.\n\n35. Which of the following would be the best title for the text? [A] The Ever-bright Prospects of Mankind. [B] Science, Technology and Humanity. [C] Evolution of the Human Species. [D] Uncertainty about Our Future.\n\n36. Three provisions of Arizona's plan were overturned because they [A] disturbed the power balance between different states. [BJ overstepped the authority of federal immigration law. [CJ deprived the federal police of Constitutional powers. [D] contradicted both the federal and state policies.\n\n37. On which of the following did the Justices agree, according to Paragraph 4? [AJ Congress's intervention in immigration enforcement. [BJ Federal officers' duty to withhold immigrants' information. [CJ States' legitimate role in immigration enforcement. [DJ States' independence from federal immigration law.\n\n38. It can be inferred from Paragraph 5 that the Alien and Sedition Acts [ A J stood in favor of the states. [BJ supported the federal statute. [CJ undermined the states' interests. [D] violated the Constitution.\n\n39. The White House claims that its power of enforcement [A] is dependent on the states' support. [BJ is established by federal statutes. [CJ outweighs that helld by the states. [D] rarely goes against state laws.\n\n40. What can be learned from the last paragraph? [ A J Immigration issues are usually decided by Congress. [BJ The Administration is dominant over immigration issues. [CJ Justices wanted to strengthen its coordination with Congress. [DJ Justices intended to check the power of the Administration.\n"},{"year":2013,"sec":"writing","label":"写作","text":"mart^\n\nWrite an e-mail of about 100 words to a foreign teacher in your college, inviting him/her to be a judge for the upcoming English speech contest.\n\nYou should include the details you think necessary.\n\nmartB\n"},{"year":2014,"sec":"cloze","label":"完形","text":"As many people hit middle age, they often start to notice that their memory and mental clarity are not what they used to be. We suddenly can't remember 1 we put the keys just a moment ago, or an old acquaintance's name, or the name of an old band we used to love. As the brain 2 we refer to these occurrences as \"senior moments.\" 3 seemingly innocent, this loss of mental focus can potentially have a(n) 4 impact on our professional, social, and personal 5\n\nNeuroscientists, experts who study the nervous system, are increasingly showing that there's actually a lot that can be done. It 6 out that the brain needs exercise in much the same way our muscles do, and the right mental 7 can significantly improve our basic cognitive 8 . Thinking is essentially a 9 of making connections in the brain. To a certain extent, our ability to 10 in making the connections that drive intelligence is inherited. 1 1 because these connections are made through effort and practice, scientists believe that intelligence can expand and fluctuate 12 mental effort.\n\nNow, a new Web-based company has taken it a step 13 and developed the first \"brain training program\" designed to actually help people improve and regain their mental 14\n\nThe Web-based program 15 you to systematically improve your memory and attention skills. The program keeps 16 of your progress and provides detailed feedback 1 7 your performance and improvement. Most importantly, it 18 modifies and enhances the games you play to 19 on the strengths you are developing - much like a(n) 20 exercise routine requires you to increase resistance and vary your muscle use.\n\n1. [AJ that [BJ when [CJ why [DJ where\n\n2. [AJ fades [BJ improves [CJ collapses [DJ recovers\n\n3. [AJ Unless [BJ While [CJ Once [DJ If\n\n4. [ A J damaging [BJ limited [CJ uneven [DJ obscure\n\n5. [ A J relationship [BJ environment [ CJ wellbeing [DJ outlook\n\n6. [AJ figures [BJ finds [CJ points [DJ turns\n\n7. [ A J responses [BJ associations [ CJ workouts [DJ roundabouts\n\n8. [AJ genre [BJ criterion [ CJ circumstances [DJ functions\n\n9. [AJ channel [BJ process [CJ condition [DJ sequence\n\n10. [AJ persist [BJ feature [CJ excel [DJ believe\n\n11. [AJ However [BJ Moreover [ CJ Otherwise [DJ Therefore\n\n12. [AJ according to [BJ regardless of [CJ apart from [DJ instead of\n\n13. [AJ back [BJ further [CJ aside [DJ around\n\n14. [AJ framework [BJ stability [CJ flexibility [DJ sharpness\n\n15. [AJ hurries [BJ reminds [CJ allows [DJ forces\n\n16. x^g order xBg track x`g pace xag hold\n\n17. [AJ on [BJ to [CJ for [DJ with\n\n18. x^g habitually xBg constantly x`g irregularly xag unusually\n\n19. [AJ cary [BJ put [CJ build [DJ take\n\n20. [AJ idle [BJ risky [CJ familiar [DJ effective\n"},{"year":2014,"sec":"partb","label":"新题型","text":"martB\n\nThe following paragraphs are given in a wrong order. For Questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-G and filling them into the numbered boxes. Paragraphs A and E have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\n\n[A] Some archaeological sites have always been easily observable - for example, the Parthenon in Athens, Greece; the pyramids of Giza in Egypt; and the megaliths of Stonehenge in southern England. But these sites are exceptions to the norm. Most archaeological sites have been located by means of careful searching, while many others have been discovered by accident. Olduvai Gorge, an early hominid site in Tanzania, was found by a butterfly hunter who literally fell into its deep valley in 19 11. Thousands of Aztec artifacts came to light during the digging of the Mexico City subway in the 1970s.\n\n[B] In another case, American archaeologists Rene Million and George Cowgill spent years systematically mapping the entire city of Teotihuacan in the Valley of Mexico near what is now Mexico City. At its peak around AD 600, this city was one of the largest human settlements in the world. The researchers mapped not only the city's vast and ornate ceremonial areas, but also hundreds of simpler apartment complexes where common people lived.\n\n[C] How do archaeologists know where to find what they are looking for when there is nothing visible on the surface of the ground? Typically, they survey and sample (make test excavations on) large areas of terrain to determine where excavation will yield useful information. Surveys and test samples have also become important for understanding the larger landscapes that contain archaeological sites.\n\n[D] Surveys can cover a single large settlement or entire landscapes. In one case, many researchers working around the ancient Maya city of Copan, Honduras, have located hundreds of small rural villages and individual dwellings by using aerial photographs and by making surveys on foot. The resulting settlement maps show how the distribution and density of the rural population around the city changed dramatically between AD 500 and 850, when Copan collapsed.\n\n[E] To find their sites, archaeologists today rely heavily on systematic survey methods and a variety of high-technology tools and techniques. Airborne technologies, such as different types of radar and photographic equipment carried by airplanes or spacecraft, allow archaeologists to learn about what lies beneath the ground without digging. Aerial surveys locate general areas of interest or larger buried features, such as ancient buildings or fields.\n\n[F] Most archaeological sites, however, are discovered by archaeologists who have set out to look for them. Such searches can take years. British archaeologist Howard Carter knew that the tomb of the Egyptian pharaoh Tutankhamun existed from information found in other sites. Carter sifted through rubble in the Valley of the Kings for seven years before he located the tomb in 1922. In the late 1800s British archaeologist Sir Arthur Evans combed antique dealers' stores in Athens, Greece. He was searching for tiny engraved seals attributed to the ancient Mycenaean culture that dominated Greece from the 1400s to 1200s BC. Evans's interpretations of these engravings eventually led him to find the Minoan palace at Knossos (Knos6s ), on the island of Crete, in 1900.\n\n[G] Ground surveys allow archaeologists to pinpoint the places where digs will be successful. Most ground surveys involve a lot of walking, looking for surface clues such as small fragments of pottery. They often include a certain amount of digging to test for buried materials at selected points across a landscape. Archaeologists also may locate buried remains by using such technologies as ground radar, magnetic-field recording, and metal detectors. Archaeologists commonly use computers to map sites and the landscapes around sites. Twoand three-dimensional maps are helpful tools in planning excavations, illustrating how sites look, and presenting the results of archaeological research.\n"},{"year":2014,"sec":"partc","label":"翻译","text":"mart`\n\nMusic means different things to different people and sometimes even different things to the same person at different moments of his life. It might be poetic, philosophical, sensual, or mathematical, but in any case it must, in my view, have something to do with the soul of the human being. Hence it is metaphysical; but the means of expression is purely and exclusively physical: sound. I believe it is precisely this permanent coexistence of metaphysical message through physical means that is the strength of music. ( 46) It is also the reason why when we try to describe music with words, all we can do is articulate our reactions to it, and not grasp music itself.\n\nBeethoven's importance in music has been principally defined by the revolutionary nature of his compositions. He freed music from hitherto prevailing conventions of harmony and structure. Sometimes I feel in his late works a will to break all signs of continuity. The music is abrupt and seemingly disconnected, as in the last piano sonata. In musical expression, he did not feel restrained by the weight of convention. ( 4 7) By all accounts he was a freethinking person, and a courageous one, and I find courage an essential quality for the understanding, let alone the performance, of his works.\n\nThis courageous attitude in fact becomes a requirement for the performers of Beethoven's music. His compositions demand the performer to show courage, for example in the use of dynamics. ( 48) Beethoven's habit of increasing the volume with an extreme intensity and then abruptly following it with a sudden soft passage was only rarely used by composers before him.\n\nBeethoven was a deeply political man in the broadest sense of the word. He was not interested in daily politics, but concerned with questions of moral behavior and the larger questions of right and wrong affecting the entire society. ( 49) Especially significant was his view of freedom, which, for him, was associated with the rights and responsibilities of the individual: he advocated freedom of thought and of personal expression.\n\nBeethoven's music tends to move from chaos to order as if order were an imperative of human existence. For him, order does not result from forgetting or ignoring the disorders that plague our existence; order is a necessary development, an improvement that may lead to the Greek ideal of spiritual elevation. It is not by chance that the Funeral March is not the last movement of the Eroica Symphony, but the second, so that suffering does not have the last word. (50) One could interpret much of the work of Beethoven by saying that suffering is inevitable, but the courage to fight it renders life worth living.\n"},{"year":2014,"sec":"questions","label":"阅读题目","text":"21. George Osborne's scheme was intended to [AJ encourage jobseekers' active engagement in job seeking. [BJ provide the unemployed with easier access to benefits. [CJ guarantee jobseekers' legitimate right to benefits. [DJ motivate the unemployed to report voluntarily.\n\n22. The phrase \"to sign on\" (Line 3, Para. 2) most probably means [ A J to check on the availability of jobs at the jobcentre. [BJ to accept the government's rest r ictions on the allowance. [CJ to register for an allowance from the government. [DJ to attend a gover n mental job-training program.\n\n23. What prompted the chancellor to develop his scheme? [ A J A desire to secure a better life for all. [BJ An eagerness to protect the unemployed. [CJ An urge to be generous to the claimants. [DJ A passion to ensure fairness for taxpayers.\n\n24. According to Paragraph 3, being unemployed makes one feel [A] uneasy. [BJ insulted. [CJ enraged. [DJ guilty.\n\n25. To which of the following would the author most probably agree? [A] Unemployment benefits should not be made conditional. [BJ The British welfare system indulges jobseekers' laziness. [CJ The jobseekers' allowance has met their actual needs. [D] Osborne's reforms will reduce the risk of unemployment.\n\n26. A lot of students take up law as their profession due to [A] the growing demand from clients. [B] the increasing pressure of inflation. [C] the prospect of working in big firms. [D] the attraction of financial rewards.\n\n27. Which of the following adds to the costs of legal education in most American states? [A] Higher tuition fees for undergraduate studies. [B] Receiving training by professional associations. [C] Admissions approval from the bar association. [D] Pursuing a bachelor's degree in another major.\n\n28. Hindrance to the reform of the legal system originates from [A] the rigid bodies governing the profession. [B] lawyers' and clients' strong resistance. [C] the stem exam for would-be lawyers. [D] non-professionals' sharp criticism.\n\n29. The guild-like ownership structure is considered \"restrictive\" partly because it [A] prevents lawyers from gaining due profits. [B] bans outsiders' involvement in the profession. [C] aggravates the ethical situation in the trade. [D] keeps lawyers from holding law-firm shares.\n\n30. In this text, the author mainly discusses [A] the factors that help make a successful lawyer in America. [B] a problem in America's legal profession and solutions to it. [CJ the role of undergraduate studies in America's legal education. [D] flawed ownership of America's law firms and its causes.\n\n3 1. The Fundamental Physics Prize is seen as [A] a symbol of the entrepreneurs' wealth. [B] a handsome reward for researchers. [CJ a possible replacement of the Nobel Prizes. [D] an example of bankers' investments.\n\n32. The critics think that the new awards will most benefit [A] the profit-oriented scientists. [BJ the achievement-based system. [C] the founders of the new awards. [D] peer-review-led research.\n\n33. The discovery of the Higgs boson is a typical case which involves [A] legitimate concerns over the new prizes. [BJ controversies over the recipients' status. [C] the joint effort of modem researchers. [DJ the demonstration of research findings.\n\n34. According to Paragraph 4, which of the following is true of the Nobels? [A] History has never cast doubt on them. [BJ Their endurance has done justice to them. [CJ They are the most representative honor. [DJ Their legitimacy has long been in dispute.\n\n35. The author believes that the new awards are [A] unworthy
