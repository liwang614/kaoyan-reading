"sec":"writing","label":"写作","text":"51. Direction\n\nThe Student Union o fyour university has assigned you to inform the international students about an upcoming singing contest. Write a notice in about 100 words.\n\n52. Direction\n\n2) interpret the implied meaning, an\n"},{"year":2021,"sec":"cloze","label":"完形","text":"Fluid intelligence is the type of intelligence that has to do with short-term memory and the ability to think quickly, logically, and abstractly in order to solve new problems. It \\_1\\_ in young adulthood, levels out for a period of time, and then \\_2\\_ starts to slowly decline as we age. But 3 aging is inevitable, scientists are finding out that certain changes in brain function may not be.\n\nOne study found that muscle loss and the 4 of body fat around the abdomen are associated with a decline in fluid intelligence. This suggests the 5 that lifestyle factors might help prevent or 6 this type of decline.\n\nThe researchers looked at data that 7 measurements of lean muscle and abdominal fat from more than 4,000 middle-to-older-aged men and women and 8 that data to reported changes in fluid intelligence over a six-year period. They found that middle-aged people 9 higher measures of abdominal fat 10 worse on measures of fluid intelligence as the years 11\n\nFor women, the association may be 12 to changes in immunity that resulted from excess abdominal fat; in men, the immune system did not appear to be 13 . It is hoped that future studies could 14 these differences and perhaps lead to different 15 for men and women.\n\n16 there are steps you can 17 to help reduce abdominal fat and maintain lean muscle mass as you age in order to protect both your physical and mental 18 The two highly recommended lifestyle approaches are maintaining or increasing your 19 of aerobic exercise and following Mediterranean-style 20 that is high in fiber and eliminates highly processed foods.\n\n1. [A] pauses [B] returns [C] peaks [D] fades 2. [A] alternatively [B] formally [C] accidentally [D] generally 3. [A] while [B] since [C] once [D] until 4. [A] detection [B] accumulation [C] consumption [D] separation 5. [A] possibility [B] decision [C] goal [D] requirement 6. [A] delay [B] ensure [C] seek [D] utilize 7. [A] modified [B] supported [C] included [D] predicted 8. [A] devoted [B] compared [C] converted [D] applied 9. [A] with [B] above [C] by [D] against 10. [A] lived [B] managed [C] scored [D] played 11. [A] ran out [B] set off [C] drew in [D] went by 12. [A] superior [B] attributable [C] parallel [D] resistant 13. [A] restored [B] isolated [C] involved [D] controlled 14. [A] alter [B] spread [C] remove [D] explain 15. [A] compensations [B] symptoms [C] demands [D] treatments 16. [A] Likewise [B] Meanwhile [C] Therefore [D] Instead 17. [A] change [B] watch [C] count [D] take 18. [A] well-being [B] process [C] formation [D] coordination 19. [A] level [B] love [C] knowledge [D] space 20. [A] design [B] routine [C] diet [D] prescription\n"},{"year":2021,"sec":"partb","label":"新题型","text":"Part .B\n\nIn the following text, some sentences have been removed. For Questions 41-45, choose the most suitable one from the list A-G to fit into each of the numbered blanks. There are two extra choices, which do not fit in any of the blanks. Mark your answers on the ANSWER SHEET. (10 points)\n\nIn the movies and on television, artificial intelligence is typically depicted as something sinister that will upend our way of life. When it comes to AI in business, we often hear about it in relation to automation and the impending loss of jobs, but in what ways is AI changing companies and the larger economy that don't involve doom-and gloom mass unemployment predictions?\n\nA recent survey of manufacturing and service industries from Tata Consultancy Services found that companies currently use AI more often in computer-to-computer activities than in automating human activities. Here are a few ways AI is aiding companies without replacing employees:\n\nBetter hiring practices\n\nCompanies are using artificial intelligence to remove some of the unconscious bias from hiring decisions. \"There are experiments that show that, naturally, the results of interviews are much more biased than what AI does,\" says Pedro Domingos, author of The Master Algorithm: How the Quest for the Ultimate Learning Machine Will Remake Our World and a computer science professor at the University of Washington. \" ( 41) - 99 One company that's doing this is called Blendoor. It uses analytics to help identify where there may be bias in the hiring process.\n\nMore effective marketing\n\nSome AI software can analyze and optimize marketing email subject lines to increase open rates. One company in the UK, Phrasee, claims their software can outperform humans by up to 10 percent when it comes to email open rates. This can mean millions more in revenue. (42) These are \"tools that help people use data, not a replacement for people,\" says Patrick H. Winston, a professor of artificial intelligence and computer science at MIT.\n\nSaving customers money\n\nEnergy companies can use AI to help customers reduce their electricity bills, saving them money while helping the environment. Companies can also optimize their own energy use and cut down on the cost of electricity. Insurance companies, meanwhile, can base their premiums on AI models that more accurately access risk. Domingos says, \"(43) - 99\n\nImproved accuracy\n\n\"Machine learning often provides a more reliable form of statistics which makes data more valuable,\" says Winston. It \"helps people make smarter decisions.\" (44)\n\nProtecting and maintaining infrastructure\n\nA number of companies, particularly in energy and transportation, use AI image processing technology to inspect infrastructure and prevent equipment failure or leaks before they happen. \"If they fail first and then you fix them , it's very expensive,\" says Domingos. \"(45) 99\n\n[A] AI replaces the boring parts of your job. If you're doing research, you can have AI go out and look for relevant sources and information that otherwise you just wouldn't have time for.\n\n[ B] One accounting firm, BY, uses an AI system that helps review contracts during an audit. This process, along with employees reviewing the · contracts, is faster and more accurate.\n\n[ C] There are also companies like Acquisio, which analyzes advertising performance across multiple channels like Adwords, Bing and social media and makes adjustments or suggestions about where advertising funds will yield best results.\n\n[ D] You want to predict if something needs attention now and point to where it's useful for employees to go to.\n\n[ E] Before, they might not insure the ones who felt like a high risk or charge them too much, or they would charge them too little and then it would cost the company money.\n\n[ F] We're also giving our customers better channels versus picking up the phone to accomplish something beyond human scale.\n\n[ G] AI looks at resumes in greater numbers than humans would be able to, and selects the more promising candidates .\n"},{"year":2021,"sec":"partc","label":"翻译","text":"World War II was the watershed event for higher education in modem Western societies. (46) Those societies came out of the war with levels of enrollment that had been roughly constant at 3-5% of the relevant age groups during the decades before the war. But after the war, great social and political changes arising out of the successful war against Fascism created a growing demand in European and American economies for increasing numbers of graduates with more than a secondary school education. (47) And the demand that rose in those societies for entry to higher education extended to groups and social classes that had not thought of attending a university before the war. These demands resulted in a very rapid expansion of the systems of higher education, beginning in the 1960s and developing very rapidly (though unevenly) during the 1970s and 1980s.\n\nThe growth of higher education manifests itself in at least three quite different ways, and these in turn have given rise to different sets of problems. There was first the rate of growth: ( 48) in many countries of Western Europe, the numbers of students in higher education doubled within five-year periods during the 1960s and doubled again in seven, eight, or 10 years by the middle of the 1970s. Second, growth obviously affected the absolute size both of systems and individual institutions. And third, growth was reflected in changes in the proportion of the relevant age group enrolled in institutions of higher education.\n\nEach of these manifestations of growth carried its own peculiar problems in its wake. For example, a high growth rate placed great strains on the existing structures of governance, of administration, and above all of socialization. When a faculty or department grows from, say, five to 20 members within three or four years, ( 49) and when the new staff are predominantly young men and women fresh from postgraduate study, they largely define the norms of · academic life in that faculty. And if the postgraduate student population also grows rapidly and there is loss of a close apprenticeship relationship between faculty members and students, the student culture becomes the chief socializing force for new postgraduate students, with consequences for the intellectual and academic life of the institution-this was seen in America as well as in France, Italy, West Germany, and Japan. ( 50) High growth rates increased the chances for academic innovation; they also weakened the forms and processes by which teachers and students are admitted into a community of scholars during periods of stability or slow growth. In the 1960s and 1970s, European universities saw marked changes in their governance arrangements, with empowerment of junior faculty and to some degree of students as well.\n"},{"year":2021,"sec":"questions","label":"阅读题目","text":"21. The author holds that this year's increase in rail passenger fares [A] has kept pace with inflation. [ B] is a big surprise to commuters. [ C] remains an unreasonable measure. [ D] will ease train operators' burden.\n\n22. The stockbroker in Paragraph 2 is used to stand for [ A] car drivers. [ B] rail travelers. [ C] local investors. [ D] ordinary taxpayers.\n\n23. It is indicated in Paragraph 3 that train operators [ A] are ofering compensation to commuters. [ B] are trying to repair relations with the unions. [ C] have faUed to provide an adequate service. [ D] have suffered huge losses owing to the strikes.\n\n24. If unable to calm down passengers, the railways may have to face [ A] the loss of investment. [ B] the collapse of operations. [ C] a reduction of revenue. [ D] a change of ownership.\n\n25. Which of the following would be the best title for the text? [ A] Who Are to Blame for the Strikes? [ B] Constant Complaining Doesn't Work [ C] Can Nationalisation Bring Hope? [ D] Ever-rising Fares Aren't Sustainable\n\n26. According to the first two paragraphs, CCT programs aim to [A] facilitate healthcare reform. [ B] help poor families get better of. [ C] improve local education systems. [ D] lower deforestation rates.\n\n27. The study based on an area in Mexico is cited to show that [ A] cattle raising has been a major means of livelihood for the poor. [ B] CCT programs have helped preserve traditional lifestyles. [ C] antipoverty efforts require the participation of local farmers. [ D] economic growth tends to cause environmental degradation.\n\n28. In his study about Indonesia, Feraro intends to find out [A] its acceptance level of CCTs. [ B] its annual rate of poverty alleviation. [ C] the relation of CCTs to its forest loss. [ D] the role of its forests in climate change.\n\n29. According to Ferraro, the CCT program in Indonesia is most valuable in that [ A] it will benefit other Asian countries. [ B] it will reduce regional inequality. [ C] it can protect the environment. [ D] it can benefit grain production.\n\n30. What is the text centered on? [A] The effects of a program. [ B] The debates over a program. [ C] The process of a study. [ D] The transferability of a study.\n\n31. According to Paragraph 1, the author's posts on Twitter [ A] changed people's impression of the Victorians. [ B] highlighted social media's role in Victorian studies. [ C] re-evaluated the Victorian's notion of public image. [ D] illustrated the development of Victorian photography.\n\n32. What does the author say about the Victorian portraits he has collected? [ A] They are in popular use among historians. [ B] They are rare among photographs of that age. [ CJ They mirror 19th-century social conventions. [ D] They show effects of different exposure times.\n\n33. What might have kept the Victorians from smiling for pictures in the 1890s? [ A] Their inherent social sensitiveness. [ B] Their tension before the camera. [ C] Their distrust of new inventions. [ D] Their unhealthy dental condition.\n\n34. Mark Twain is quoted to show that the disapproval of smiles in pictures was [ A] a deep-root belief. [ B] a misguided attitude. [ C] a controversial view. [ D] a thought-provoking idea.\n\n35. Which of the following questions does the text answer? [ A] Why did most Victorians look stem in photographs? [ B] Why did the Victorians start to view photographs? [ C] What made photography develop in the Victorian period? [ D] How did smiling in photographs become a post-Victorian norm?\n\n36. There has long been concern that broadband providers would [A] bring web-based firms under control. [ B] slow down the traffic on their network. [ C] show partiality in treating clients. [ D] intensify competition with their rivals.\n\n37. Faced with the demand for net neutrality rules, the FCC [ A] sticks to an out-of-date order. [ B] takes an anti-regulatory stance. [ C] has issued a special resolution. [ D] has allowed the states to intervene.\n\n38. What can be learned about AT&T from Paragraph 3? [ A] It protects against unfair competition. [ B ] It engages in anti-competitive practices. [ C] It is under the FCC's investigation. [ D] It is in pursuit of quality service.\n\n39. Judge Patricia Millett argues that the appeals court's decision [ A] focus on trivialities. [ B] conveys an ambiguous message. [ C] is at odds with its earlier rulings. [ D] is out of touch with reality.\n\n40. What does the author argue in the last paragraph? [ A] Congress needs to take action to ensure net neutrality. [ B] The FCC should be put under strict supervision. [ C] Rules need to be set to diversify on line services. [ D] Broadband providers' rights should be protected.\n"},{"year":2021,"sec":"writing","label":"写作","text":"Part\n\nA foreign friend of yours has recently graduated from college and intends to find a job in China. Write him/her an email to make some suggestions.\n\n3) give your comments.\n"},{"year":2022,"sec":"cloze","label":"完形","text":"The idea that plants have some degree of consciousness first took root in the early 2000s; the term \" plant neurobiologyw as ] around the notion that some aspects of plant behavior could be 2 to intelligence in animals. 3 plants lack brains, the firing of electrical signals in their stems and leaves nonetheless triggered responses that 4 consciousness , researchers previously reported.\n\nBut such an idea is untrue, according to a new opinion article. Plant biology is complex and fascinating, but it 5 so greatly from that of animals that so-called 6 of plants' intelligence is inconclusive, the authors wrote.\n\nBeginning in 2006, some scientists have 7 that plants possess neuron-like cells that interact with hormones and neurotransmitters, 8 \"a plant nervous system, 9 to that in anim als,said lead study author Lincoln Taiz. \"They 10 claimed that plants have 6 brain-like command centers 9 at their root tips.\"\n\nThis 11 makes sense ifyou simplify the workings ofa complex brain, 12 it to an array of electrical pulses; cells in plants also communicate through electrical signals. 13 , the signaling in a plant is only 14 similar to the firing in a complex animal brain, which is more than \"a mass of cells that communicate by electricity,T aiz said.\n\n\" For consciousness to evolve, a brain with a threshold 15 of complexity and capacity is required/ 9 he 16 . \" Since plants don't have nervous systems, the 17 that they have consciousness are effectively zero.\n\nAnd what's so great about consciousness, anyway? Plants can't run away from 18 , so investing energy in a body system which 19 a threat and can feel pain would be a very 20 evolutionary strategy, according to the article.\n\n1. [A] coined [B] discovered [C] collected [D] issued 2. [A] attributed [B] directed [C] compared [D] confined 3. [A] Unless [B] When [C] Once [D] Though 4. [A] coped with [B] consisted of [C] hinted at [D] extended to 5. [A] suffers [B] benefits [C] develops [D] differs 6. [A] acceptance [B] evidence [C] cultivation [D] creation 7. [A] doubted [B] denied [C] argued [D] requested 8. [A] adapting [B] forming [C] repairing [D] testing 9. [A] analogous [B] essential [C] suitable [D] sensitive 10. [A] just [B] ever [C] still [D] even 11. [A] restriction [B] experiment [C] perspective [D] demand 12. [A] attaching [B] reducing [C] returning [D] exposing 13. [A] However [B] Moreover [C] Therefore [D] Otherwise 14. [A] temporarily [B] literally [C] superficially [D] imaginarily 15. [A] list [B] level [C] label [D] load 16. [A] recalled [B] agreed [C] questioned [D] added 17. [A] chances [B] risks [C] excuses [D] assumptions 18. [A] danger [B] failure [C] warning [D] control 19. [A] represents [B] includes [C] reveals [D] recognizes 20. [A] humble [B] poor [C] practical [D] easy\n"},{"year":2022,"sec":"partb","label":"新题型","text":"In the following text, there are five people's opinions about Emma Manis's article \" The Case Against Zoos\". For Questions 41-45, choose the best statement from the list A-G to summarize each numbered person 9 s opinion. There are two extra choices which do not fit in any of the blanks. Mark your answers on the ANSWER SHEET. (10 points)\n\n(41) Teri B yrd\n\nI was a zoo and wildlife park employee for years. Both the wildlife park and zoo claimed to be operating for the benefit of the animals and for conservation purposes. This claim was false. Neither one of them actually participated in any contributions to animal research or conservation. They are profitable institutions whose bottom line is much more important than the condition of the animals.\n\nAnimals despise being captives in zoos. No matter how you \"enhance\" enclosures, they do not allow for freedom, a natural diet or adequate exercise. Animals end up stressed and unhealthy or dead. Ifs past time for transparency with these institutions, and it's past time to eliminate zoos from our culture.\n\n(42) Karen R. Sime\n\nAs a zoology professor, I agree with Emma Marris that zoo displays can be sad and cruel. But she underestimates the educational value of zoos.\n\nThe zoology program at my university attracts students for whom zoo visits were the crucial formative experience that led them to major in biological sciences. These are mostly students who had no opportunity as children to travel to wilderness areas, wildlife refuges or national parks. Although good TV shows can help stir children's interest in conservation, they cannot replace the excitement of a zoo visit as an intense, immersive and interactive experience. Surely there must be some middle ground that balances zoos' treatment of animals with their educational potential.\n\n(43) Greg Newberry\n\nEmma Marris's article is an insult and a disservice to the thousands of passionate people who work tirelessly to improve the lives of animals and protect our planet. She uses outdated research and decades-old examples to undermine the noble mission of organizations committed to connecting children to a world beyond their own.\n\nZoos are at the forefront of conservation and constantly evolving to improve how they care for animals and protect each species in its natural habitat. Are there tragedies? Of course. But they are the exception, not the norm that Ms. Marris implies. A distressed animal in a zoo will get as good or better treatment than most of us at our local hospital.\n\n(44) Dean Gallea\n\nAs a fellow environmentalist, animal-protection advocate and longtime vegetarian, I could properly be in the same camp as Emma Marris on the issue of zoos. But I believe that well-run zoos, and the heroic animals that suffer their captivity, do serve a higher purpose. Were it not for opportunities to observe these beautiful, wild creatures close to home, many more people would be driven by their fascination to travel to wild areas to seek out, disturb and even hunt them down.\n\nZoos are, in that sense, similar to natural history and archeology museums, serving to satisfy our need for contact with these living creatures while leaving the vast majority undisturbed in their natural environments.\n\n(45) John Fraser\n\nEmma Marris selectively describes and misrepresents the findings of our research. Our studies focused on the impact of zoo experiences on how people think about themselves and nature, and the data points extracted from our studies do not, in any way, discount what is learned in a zoo visit.\n\nZoos are tools for thinking. Our research provides strong support for the value of zoos in connecting people with animals and with nature. Zoos provide a critical voice for conservation and environmental protection. They afford an opportunity for people from all backgrounds to encounter a range of animals, from drone bees to springbok or salmon, to better understand the natural world we live in.\n\n[A ] ZOOS which spare no effort to take care of animals should not be subjected to unfair criticism.\n\n[B ] TO pressure zoos to spend less on their animals would lead to inhumane outcomes for the precious creatures in their care.\n\n[C ] While animals in captivity deserve sympathy, zoos play a significant role in starting young people down the path of related sciences.\n\n[D ] ZOOS save people trips to wilderness areas and thus contribute to wildlife conservation.\n\n[ E ] For wild animals that cannot be returned to their natural habitats, zoos offer the best alternative.\n\n[F ] ZOOS should have been closed down as they prioritize money making over animals' wellbeing.\n\n[G ] Marris distorts our findings which actually prove that zoos serve as an indispensable link between man and nature.\n"},{"year":2022,"sec":"partc","label":"翻译","text":"mart`\n\nBetween 1807 and 1814 the Iberian Peninsula (comprising Spain and Portugal) was the scene of a titanic and merciless struggle. It took place on many different planes: between Napoleon's French army and the angry inhabitants; between the British, ever keen to exacerbate the emperor 9 s difficulties, and the marshals sent from Paris to try to keep them in check; between new forces of science and meritocracy and old ones of conservatism and birth. (46) It was also, and this is unknown even to many people well read about the period, a battle between those who made codes and those who broke them\n\nI first discovered the Napoleonic cryptographic battle a few years ago when I was reading Sir Charles Oman 9 s epic History of the Peninsular War. In volume V he had attached an appendix, The Scovell Ciphers. (47) It listed many documents in code that had been captured fh )m the French army of Spain, and whose secrets had been revealed by the work of one George Scovell, an officer in British headquarters. Oman rated ScovelFs significance highly, but at the same time, the general nature of his History meant that (48) he could not analyze carefully what this obscure officer may or may not have contributed to that great struggle between nations or indeed tell us anything much about the man himself. I was keen to read more, but was surprised to find that Oman 9 s appendix, published in 1914, was the only considered thing that had been written about this secret war.\n\nI became convinced that this story was every bit as exciting and significant as that of Enigma and the breaking of German codes in the Second World War. The question was , could it be told?\n\nStudying Scovell's papers at the Public Record Office, London, I found that he had left an extensive journal and copious notes about his work in the peninsula. What was more, many original French dispatches had been preserved in this collection, which I realized was priceless. (49) There may have been many spies and intelligence officers during the Napoleonic Wars, but it is usually extremely difficult to find the material they actually provided or worked on\n\nAs I researched Scovell's story I found far more of interest besides his intelligence work. His status in Lord Wellington's headquarters and the recognition given to him for his work were all bound up with the class politics of the army at the time. His tale o self-improvement and hard work would make a fascinating biography in its own right, but represents something more than that. (50) Just as the code breaking has its wider relevance in the struggle for Spain, so his attempts to make his way up the promotion ladder speak volumes about British society.\n"},{"year":2022,"sec":"questions","label":"阅读题目","text":"21. According to Paragraph 1, museums are faced with difficulties i [A ] maintaining their plastic items. [B ] obtaining durable plastic artifacts. [C ] handling outdated plastic exhibits [ D ] classifying their plastic collections.\n\n22. Van Oosten believes that certain plastic objects ar [A ] immune to decay. [B ] improperly shaped [C ] inherently flawed. [D ] complex in structure.\n\n23. Museums stopped exhibiting some of Gilardi's artworks t [A ] keep them from hurting visitors [B ] duplicate them for future display [C ] have their ingredients analyzed [D ] prevent them from further damage\n\n24. The author thinks that preservation of plastics [A ] costly. [B ] unworthy [C ] unpopular [D ] challenging\n\n25. In Ferreira 9 s opinion, preservation of plastic artifact [A ] will inspire future scientific research. [B ] has profound historical significance. [C ] will help us separate the material ages [D ] has an impact on today's cultural life.\n\n26. The author suggests that Generation Z shoul [A ] be careful in choosing a college [B ] be diligent at each educational stage [C ] reassess the necessity of college education [D ] postpone their undergraduate application\n\n27. The percentage ofUK graduates in non-graduate roles reflec [A ] MillenniaFs opinion about work [B ] the shrinking value of a degree. [C ] public discontent with education [D ] the desired route of social mobility\n\n28. The author considers it a good sign th [A ] Generation Z are seeking to earn a decent degree [B ] school leavers are willing to be skilled workers. [C ] employers are taking a realistic attitude to degree [D ] parents are changing their minds about education.\n\n29. It is advised in Paragraph 5 that those with one degree shoul [A ] make an early decision on their career [B ] attend on-the-job training programs. [C ] team up with high-paid postgraduates [D ] further their studies in a specific field\n\n30. What can be concluded about Generation Z from the last two paragraphs [A ] Lifelong learning will define them [B ] They will make qualified educators. [C ] Degrees will no longer appeal them [D ] They will have a limited choice of jobs\n\n31. According to Paragraph 1, art-science collaborations hav [A ] caught the attention of critics [B ] received favorable responses. [C ] promoted academic publishing. [ D ] sparked heated public disputes.\n\n32. The reworked version of The Four Seasons is mentioned to show th [A ] art can off er audiences easy access to science. [B ] science can help with the expression of emotions. [C ] public participation in science has a promising future. [D ] art is effective in facilitating scientific innovations.\n\n33. Some artists seem to worry about in the art-science partnershi [A ] their role may be underestimated [B ] their reputation may be impaired [C ] their creativity may be inhibited. [D ] their work may be misguided\n\n34. What does the author say about CAYS [A ] It was headed alternately by artists and scientists [B ] It exemplified valuable art-science alliances [C ] Its projects aimed at advancing visual studies [D ] Its founders sought to raise the status of artists\n\n35. In the last paragraph, the author holds that art-science collaboration [A ] are likely to go beyond public expectations [B ] will intensify interdisciplinary competition [C ] should do more than communicating science [ D ] are becoming more popular than before.\n\n36. The personal grievance provisions of the ERA are intended t [A ] punish dubious corporate practices [B ] improve traditional hiring procedures. [C ] exempt employers from certain duties [D ] protect the rights of ordinary workers\n\n37. It can be learned from Paragraph 3 that the provisions ma [A ] hinder business development [B ] undermine managers 9 authority. [C ] affect the public image of the firms [D ] worsen labor-management relations\n\n38. Which of the following measures would the Productivity Commissionsupport [A ] Imposing reasonable wage restraints. [B ] Enforcing employment protection laws [C ] Limiting the powers of business owners. [ D ] Dismissing poorly performing managers.\n\n39. What might be an effect of ERA'S unjustified dismissal procedures [A ] Highly paid managers lose theirjobs. [B ] Employees suffer from salary cuts [C ] Society sees a rise in overall well-being [D ] Employers need to hire new staff\n\n40. It can be inferred that the high-income threshold \" in Australi [A ] has secured managers 9 earnings. [B ] has produced undesired results [C ] is beneficial to business owners. [D ] is difficult to put into practice\n"},{"year":2022,"sec":"writing","label":"写作","text":"Write an email to a professor at a British university, inviting him/her to organize a team for the international innovation contest to be helld at your university.\n\n2) explain its intended meaning, an\n"},{"year":2023,"sec":"cloze","label":"完形","text":"Caravanserais were roadside inns that were built along the Silk Road in areas including China, North Africa and the Middle East. They were typically 1\\_ outside the walls of a city or village and were usually funded by governments or 2\n\nThis word \" Caravanserais\" is a 3 of the Persian word \" karv:an\" , which means a group of ltravellers or a caravan , and \" seray \" , a palace or enclosed building. The term caravan was used to \\_4\\_ groups of people who travelled together across the ancient network for safety reasons , 5 merchants, travellers or pillgrims.\n\nFrom the 10th century onwards, as merchant and travel routes became more developed, the \\_6 \\_\\_ of the caravanserais increased and they served as a safe place for people to :rest at night. Travellers on the Silk Road 7 possibility of being attacked by thieves or being 8 to extreme weather conditions. For this reason, caravanserais were strategically placed 9 they could be reached in a day's travel time.\n\nCaravanserais served as an informal 10 point for the various people who travelled the Silk Road. \\_.!l\\_ , these structures became important centers for cultural 12 and interaction, with travellers sharing their cultures, ideas and beliefs, 13 taking knowledge with them, greatly \\_l! the development of several civilisations.\n\nCaravanserais were also an important marketplace for commodities and \\_!Lin the trade of goods along the Silk Road. 16 , it was frequently the first stop for merchants looking to sell their wares and \\_1 supplies for their own journeys. It is 18 that around 12,000 to 15,000 caravanserais were built along the Silk Road, \\_ \\_!2 only about 3 , 000 are known to remain today , many of which are in \\_1Q\\_.\n\n1. A. displayed B. occupied C. located D. equipped\n\n2. A. privately B. regularly C. respectively D. permanently\n\n3. A. definition B. transition C. substitution D. combination\n\n4. A. classify B. record C. describe D. connect\n\n5. A. apart from B. instead of C. such as D. along with\n\n6. A. construction B. restoration C. impression D. evaluation\n\n7. A. doubted B. faced C. accepted D. reduced\n\n8. A. assigned B. subjected C. accustomed D. opposed\n\n9. A. so that B. even if C. now that D. in case\n\n10. A. talking B. starting C. breaking D. meeting\n\n11. A., By the way B. On occasion C. In comparison D. As a result\n\n12. A. heritage B. revival C. exchange D. status\n\n1' 3. A. with regard to B. in spite of C. as well as D. in line with\n\n14. A. completing B. influencing C. resuming D. pioneering\n\n15. A. aided B. invested C. failed D. competed\n\n16. A. Rather B. Indeed C. Otherwise D. However\n\n17. A. go in for B. stand up for C. close in on D. stock up on\n\n18. A. believed B. predicted C. recalled D. implied\n\n19. A. until B. because C. unless D. although\n\n20. A. ruins B. debt C. fashion D. series\n"},{"year":2023,"sec":"partb","label":"新题型","text":"The following paragraphs are given in a wrong order. For questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-H and filHng them into the numbered boxes. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. ( 10 points)\n\nA. Last year marked the 150th anniversary of a series · of Yellowstone photographs by the r1enowned landscape photographer William • Henry Jackson. He captured the first-ever shots of iconic landmarks such as the Tetons, Old Faithful and the Colorado Rockies. Jackson snapped them on a late 19th-century expedition through the Yellowstone Basin that was conducted by the · head of the U. S. Geological and Geographical Survey of the Teritories, Ferdinand V. Hayden. The team included a meteorologist, a zoologist, a mineralogist, and an agricultural statistician.\n\nB. Two centuries ago , the idea of preserving nature , rather than exploiting it, was a novel one to. many U.S .. settlers. One of the turning points in public support for land conservation efforts-and recognizing the magnificence of the Yellowstone region in particular-came in the form of vivid photographs.\n\nC. As an effective Washington operator, Hayden sensed that he could capitalize on the expedition's stunning visuals. He asked Jackson to print out large copies and distributed them, along with reproductions of Moran's paintings, to each member of Congress. \" The visualization, particularly those photographs, really hit home that this is something that has to be protected, \" says Murphy.\n\nD. Throughout the trip , Jackson juggled multiple cameras and plate sizes using the \" collodion process\" that required him to coat the plates with a chemical mixture , then expose them and develop the resulting images with a portable darkroom. The crude technique required educated guesses on exposure times, and involved heavy, awkward equipment-several men had to assist in its transportation. Despite these challenges, Jackson captured doz � ns of striking photos, ranging from majestic images like his now-famous snapshot of Old Faithful, to casual portraits of expedition members at the camp. While veterans of previous expeditions wrote at length about stunning trai sights, these vivid photographs were another thing entirely.\n\nE. The journey officially began in Ogden, Utah on June 8 , 1871. Over nearly four months , dozens of men made their way on horseback into Montana and traversed along the Yellowstone River and around Yellowstone Lake. That fall, they concluded the survey in Fort Bridger, Wyoming.\n\nF. Though Native Americans ( and later miners and fur trappers) had long recognized the area's riches, most Americans did not. That's why Hayden's expedition aimed to produce a fuller understanding of the Yellowstone River region, from its hot springs and waterfalls to its variety of flora and fauna. In addition to the entourage of scientists, the team also included artists: Painter Thomas Moran and photographer William Henry Jackson were charged with capturing this astounding natural beauty and sharing it with the world.\n\nG. The bill proved largely popular and sailed through Congress with large majorities in favor. In quick succession, the Senate and House passed legislation protecting Yell ow stone in early 1872. That March, President Ulysses S. Grant signed an act into law that established Yellowstone as the world's first national park. Soon, some locals opposed the designation. Still, the decision was largely accepted-and Jackson's photos played a key role in the fight to protect the area. \"I don't believe that the legal protection would have happened in the timeframe that it did without those images, \" says Hansen, journalist and author of Prophets and Moguls, Rangers and Rogues, Bison and Bears: 100 Years of the National Park Service.\n\nH. Perhaps most importantly, the images provided documentary evidence that later made its way to government officials. Weeks after completing the expedition, Hayden collected his team's observations into an extensive report aimed at convincing Senators and Representatives, along with colleagues at government agencies like the Department of the Interior that Yellowstone ought to be preserved.\n"},{"year":2023,"sec":"partc","label":"翻译","text":"There has been some exploration around the use of AI in digital marketing. For example, AI can be used to analyse what type of advertising content or copy would be appropriate to 'speak' to a specific target customer group by revealing information about trends and preferences through the analysis of big data. ( 46) AI can also be used to identify the lifestyle choices of customers regarding their hobbies, favourite celebrities, music choices, and fashions to provide unique content in marketing messages put out through social media. At the same time AI can also be used to generate content for social media posts and chat sites. AI can also provide a bridge between the need of the brand to communicate emotionally with the customer and identifying their rapidly changing needs.\n\nThe main disadvantage of using AI to respond to customers is that there are concerns about trusting pei:sonal interactions to machines , which could lead not only to the subsequent loss of interpersonal connections , but also to a decrease in marketing personnel. ( 47) Some believe that AI is negatively impacting on the marketer's role by reducing creativity and removing jobs, but they are aware that it is a way of reducing costs and creating new information. By allowing AI to develop content some brand marketers may find that they are losing control over the brand narrative. ( 48 ) Algorithms that are used to simulate human interactions are creating mmy of these concerns, especially as no-one is quite sure what the outcomes of using AI to interact with customers will be.\n\nFor AI to be successful, data needs to be accessible, but the use of personal data is becoming more regulated and the automated sharing of data is becoming more difficult. ( 49 ) If customers are not willing to share data, AI will be starved of essential information and will not be able to function effectively or employ machine learning to improve its marketing content and communication. Therefore , unless customer:; are prepared to sign release agreements , the use of AI may become somewhat restricted in the future. Not only can AI help to create the marketing content, but it can also provide a non-intrusive way of delivering the content to the target cm,tommers. Data can be gathered on where the customer can be engaged, such as location, devices used, website interactions, and sites visited, to display marketing messages in appropriate forms , including emails , social media posts, pop-up advertisements, and banners at an appropriate frequency. ( 50) The non-intrusive delivery of the marketing messages in a way that is sensitive to the needs of the target customer . is one of the critical challenges to the digital marketer.\n"},{"year":2023,"sec":"questions","label":"阅读题目","text":"21. In Paragraph 1, the weather in Texas is mentioned to A. forecast a policy shift in Texas schools B. stress the consequences of climate change C .. indjcate the atmosphere at the board meeting D. draw the public's attention to energy shortages\n\n22. What does Quinn think of Hardy? A. She exaggerates the existing panic. B. She denies the value of scientific work. C. She shows no concern for pre-teens. D. She expresses self-contradictory views.\n\n23. The study mentioned in Paragraph 5 shows that A. climate education is insufficient at state public schools B. policymakers have little drive for science education C. Texas is reluctant to rewrite its science textbooks D. environmental teaching in some states lacks supervision\n\n24. According to Branch, state-level science standards in the US A. call for regular revision B. require urgent application C. have limited influence D. cater to local needs\n\n25. It is implied in the last paragraph that climate change teaching in some schools A. agrees to major public demands B. reflects teachers' personal biases C. may misrepresent the energy sector D. can be swayed by external forces\n\n26. Which of the following is true of New Englan�? A. Its housing supply is at a very low level. B. Its communities are in need of funding. C. Its rental vacancy rate is going up slowly. D. Its home prices are under strict control.\n\n27. The bill mentioned in Paragraph 2 was intended to A. curb short-term rental speculation B. ensure the supply of cheap housing C. punish illegal dealings in housing D. allow a free short-term rental market\n\n28. Co C. the prestige of the people they work with D. the status they have in scientific circles\n\n37. The support service consultancies tend to A. recommend journals to their clients B. list citation patterns their clients C. ask authors to include extra citations D. advise contributors to cite each other\n\n38. The function of the \"milk cow\" journals is to A. boost citation counts for certain authors B. help scholars publish articles at low cost C. instruct first-time contributors in citation D. increase the readership of new journals\n\n39. What can be learned about Scopus from the last two paragraphs? A. It fosters competition among citation providers. B. It has the capability to identify suspicious citations. C It hinders the growth of \"international\" journals. D. It is established to prevent citation manipulation.\n\n40. What should an author do to deal with citation manipulators? A. Take legal action. B. Demand an apology. C. Seek professional advice. D. Reveal their misconduct.\n"},{"year":2023,"sec":"writing","label":"写作","text":"Section m Writing\n\nWrite a notice to recruit a student for Prof. Smith's research project on campus sports activities. Specify the duties and requirements of the job.\n\n2 ) interpret the implied meaning , and\n"},{"year":2024,"sec":"cloze","label":"完形","text":"There's nothing more welcoming than a door opening for you.\n\n1 the need to\n\nbe touched to open or close, automatic doors are essential in.\n\n2 disabled access to\n\nbuildings and helping provide general.\n\n3 to commercial buildings.\n\nSelf-sliding doors began to emerge as a commercial product in 1960 after being\n\ninvented six years.\n\n4 by Americans Dee Horton and Lew Hewitt. They.\n\n5 as\n\na novelty feature, but as their use has grown, their\n\n6 have extended within our\n\ntechnologically advanced world. Particularly.\n\n7 in busy locations or during times\n\nof emergency, the doors.\n\n8 crowd management by reducing the obstacles put in\n\npeople's way.\n\n9
