otect\n\n[ C] For example\n\n[ C] secure\n\n[ C] impressive\n\n[ D] Without\n\n[ D] tracing\n\n[ D] reference\n\n[ D] eventually\n\n[ D] went by\n\n[ D] sources\n\n[D] stable\n\n[D] act as\n\n[ D] Rather than\n\n[ D] occupied\n\n[D] direct\n\n[ D] change\n\n[ D] pointing at\n\n[ D] Although\n\n[ D] reasons\n\n[ D] mixes\n\n[ D] complement\n\n[ D] Above all\n\n[ D] include\n\n[ D] delicate\n"},{"year":2024,"sec":"partb","label":"新题型","text":"to their countries of origin and a list of statements summarizing the comments. Choose\n\nthe best statement from the list A-G for each numbered name( 41-45) . There are two\n\n( 41) Hannah\n\nSimply, there are people in Nigeria who cannot travel to the Smithsonian\n\nInstitution to see that part of their history and culture represented by the Benin\n\nBronzes. These should be available to them as part of their cultural heritage and\n\nhistory and as a source of national pride. There is no good reason that these artifacts\n\nshould be beyond the ordinary reach of the educational obj ectives or inspiration of the\n\ngenerations to which they were left. They serve no purpose in a museum in the United\n\nStates or elsewhere except as curious obj ects. They cannot be compared to works of\n\nart produced for sale which can be passed from hand to hand and place to place by\n\npurchase.\n\n( 42) Buck\n\nWe know very exact reproductions of artwork can be and are regularly produced.\n\nPerhaps museums and governments might explore some role for the use of nearly\n\nexact reproductions as a means of resolving issues relating to returning works of art\n\nand antiquities. The context of any exhibit is more important to me than whether the\n\nobj ect being displayed is 2,000 years old or 2 months old. In many cases the experts\n\nhave a hard time agreeing on what is the real obj ect and what is a forgery. Again, the\n\nstory an exhibit is trying to tell is what matters. The monetary value of the obj ects on\n\ndisplay is a distant second place in importance.\n\n( 43) Sara\n\nWhen visiting the Baltimore Museum of Art, I came across a magnificent 15th-\n\ncentury Chinese sculpture. It inspired me to learn more about the culture that it\n\nrepresented. Artifacts in museums have the power to inspire, and perhaps spark that\n\nneed to learn and understand the nature of their creators. Having said that, I do feel\n\nthat whatever artifacts find their way to public museums should, in fact, be sanctioned\n\nas having been obtained on loan, legally purchased, or obtained by treaty. Stealing\n\nartifacts from other peoples' cultures is obscene; it robs not only the physical obj ects,\n\nbut the dignity and spirit of their creators.\n\n( 44) Victor\n\nAncient art that is displayed in foreign countries by all means should be returned\n\nto the original country. The foreign countries have no right to hold back returning\n\nthe items. I would ask that the foreign nations and the original country discuss the\n\nterms of transfer. Yes, there is the risk that the original country will not have as good\n\nsecurity as do the foreign countries. But look at what happened to Boston's Gardner\n\nMuseum theft in 1990, including the loss of Rembrandt, Vermeer, Manet, and other\n\nmasterpieces. Nothing is absolutely safe nowhere. And now Climate Change agitators\n\nare attacking publicly displayed works in European museums.\n\n( 45) Julia\n\nTo those of you in the comments section who are having strong feelings about\n\nartifacts being removed from cities in the U. S. and Britain and returned to their\n\ncountries of origin, I would ask you to consider why do you think Americans have\n\nmore of a right to easily access the Benin Bronzes than the people of Nigeria? Why\n\nare people who live within a day's drive of London entitled to go and see the Elgin\n\nMarbles whenever they want, but the people of Athens aren't? What intrinsic factors\n\nmake the West a suitable home for these artifacts but preclude them from being\n\npreserved and displayed by their countries of origin? If your conclusion is that the\n\nWest is better able to preserve these artifacts, think about why you're assuming that to\n\nbe true.\n\n[ A] It is clear that the countries of origin have never been compensated for the stolen\n\nartifacts.\n\n[B] It is a flawed line of reasoning to argue against returning artifacts to their countries\n\nof origin.\n\n[ C] Museum visitors can still learn as much from artifacts' copies after the originals\n\nare returned.\n\n[ D] Reproductions, even if perfectly made, cannot take the place of the authentic\n\nobj ects.\n\n[ E] The real value of artifacts can only be recognized in their countries of origin rather\n\nthan anywhere else.\n\n[ F] Ways to get artifacts from other countries must be decent and lawful.\n\n[G] Concern over security is no excuse for refusing to return artifacts to their countries\n\nof origin.\n"},{"year":2024,"sec":"partc","label":"翻译","text":"\" Elephants never forget\" —or so they say—and that piece of folklore seems to\n\nhave some foundation.\n\nThe African savanna elephant, also known as the African bush elephant, is\n\ndistributed across 37 African countries. They move between a variety of habitats,\n\nincluding forests, grasslands, woodlands, wetlands and agricultural land. ( 46) They\n\nsometimes travel more than sixty miles to find food or water, and are very good\n\nat working out where other elephants are—even when they are out of sight. Using\n\ntracking devices, researchers have shown that they have\" remarkable spatial acuity. \"\n\nWhen finding their way to waterholes, they headed off in exactly the right direction,\n\non one occasion from a distance of roughly thirty miles. What is more, they almost\n\nalways seem to choose the nearest waterhole. ( 47) The researchers are convinced that\n\nthe elephants always know precisely where they are in relation to all the resources\n\nthey need, and can therefore take shortcuts, as well as following familiar routes.\n\nAlthough the cues used by African elephants for long-distance navigation are not\n\nyet understood, smell may well play a part.\n\nElephants are very choosy eaters, but until recently little was known about how\n\nthey selected their food. ( 48) One possibility was that they merely used their eyes and\n\ntried out the plants they found, but that would probably result in a lot of wasted time\n\nand energy, not least because their eyesight is actually not very good.\n\n( 49) The volatile chemicals produced by plants can be carried a long way, and\n\nthey are very characteristic: Each plant or tree has its own particular odor signature.\n\nWhat is more, they can be detected even when they are not actually visible. New\n\nresearch suggests that smell is a crucial factor in guiding elephants—and probably\n\nother herbivores—to the best food resources.\n\nThe researchers first established what kinds of plant the elephants preferred either\n\nto eat or avoid when foraging freely. They then set up a\"food station\" experiment,\n\nin which they gave the elephants a series of choices based only on smell. ( 50) The\n\nexperiment showed that elephants may well use smell to identify patches of trees that\n\nare good to eat, and secondly to assess the quality of the trees within each patch. Free-\n\nranging elephants presumably also use this information to locate their preferred food.\n\nTheir well-developed hippocampal structures may enable elephants, like rats and\n\npeople, to construct cognitive maps.\n"},{"year":2024,"sec":"questions","label":"阅读题目","text":"21. The Romans buried the nails probably for the sake of.\n\n[ A] saving them for future use\n\n[ B] kecping them from rusting\n\n[ C] letting them grow in value\n\n[ D] hiding them from the locals\n\n22. The example of early 17th-century Virginians is used to.\n\n[ A] highlight the thriftiness of early American colonists\n\n[ B] illustrate the high status of blacksmiths in that period\n\n[ C] contrast the attitudes of different civilisations towards nails\n\n[ D] show the preciousness of nail-making technology at that time\n\n23. What played the maj or role in lowering the price of nails after the late 1700s?\n\n[ A] Increased productivity.\n\n[ B] Wider use of new energies.\n\n[ C] Fiercer market competition.\n\n[ D] Reduced cost of raw materials.\n\n24. It can be learmed from Paragraph 5 that nails\n\n[ A] have undergone many technological improvements\n\n[ B] have remained basically the same since Roman times\n\n[C] are less studied than other everyday products\n\n[D] are one of the world's most significant inventions\n\n25. Which of the following best summarises the last two paragraphs?\n\n[ A] Cheap technologies bring about revolutionary change.\n\n[ B] Technological innovation is integral to economic success.\n\n[ C] Technology defines people's understanding of the world.\n\n[ D] Sophisticated technologies develop from small inventions.\n\n26. According to the first two paragraphs, alloparenting refers to the practice of\n\n[ A] sharing childcare among community members\n\n[ B] assigning babies to specific adult caregivers\n\n[ C] teaching parenting skills to older children\n\n[ D] carrying infants around by their parents\n\n27. The scheme in Germany is mentioned to illustrate.\n\n[ A] an attempt to facilitate intergenerational communication\n\n[ B] an approach to integrating alloparenting into western society\n\n[ C] the conventional parenting style in western culture\n\n[ D] the differences between western and African ways of living\n\n28. According to Paragraph 4, the \"intensive mothering narrative\".\n\n[ A] alleviates parenting pressures\n\n[ B] consolidates family relationships\n\n[ C] results in the child-centred family\n\n[ D] departs from the course of evolution\n\n29. What can be inferred about the nurseries in the UK?\n\n[ A] They tend to fall short of official requirements.\n\n[ B] They have difficulty finding enough caregivers.\n\n[ C] They ought to improve their carer-to-child ratio.\n\n[D] They should try to prevent parental depression.\n\n30. Which of the following would be the best title for the text?\n\n[ A] Instructive teaching: a dilemma for anxious parents\n\n[ B] For a happier family, learn from the hunter-gatherers\n\n[ C] Mixed-age playgroup, a better choice for lonely children\n\n[ D] Tracing the history of parenting: from Africa to Europe\n\n31. What can be learned about Rutkowski from the first two paragraphs?\n\n[ A] He is enthusiastic about using AI models.\n\n[ B] He is popular with users of an AI art generator.\n\n[ C] He attracts admiration from other illustrators.\n\n[ D] He specializes in classical painting digitalization.\n\n32. The problem with open-source AI art generators is that they.\n\n[ A] lack flexibility in responding to prompts\n\n[ B] produce artworks in unpredictable styles\n\n[ C] make unauthorized use of on line images\n\n[ D] collect user information without consent\n\n33. After searching on line, Rutkowski found\n\n[ A] a unique way to reach audiences\n\n[ B] a new method to identify AI images\n\n[ C] AI -generated work bearing his name\n\n[ D] heated disputes regarding his copyright\n\n34. According to Ortiz, AI companies are advised to.\n\n[ A] campaign for new policies or regulation\n\n[ B] offer their services to public institutions\n\n[ C] strengthen their relationships with AI users\n\n[D] adopt a different strategy for AI model training\n\n35. What is the text mainly about?\n\n[A] Artists' responses to AI art generation.\n\n[ B] AI 's expanded role in artistic creation.\n\n[ C] Privacy issues in the application of AI .\n\n[ D] Opposing views on AI development.\n\n36. The Chesapeake Bay is described in Paragraph 1 as\n\n[ A] a valuable natural environment\n\n[ B] a controversial conservation area\n\n[ C] a place with commercial potential\n\n[ D] a headache for nearby communities\n\n37. The U. S. Supreme Court's ruling in the ldaho case\n\n[ A] reinforces water pollution control\n\n[ B] weakens the EPA's regulatory power\n\n[ C] will end conflicts among local residents\n\n[ D] may face opposition from mining operators\n\n38. How does the author feel about the future of the Chesapeake Bay?\n\n[ A] Worried.\n\n[ B] Puzzled.\n\n[ C] Relieved.\n\n[ D] Encouraged.\n\n39. What can be inferred about the EPA's involvement in the Chesapeake Bay\n\n[ A] It has restored the balance among neighboring jurisdictions.\n\n[ B] It has triggered a radical reform in commercial fisheries.\n\n[ C] It has set a fine example of respecting state authorities.\n\n[ D] It has ensured the coordination of protection efforts.\n\n40. The author holds that the state lawmakers should\n\n[ A] be cautious about the influence of land owners\n\n[ B] attach due importance to wetlands protections\n\n[ C] recognize the need to expand wildlife refuges\n\n[ D] improve the wellbeing of endangered species\n"},{"year":2024,"sec":"writing","label":"写作","text":"Dear Li Ming,\n\nI've got a class assignment to make an oral report on an ancient Chinese\n\nscientist, but I'm not sure how to prepare for it. Can you give me some\n\nadvice? Thank you for your help.\n\nYours,\n\nPaul\n\nshould\n\n2) interpret the implied meaning, and\n"},{"year":2025,"sec":"cloze","label":"完形","text":"Located in the southern Peloponnesian peninsula, Pavlopetri (the modern name of the site) emerged as a Neolithic settlement around 3500 B.C. This area of the Aegean Sea is1 to earthquakes and tsunamis which caused the city to 2 sink. The slow sea level rise in the Mediterranean3 the city more than 3000 years ago.\n\nFor millennia, the city's\\_ 4 lay unseen below some 13 feet of water. They were covered by a thick layer of sand\\_ 5 the island of Laconia. In recent decades, shifting 6 and climate change have eroded a natural barrier that7Pavlopetri. In 1967, a scientific survey of the Peloponnesian coast was8 data to analyze change in sea levels9 British oceanographer Nicholas Flemming first spotted the sunken10 A year later, he returned with a few students to\\_11 the location and map the site. The team identified some 15 buildings, courtyards, a network of streets, and two chamber tombs. 12 the exciting initial finds, the site would lie\\_13 for decades before archaeologists would return.\n\nIn 2009 archaeologists Chrysanthi Gallon and Jon Henderson 14 excavation of Pavlopetri in cooperation with the Greek Ministry of Culture.\n\nSince the 1960s, underwater archaeology15 and tools had made huge advances. The team 16 robotics, sonar mapping, and state-of-the-art graphics to survey the site. From 2009 to 2013 they were able to bring the underwater town to 17. Covering about two and a half acres, Pavlopetri three main roads 18 some 50 rectangular buildings, all of which had open courtyards, Excavations revealed a large number of Minoan-style loom weights,19 Pavlopetri was a thriving trade center with a\\_ 20 \\_textile industry.\n\n1. [A] relevant [B] prone [C] available [D] alien\n\n2. [A] accidentally [B] frequently [C] gradually [D] temporarily\n\n3. [A] disguised [B] submerged [C] relocated [D] isolated\n\n4. [A] legends [B] programs [C] remains [D] surroundings\n\n5. [A] across [B] off [C] under [D] via\n\n6. [A] currents [B] rivers [C] seasons [D] winds\n\n7. [A] elevated [B] separated [C] comprised [D] protected\n\n8. [A] gathering [B] restoring [C] updating [D] supplying\n\n9. [A] when [B] until [C] after [D] once\n\n10. [A] belongings [B] resources [C] products [D] structures\n\n11. [A] preserve [B] select [C] display [D] examining\n\n12. [A] Despite [B] Unlike [C] Besides [D] Among\n\n13. [A] unchallenged [B] unknown [C] unorganized [D] undisturbed\n\n14. [A] suspended [B] transferred [C] resumed [D] canceled\n\n15. [A] policies [B] theories [C] documents [D] techniques\n\n16. [A] ordered [B] provided [C] employed [D] adjusted\n\n17. [A] effect [B] light [C] reality [D] mind\n\n18. [A] crossed [B] connected [C] blocked [D] altered\n\n19. [A] expecting [B] suggesting [C] predicting [D] recalling\n\n20. [A] robust [B] diverse [C] marginal [D] dependent\n"},{"year":2025,"sec":"partb","label":"新题型","text":"[A] Peters likes to photograph butterflies in a landscape, celebrating the beauty of their surroundings as well as the insects themselves. His pictures of a Glanville fritillary rising from the sea-pinks beside the chalk cliffs of Compton Bay on the Isle of Wight are particularly glorious. These tale-off shots are even more challenging because they require a wide-angle lens, which means he must be less than 2cm from the butterfly. It's incredibly difficult to get that close to a skittish sun-warmed insect. Unlike some photographers, who \"cheat\" by keeping insects in a fridge to slow them down. Peters refuses to temper with wild butterflies. [B] Peters' signature shot is a butterfly \"take -off\", showing the multiple wing-beats of one butterfly in one frame as it lifts off from a flower. How does he capture it ? Technology helps. A typical digital SLR camera shoots 20 frames a second. He uses a high-speed OM System which shoots 120 frames a second. [C] Britain has relatively few butterfly species compared with mainland Europe and 80% are in decline, mostly because intensive chemical farming has reduced many species to tiny fragments of habitat and small nature reserves. Global heating is benefiting some species but others are too isolated to find suitable new habitat, and gardening habits-paving over gardens and using pesticides - aren't helping either. Butterflies may not pollinate as many plants as wild bees and hoverflies, but because British butterflies are the best-studied group of insects in the world. they are an extremely useful indicator of the wider declines in flying insects.\n\n[D] Five years ago, at summer's end, Andrew Fusek Peters was\n\n【微信公众号：考研⽂库】免费整理分享 diagnosed with bowel cancer. \"I was waiting for surgery, feeling really ill sitting in my garden. It was amazing weather and there were painted lady butterflies everywhere,\" he says. \"They were a symbol of fragile life, of hope and defiance, and something appealed to my soul. [E] That makes it sound easy, and artificial, but Peters insists it is still a massive challenge. He typically takes between 10,000 and 20,000 shots to get one butterfly take-off sequence in focus. At such high shutter speeds, the depth of field is tiny, and as butterflies do hot fly in a straight line they swiftly flutter out of focus. As well as thousands of attempts, it takes patience and field craft to anticipate a butterfly's likely flight-line-and catch it-in focus [F] so What's the appeal of a long, sweaty day in pursuit of an elusive, fasting-moving wild animal? \"It just feels bloody brilliant, \" says Peters \"If I've had a full day of good encounters with butterflies, met interesting butterfly people and I've got some good shots, that becomes a vault in my spiritual bank. It' s a happy feeling. \" [G] A children's author and poet who had become a keen amateur photographer, peters watched the butterflies and idly wondered if he could capture them in flight. It swiftly become an obsession as he recovered from a successful operation to remove the cancer. In recent summers, he has travelled the length and breadth of Britain to photograph all 58 native species of butterfly. Now the fruits of those summers have seen published\n\nin a beautiful new book.\n\n[H] A butterfly takes off so quickly it is still impossible to react quickly enough to capture that take-off but if he half-presses the shutter, the camera saves the 70 previous frames before the moment he actually takes the picture. \"It's time travel, so I don't miss the moment of take-off,\" he says. After he's captured the butterfly taking off, he layers 10 to 15 frames together in Photoshop.\n\nAA\n\n\\mathrm{G} \\rightarrow 4 1. \\quad \\rightarrow 4 2. \\quad \\rightarrow 4 3. \\quad \\rightarrow 4 4. \\quad \\rightarrow 4 5. \\quad \\rightarrow \\mathrm{F}\n\nAA\n"},{"year":2025,"sec":"partc","label":"翻译","text":"Innovation and research have relied on public participation in science for centuries. It was a musician who discovered the planet Uranus in the 18th century by making his own telescope with mirrors composed of copper and tin. (46) Recent decades have seen more engagement in the subject can only be done through institutions such as a university. Citizen science provides an opportunity for greater public engagement and the democratisation of science.\n\nIn the information era, large data sets, small teams and financial restrictions have slowed scientific process. (47)But by utilising the natural curiosity of the general public it is possible to overcome many of these challenges by engaging non-scientists directly in the research process. Anyone can be a citizen scientist, regardless of age, nationality or academic experience. You don't even need any formal training, just an inquisitive mind and the enthusiasm to join one of the thousands of citizen science projects to generate new knowledge and the means to understand a genuine scientific outcome. (48)Scientists have employed a variety of ways to engage the general public in their research, such as making data analysis into an on line game or sample collection into a smartphone application. They've implored citizens to help with bug counting and categorising cancer cells, and even identifying distant galaxies This form of accessible science means that great minds are able to join the race to create and develop projects with the potential to change the world. A citizen science-based approach can extend the field of vision and include different ideas and different brains to problem-solve and create. making innovation faster and more effective. The rise of citizen science has grown alongside the rise of do-it-yourself biology laboratories around the world.(49) These groups of people are part of a rapidly expanding biotechnological social movement of citizen scientists and professional scientists seeking to take discovery out of institutions and put it into the hands of anyone with the enthusiasm\n\nThere are around 40 official do-it-yourself biology centres across the globe in locations including Paris, London, Sydney, and Tel Aviv.(50)They pool resources, collaborate, think outside the box, and find solutions and ways around obstacles to explore science for the sake of science without the traditional boundaries of working inside a formal setting. So is it time to take the Petri dish out of the laboratory and into the garage?\n"},{"year":2025,"sec":"questions","label":"阅读题目","text":"21.The \"rehearsal room\" approach requires pupils to\n\n[A]rewrite the lines from Shakespeare.\n\n[B] Watch RSC actors' performances.\n\n[C]play the roles in Shakespeare.\n\n[D] Study drama under RSC artist.\n\n22.The study divided the pupils into two groups to find whether\n\n[A]The change in instruction enhances learning outcomes.\n\n[B]expanding vocabulary helps develop reading fluency.\n\n[D] emotion affects understanding of sophisticated works.\n\n[D]the classroom activity stimulates interest in the acts.\n\n23. Control pupils' reliance on \"desert island click's\" shows their [A] weakness in description [B] omission of small details. [C]casual style of writing. [D]preference for big words\n\n24. what can promote children's emotional literacy according to O'Hanlon? [A] Writing in an imaginative manner. [B] Identifying with literary characters. [C]Drawing inspiration from nature. [D]Concentrating on real-life situations.\n\n25. It can be inferred from the last paragraph that [A]the new teaching method may work best with Shakespeare. [B]the language of Shakespeare may be formidable for pupils. [C] other old dramatists may be included in primary education [D]pupils may be reluctant to work on other old dramatists.\n\n26. The author expressed great surprise at some scientists'\n\n[A] unwillingness to cut carbon emissions\n\n[B] intention to reduce their research\n\n[C]suspicions about sustainable energy\n\n[D]waste of electricity in their projects\n\n27. The author believes that carbon emissions from research [A] have caused grave consequences [B] have caused groundless worries [C] are hard to handle at present [D] are justifiable in the long run\n\n28. The example of Green in Paragraph 5 is used to illustrate,\n\n[A] the achievements of great scientists\n\n[B] the urgency of addressing climate change\n\n[C] the rewards of scientific endeavors\n\n[D] the value of fostering human ingenuity\n\n29. It can be learned from the last two paragraph\n\n[A] Is a model of sustainability efforts\n\n[B]Is a triumph against energy shortage\n\n[C]owes much to global het-20 initiatives\n\n[D]aims to explore the power of intelligence\n\n30. Which of the following statements would the author agree with?\n\n[A]Emission-free modelling demands extra funding\n\n[B]The need for supercomputers is difficult to meet\n\n[C]Energy-intensive research work is inevitable.\n\n[D]The goals of researchers ought to be realistic.\n\n31. According to Paragraph 1, legitimate streaming services\n\n[A] have drawn lessons from Hollywood\n\n[B] have surpassed cable in revenue\n\n[C] are unpopular with advertisers\n\n[D] are confronted with a real threat\n\n32. It can be learned that streamers like Netpix\n\n[A] played a part in the fight against illegal file-sharing\n\n[B] reaped benefits from the war with digital pirates\n\n[C] promised to become big job creators in the US\n\n[D] used to collaborate with file uploading platforms\n\n33. It can be inferred from paragraph 4 that the MPA\n\n[A] was denied cooperation by silicon valley\n\n[B] led a national protest against on line piracy\n\n[C] was urged to from an enforcement task force\n\n[D] failed to win support from local authorities\n\n34. According to Hawley, digital piracy:\n\n[A] cannot be checked in spite of new legislation\n\n[B] will possibly overwhelm legitimate streamers\n\n[C] is unlikely to diminish in the near future\n\n[D] has been underestimated by some analysts\n\n35. Which of the following is emphasized in the text?\n\n[A] The need to coordinate anti-piracy action\n\n[B] The criminal nature of copyright violation\n\n[C] The prospect of eliminating on line piracy\n\n[D] The economic harm from illegal streaming\n\n36. The author mentions the artifacts from the past to\n\n[A] introduce the collection of antiques\n\n[B] contrast them with everyday items\n\n[C] bring up the issue of preservation\n\n[D] comment on their historical value\n\n37. Compared with digital objects, tangible artifacts\n\n[A] are less subject to their creators' neglect\n\n[B] convey information in a more direct way\n\n[C] require more international preservation\n\n[D] are less likely to suffer serious damage\n\n38. According to Paragraph 3, librarians work may result in\n\n[A] oversupply of materials\n\n[B] undervaluation of libraries\n"},{"year":2025,"sec":"writing","label":"写作","text":"mart^\n\nDear Li Ming,\n\nI was really excited to hear that you'd invite some young craftsmen to demonstrate their innovative craft-making on campus. May I know more about what they'll show? Also, I'd like to help with your presentation work. Please let me know what I can do.\n\nYours,\n\nPaul\n\n2) explain its intended meaning, and\n"},{"year":2026,"sec":"cloze","label":"完形","text":"Advances in artificial intelligence (AI) are rapidly changing every aspect of human life. The world of AI is buzzing with an exciting potential to improve and enrich our lives. 1 , AI also has the potential hazard of 2 our experiences in ways we might find difficult to control. One such 3 is how we understand and experience beauty.\n\nAI can be a collaborative tool in a wide range of creative endeavors. 4 human creativity and AI algorithms can lead to unique artistic 5 that are beautiful to the human eye. These collaborations are likely to become increasingly common.\n\n6 , as convenient and provocative, AI enables virtual try-on experiences where you can virtually 7 makeup, hairstyles, clothing, and even cosmetic procedures 8 making any physical changes. Individuals can now experiment with different looks and 9 their preferences, potentially expanding the range of beauty ideals. AI algorithms can 10 facial features and skin conditions to provide personalized beauty recommendations. This 11 approach aims to cater to individual preferences and enhance the concept of beauty tailored to each person's unique characteristics. 12 , AI can be a fun vehicle for self-discovery.\n\nWhile AI offers exciting possibilities, it also raises ethical 13 . There is a risk of deepening societal beauty 14 and perpetuating unattainable beauty standards. 15 , AI-powered beauty filters and editing tools can lead to distorted self-perception and 16 body dissatisfaction. As summarized in a recent post on \"The Hidden Dangers of Online Beauty Filters,\" 17 on this technology for social presentation can cause harm— 18 body image issues, lower self-esteem, and social anxiety.\n\nIt's important to note that while AI can enhance our 19 of beauty, it should not 20 the genuine human experience and the emotional connections we derive from seeing the beauty in each other.\n\n1. A. Still B. Therefore C. Afterward D. Instead\n\n2. A. reviewing B. narrating C. ignoring D. dominating\n\n3. A. reason B. area C. clue D. belief\n\n4. A. Balancing B. Distinguishing C. Combining D. Introducing\n\n5. A. prospects B. outcomes C. ambitions D. sentiments\n\n6. A. At first B. By comparison C. For instance D. In general\n\n7. A. test B. copy C. link D. save\n\n8. A. upon B. beyond C. through D. before\n\n9. A. explore B. recall C. simplify D. cherish\n\n10. A. recover B. arrange C. reserve D. analyze\n\n11. A. localized B. normalized C. randomized D. customized\n\n12. A. At best B. To the contrary C. By definition D. In this way\n\n13. A. divisions B. expectations C. concerns D. values\n\n14. A. pressures B. mysteries C. understandings D. suspicions\n\n15. A. Approximately B. Additionally C. Alternatively D. Accidentally\n\n16. A. deal with B. result from C. contribute to D. focus on\n\n17. A. starting B. checking C. relying D. working\n\n18. A. apart from B. such as C. regardless of D. prior to\n\n19. A. imitation B. appreciation C. preservation D. consumption\n\n20. A. replace B. seize C. share D. reflect\n"},{"year":2026,"sec":"partb","label":"新题型","text":"The following paragraphs are given in a wrong order. For questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-H and filling them into the numbered boxes. Paragraphs C, F and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\n\nA. And just read a single poem. In his Oxford lectures, Seamus Heaney argued that a poem draws a picture of reality, a \"glimpsed alternative\" that sets up a contradiction with your own, in ways little and large. The negotiation, between you and it, is the heart of the matter. What does the poet see that you don't? What does the difference mean? It could be one of the best conversations you ever have.Forget self-help books; reading is self-help in action.\n\nB. But for the most part, this isn't what the business community does. I have yet to meet a chief executive who reads regularly. Many skip newspapers, and magazines are a stretch. They don't have time, they say. It's inefficient; they can get the information they need from those around them. At a pinch, they might pick up a business book before a long flight, in the hope that, like a cookbook, it will provide a foolproof recipe. Some are drawn to what I think of as \"business car crash\" books—the stories of Theranos, Purdue,or WeWork. But outside those narrow pools of interest, a vast ocean awaits, bountiful with simmering ideas, mental adventure and imaginative refreshment.\n\nC. Neuroscientists have been at pains to demonstrate that the pleasure a book provides isn't indulgence; it's good for you. Reading will keep you better informed about the world but it can also improve our tech-shattered ability to concentrate. Standing in the shoes of others fine tunes our social understanding, useful as we struggle to understand friends, neighbours, customers and co-workers. Different parts of our brain engage as we simulate scenes, characters and mental states. Our imagination—remember that?—is rekindled.\n\nD. It is undoubtedly true that all work and no play really does make Jack, or Jill, dull. The cure is right at hand. Reading is cheap, easy and, most important, it's fun. Liberate your imagination this year.\n\nE. We are living through a golden age of science writing, so lucid and accessible that even lay readers can relish the unpredictability of discovery. Daunted by uncertainty? Stand in the shoes of scientists and witness the degree to which breakthroughs emerge from accidents, conflict and sheer mental stamina. \"We are never sure of anything,\" says the physicist (and writer) Carlo Rovelli.\n\nF. You don't need to get out more. If, like most business people, you spend your life dashing from office to plane, train to home, boardroom to washroom, what you really need to do is stay in more, sit down—and read a book.\n\nG. Reading has also been found to make us more helpful, to reduce bias, and even to increase longevity—something we will enjoy all the more if we have a good book in our hands. (And yes, all these benefits are more closely associated with physical books than digital ones.)\n\nH. Read fiction. Any fiction. Free yourself from algorithms and choose—anything. You don't need technology for an immersive experience—just surrender to narratives across time and place. Modern (Sebastian Barry or Olga Tokarczuk), classic (Virginia Woolf or James Baldwin) or genre (Stephen King, Margaret Atwood, Georges Simenon)—it doesn't matter. Fiction invites you to loiter unseen in the lives of others. We are living through a golden age of translation too, so you can go anywhere in time or place.\n"},{"year":2026,"sec":"partc","label":"翻译","text":"Science education today revolves around the idea of scientific literacy—the base-level knowledge about science that nonscientists require to effectively get on in the world. This concept has served as a central goal for curriculum developers, local school boards, business and community leaders, and policymakers ever since its introduction nearly 80 years ago.\n\n(46) Tracing the history of the term, we can see how the definition of scientific literacy has shifted over time, muddying the waters when it comes to determining the goals of science education. And that's a shame, because there is much to recommend in the idea of scientific literacy as it was originally articulated in 1945, a time when science appeared to be the key to progress and scientists seemingly helld the fate of the world in their hands. (47) A return to that version of scientific literacy, which focused more on teaching what science is and how it works and less on memorizing scientific facts, seems like something society today desperately needs.\n\nIn the United States, the desire to provide the public with a general, nontechnical education in science originated as far back as the late 1800s. (48) Educators advanced the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills. The development in 1915 of the popular new subject \"general science\" was another effort to train students to apply the principles of science to everyday, nonscience problems.\n\nAlthough these efforts were aimed at the nonscience-bound student, they never really made their way into mainstream thought and public discourse as a means to rally widespread support for the importance of science teaching in schools. (49) It wasn't until the phrase \"scientific literacy\" came along in the 1940s that science had the formidable slogan it needed to command public attention and make improving science education an important national goal.\n\n(50) The intense focus on scientific literacy in the United States originally grew out of the critical role of science and technology during World War II, as well as the perceived deficiencies of American soldiers. As the war unfolded, science rapidly assumed a central role. Battles increasingly depended on new military technologies such as radar and the proximity fuze. Science-based analytical approaches proved remarkably successful in the hunt for German submarines in the Atlantic Ocean. And there was the (then-secret) work building the world's first atomic bomb. As a result, scientists—physicists in particular—found themselves in high demand.\n"},{"year":2026,"sec":"questions","label":"阅读题目","text":"C. They were tamed at an earlier time than horses. D. They were vividly portrayed by ancient travelers.\n\n22. What message is conveyed in Brooks' statement? A. The earliest habitats of donkeys are hardly traceable. B. It is increasingly easy to read donkeys' DNA sequences. C. Written accounts contain vital clues for donkey research. D. Genetic analysis offers insight into the history of donkeys.\n\n23. In their study, the researchers investigated how donkeys A. dispersed widely in the world. B. survived with the help of herders. C. developed certain behavioral traits. D. adapted to the changing environment.\n\n24. As to why the original domestication of donkeys happened, Orlando A. challenges conventional ideas. B. provides a possible explanation. C. calls for evidence from the Sahara. D. holds a different view from Kreier.\n\n25. The authors think that their research could help with A. greater protection of wildlife. B. better management of donkeys. C. recovering early types of donkeys. D. raising awareness of climate change.\n\n26. The Art Directors Guild's statement reveals A. people's reduced interest in film. B. film workers' nostalgia for the past. C. the appeal of Southern California. D. the gloomy situation of Hollywood.\n\n27. The example of Georgia is used to illustrate the efforts to A. lure production with tax incentives. B. drive improvements in film facilities. C. stimulate competition among studios. D. collect funds for film and TV making.\n\n28. Peak TV passed its peak as A. streamers lost their technical advantages. B. streamers changed their strategic priorities. C. subscribers grew weary of large platforms. D. subscribers were unhappy with new shows.\n\n29. According to Paragraph 6, California's entertainment industry might face A. a decline in product quality. B. a demand for foreign talent. C. a brain drain to other places. D. a dramatic rise in labor costs.\n\n30. The author concludes the text by emphasizing that California should strive to A. maintain its position in the industry. B. attract more investment than its rivals. C. pursue a higher standard of production. D. strengthen coordination with other states.\n\n31. What can be learnt about wireless from Reith? A. It was accessible to everyone. B. It improved interpersonal relations. C. It was a miracle of human ingenuity. D. It led to a new era of isolating culture.\n\n32. What is the theme of the exhibition at the Bodleian in Oxford? A. The impact of radio on its early audience. B. The role of radio in public music education. C. The innovation process of radio technology. D. The eminent pioneers in radio broadcasting.\n\n33. It is indicated in Paragraph 4 that A. the research on radio used to be inadequate. B. the charm of radio remains in the digital age. C. radio listeners could make unexpected gains. D. radio shows have changed little over the years.\n\n34. The expression \"talking on the brush handle\" in Paragraphs 3 and 6 refers to the act of A. making a loud noise. B. having a casual chat. C. starting a trivial quarrel. D. humming a popular song.\n\n35. In the last paragraph, the author intends to express the opinion that A. technology should be aimed at benefiting humans. B. actions should be taken to revive the art of listening. C. adolescents should form healthy social media habits. D. people should adopt a sensible attitude to innovations.\n\nA. the scarcity of tree-ring research in the U.S. B. the firefighting measures in ancient Europe. C. the forest management practices in the 1970s. D. the number of wildfires in precolonial times.\n\n37. Paragraph 2 mainly focuses on A. the causes of previous burns. B. the treatment of diseased trees. C. the benefits of low-severity fires. D. the importance of forest ecosystems.\n\n38. What did the study find about the wildfires over the past few decades? A. Their intensity has vastly fluctuated. B. Their frequency has markedly decreased. C. Their threats have been underestimated. D. Their records have been misinterpreted.\n\n39. What can be inferred about modern firefighting? A. Its workforce needs more training. B. Its effectiveness is questioned by the public. C. It may render traditional tactics useless. D. It may make severe fires harder to put out.\n\n40. Both Martin and Prichard would agree that A. it is challenging to predict large wildfires. B. it is urgent to assess the use of planned fires. C. it is necessary to introduce prescribed burns. D. it is rewarding to double fire detection efforts.\n"},{"year":2026,"sec":"writing","label":"写作","text":"Hi Li Ming,\n\nI was really moved by the Chinese families' handwritten letters you posted\n\nyesterday. They are priceless! Could you please tell me a bit more about them?\n\nAnd are they currently on public display somewhere? I'm very keen to see them\n\nin person. Thanks!\n\nPaul\n\n2) interpret the charts, and\n"}],"irregular":{"arose":["arise"],"arisen":["arise"],"awoke":["awake"],"awoken":["awake"],"was":["be"],"were":["be"],"been":["be"],"being":["be"],"am":["be"],"is":["be"],"are":["be"],"bore":["bear"],"borne":["bear"],"beaten":["beat"],"became":["become"],"began":["begin"],"begun":["begin"],"bent":["bend"],"bit":["bite"],"bitten":["bite"],"blew":["blow"],"blown":["blow"],"broke":["break"],"broken":["break"],"bred":["breed"],"brought":["bring"],"built":["build"],"burnt":["burn"],"bought":["buy"],"caught":["catch"],"chose":["choose"],"chosen":["choose"],"came":["come"],"crept":["creep"],"dealt":["deal"],"dug":["dig"],"did":["do"],"done":["do"],"does":["do"],"drew":["draw"],"drawn":["draw"],"dreamt":["dream"],"drank":["drink"],"drunk":["drink"],"drove":["drive"],"driven":["drive"],"ate":["eat"],"eaten":["eat"],"fallen":["fall"],"fought":["fight"],"fled":["flee"],"flew":["fly"],"flown":["fly"],"flies":["fly"],"forbade":["forbid"],"forbidden":["forbid"],"foresaw":["foresee"],"foreseen":["foresee"],"forgot":["forget"],"forgotten":["forget"],"forgave":["forgive"],"forgiven":["forgive"],"froze":["freeze"],"frozen":["freeze"],"got":["get"],"gotten":["get"],"gave":["give"],"given":["give"],"went":["go"],"gone":["go"],"goes":["go"],"grew":["grow"],"grown":["grow"],"hung":["hang"],"had":["have"],"has":["have"],"heard":["hear"],"hid":["hide"],"hidden":["hide"],"held":["hold"],"kept":["keep"],"knew":["know"],"known":["know"],"laid":["lay"],"leant":["lean"],"leapt":["leap"],"learnt":["learn"],"lent":["lend"],"lain":["lie"],"lost":["lose"],"made":["make"],"meant":["mean"],"met":["meet"],"misled":["mislead"],"mistook":["mistake"],"mistaken":["mistake"],"overcame":["overcome"],"overtook":["overtake"],"overtaken":["overtake"],"overthrew":["overthrow"],"overthrown":["overthrow"],"paid":["pay"],"proven":["prove"],"rode":["ride"],"ridden":["ride"],"rang":["ring"],"rung":["ring"],"risen":["rise"],"ran":["run"],"said":["say"],"seen":["see"],"sought":["seek"],"sold":["sell"],"sent":["send"],"shook":["shake"],"shaken":["shake"],"shone":["shine"],"shot":["shoot"],"shown":["show"],"shrank":["shrink"],"shrunk":["shrink"],"sang":["sing"],"sung":["sing"],"sank":["sink"],"sunk":["sink"],"sat":["sit"],"slept":["sleep"],"slid":["slide"],"spoke"
