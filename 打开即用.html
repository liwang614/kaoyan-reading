<script>
/* 双击 HTML 版：所有资料内嵌，接口由浏览器本地存储实现，不发送网络请求。 */
(() => {
  'use strict';
  const pack = JSON.parse(document.getElementById('offline-data').textContent);
  const KEY = 'kaoyan-reading-offline-v1';
  const years = Array.from({length: 17}, (_, i) => String(2010 + i));
  const clone = value => JSON.parse(JSON.stringify(value));
  const blank = () => ({answers: Array(45).fill(null), wrongOptions: Array(45).fill(null), minutes: null, studyOrder: null, updatedAt: null});
  const fresh = () => ({version: 1, marks: {}, progress: {}, records: Object.fromEntries(years.map(y => [y, blank()]))});
  const load = () => {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : fresh();
  };
  const commit = data => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch { throw Error('浏览器未能保存数据，请检查存储权限或剩余空间，并及时备份。'); }
  };
  const reply = (data, status = 200) => new Response(JSON.stringify(data), {status, headers: {'Content-Type': 'application/json;charset=utf-8'}});
  const ordered = records => Object.keys(records).filter(y => Number.isInteger(records[y].studyOrder) && records[y].studyOrder > 0)
    .sort((a, b) => records[a].studyOrder - records[b].studyOrder || Number(a) - Number(b));
  const normalize = records => {
    const list = ordered(records);
    for (const y of Object.keys(records)) records[y].studyOrder = list.includes(y) ? list.indexOf(y) + 1 : null;
  };
  const statusOf = (data, key) => ['todo', 'doing', 'done'].includes(data.progress[key]?.status)
    ? data.progress[key].status : data.marks[key]?.length ? 'doing' : 'todo';
  const tokens = text => text.toLowerCase().replace(/’/g, "'").match(/[a-z]+(?:'[a-z]+)?/g) || [];
  const ambiguous = new Set(pack.ambiguous), noStrip = new Set(pack.noStrip);
  const bases = value => {
    let t = value.toLowerCase().replace(/^'+|'+$/g, '').replace(/'s$/, '');
    if (ambiguous.has(t)) return new Set([t]);
    let out = new Set([t, ...(pack.irregular[t] || [])]);
    const n = t.length;
    if (!noStrip.has(t) && n > 3 && t.endsWith('s') && !/(ss|us|is)$/.test(t)) {
      out.add(t.slice(0, -1));
      if (n > 4 && t.endsWith('ies')) out.add(t.slice(0, -3) + 'y');
      else if (t.endsWith('es')) out.add(t.slice(0, -2));
    }
    if (n > 4 && t.endsWith('ed')) {
      const stem = t.slice(0, -2);
      out.add(stem); out.add(t.slice(0, -1));
      if (t.endsWith('ied')) out.add(t.slice(0, -3) + 'y');
      if (stem.length > 2 && stem.at(-1) === stem.at(-2) && !'aeiouls'.includes(stem.at(-1))) out.add(stem.slice(0, -1));
    }
    if (n > 5 && t.endsWith('ing')) {
      const stem = t.slice(0, -3);
      out.add(stem); out.add(stem + 'e');
      if (t.endsWith('ying')) out.add(t.slice(0, -4) + 'ie');
      if (stem.length > 2 && stem.at(-1) === stem.at(-2) && !'aeiouls'.includes(stem.at(-1))) out.add(stem.slice(0, -1));
    }
    return new Set([...out].filter(b => b.length >= 3 || b === t));
  };
  let docs, vocab;
  const cache = new Map();
  function count(term) {
    if (cache.has(term)) return cache.get(term);
    if (!docs) {
      docs = pack.docs.map(d => ({...d, tokens: tokens(d.text)}));
      vocab = new Map();
      for (const d of docs) for (const t of d.tokens) if (!vocab.has(t)) vocab.set(t, bases(t));
    }
    const words = tokens(term), by = [], forms = {};
    let exact = 0;
    if (!words.length) return {total: 0, years: 0, exact: 0, by, forms};
    const sets = words.map(word => {
      const w = word.replace(/^'+|'+$/g, '').replace(/'s$/, '');
      const bs = w.length < 3 ? new Set([w]) : bases(w);
      return new Set([...vocab].filter(([form, fb]) => form === w || [...bs].some(b => fb.has(b))).map(([f]) => f));
    });
    for (const d of docs) {
      let n = 0;
      for (let i = 0; i <= d.tokens.length - words.length; i++) {
        if (!sets.every((s, k) => s.has(d.tokens[i + k]))) continue;
        n++;
        const form = d.tokens.slice(i, i + words.length).join(' ');
        forms[form] = (forms[form] || 0) + 1;
        if (words.every((w, k) => w === d.tokens[i + k])) exact++;
      }
      if (n) by.push({year: d.year, sec: d.sec, label: d.label, n});
    }
    const sections = ['cloze', 'reading', 'questions', 'partb', 'partc', 'writing'];
    by.sort((a,b) => a.year-b.year || sections.indexOf(a.sec)-sections.indexOf(b.sec) || a.label.localeCompare(b.label));
    const result = {total: by.reduce((s,d) => s+d.n,0), years: new Set(by.map(d => d.year)).size, exact, by,
      forms: Object.fromEntries(Object.entries(forms).sort((a,b) => b[1]-a[1]))};
    cache.set(term, result); return result;
  }
  const cell = text => text.replace(/\|/g, '\\|');
  const occTotal = o => `${o.total} 次 / ${o.years} 年${o.exact !== o.total ? `（本词形 ${o.exact} 次）` : ''}`;
  const occSummary = o => {
    const grouped = {};
    for (const d of o.by) (grouped[d.year] ||= []).push(d.label + (d.n > 1 ? `×${d.n}` : ''));
    return Object.entries(grouped).map(([y, parts]) => `${y} ${parts.join('、')}`).join('；');
  };
  function articleMD(data, year, text, include, level=1) {
    const marks = [...(data.marks[`${year}-${text}`] || [])].sort((a,b) => a.p-b.p || a.start-b.start);
    const words = marks.filter(m => m.type === 'word'), sentences = marks.filter(m => m.type === 'sentence');
    const h = '#'.repeat(level), out = [`${h} ${year} Text ${text}`, ''];
    const r = data.records[year], start = 20 + 5 * (Number(text)-1);
    const quiz = Array.from({length: 5}, (_,i) => ({q: start+i+1, a: r.answers[start+i], o: r.wrongOptions[start+i]}));
    const done = quiz.filter(x => x.a !== null);
    if (include.includes('quiz') && done.length) out.push(`${h}# 做题结果（对 ${done.filter(x=>x.a).length} / ${done.length}）`, '',
      quiz.map(x => x.a === null ? `${x.q} 未做` : x.a ? `${x.q} ✓` : `${x.q} ✗${x.o ? `（选 ${x.o}）` : ''}`).join(' · '), '');
    if (include.includes('word')) {
      out.push(`${h}# 生词（${words.length}）`, '');
      if (!words.length) out.push('_无_');
      else if (include.includes('occ')) {
        out.push('| # | 生词 | 段落 | 历年出现 | 分布 |', '|---|------|------|------|------|');
        words.forEach((m,i) => {const o=count(m.text); out.push(`| ${i+1} | ${cell(m.text)} | P${m.p+1} | ${occTotal(o)} | ${cell(occSummary(o))} |`);});
      } else {
        out.push('| # | 生词 | 段落 |', '|---|------|------|');
        words.forEach((m,i) => out.push(`| ${i+1} | ${cell(m.text)} | P${m.p+1} |`));
      }
      out.push('');
    }
    if (include.includes('sentence')) {
      out.push(`${h}# 难句（${sentences.length}）`, '');
      if (!sentences.length) out.push('_无_', '');
      sentences.forEach((m,i) => out.push(`**${i+1}.** P${m.p+1}`, '', `> ${m.text}`, ''));
    }
    return out.join('\n');
  }
  function mergedMD(data, items, include) {
    const all = new Map(); let words=0, sentences=0;
    for (const [y,t] of items) for (const m of data.marks[`${y}-${t}`] || []) {
      if (m.type === 'word') {
        words++; const key=m.text.toLowerCase();
        if (!all.has(key)) all.set(key, {word:m.text, where:[]});
        all.get(key).where.push(`${y}-T${t}`);
      } else sentences++;
    }
    const title=[['word','生词'],['sentence','难句'],['quiz','做题结果']].filter(([k])=>include.includes(k)).map(([,v])=>v).join('与') || '导出';
    const counts=[...(include.includes('word')?[`生词 ${words}`]:[]), ...(include.includes('sentence')?[`难句 ${sentences}`]:[])];
    const out=[`# 考研英语阅读 · ${title}`, '', `> 导出时间 ${new Date().toLocaleString('zh-CN')} ｜ 共 ${items.length} 篇 ｜ ${counts.join(' ｜ ')}`, '', '## 目录', '',
      ...items.map(([y,t])=>`- [${y} Text ${t}](#${y}-text-${t})`), ''];
    for (const [y,t] of items) out.push(articleMD(data,y,t,include,2),'');
    if (include.includes('word')) {
      out.push(`## 生词总表（去重，${all.size}）`, '');
      if (!all.size) out.push('_无_');
      else {
        const occ=include.includes('occ');
        out.push(occ?'| # | 生词 | 标注出处 | 历年出现 | 分布 |':'| # | 生词 | 标注出处 |', occ?'|---|------|------|------|------|':'|---|------|------|');
        [...all].sort(([a],[b])=>a.localeCompare(b)).forEach(([,m],i)=>{
          let line=`| ${i+1} | ${cell(m.word)} | ${m.where.join(', ')} |`;
          if (occ) {const o=count(m.word); line+=` ${occTotal(o)} | ${cell(occSummary(o))} |`;}
          out.push(line);
        });
      }
    }
    return out.join('\n')+'\n';
  }
  // 无依赖 ZIP（STORE）：保留“每篇一个 MD”的多篇打包导出。
  const encoder = new TextEncoder();
  const crcTable = Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
  function zip(files) {
    const chunks=[], central=[]; let offset=0, centralSize=0;
    const header=(size,signature)=>{const bytes=new Uint8Array(size); const view=new DataView(bytes.buffer); view.setUint32(0,signature,true);return [bytes,view];};
    for (const [name,text] of files) {
      const filename=encoder.encode(name), content=encoder.encode(text);
      let crc=0xffffffff; for(const b of content)crc=crcTable[(crc^b)&255]^(crc>>>8);crc=(crc^0xffffffff)>>>0;
      const [local,l]=header(30,0x04034b50);
      l.setUint16(4,20,true);l.setUint16(6,0x800,true);l.setUint16(12,33,true);l.setUint32(14,crc,true);l.setUint32(18,content.length,true);l.setUint32(22,content.length,true);l.setUint16(26,filename.length,true);
      chunks.push(local,filename,content);
      const [cent,c]=header(46,0x02014b50);
      c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,33,true);c.setUint32(16,crc,true);c.setUint32(20,content.length,true);c.setUint32(24,content.length,true);c.setUint16(28,filename.length,true);c.setUint32(42,offset,true);
      central.push(cent,filename);centralSize+=46+filename.length;offset+=30+filename.length+content.length;
    }
    const [end,e]=header(22,0x06054b50);
    e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);
    return new Blob([...chunks,...central,end],{type:'application/zip'});
  }
  function exportFile(url) {
    const data=load(), params=url.searchParams;
    const items=(params.get('items')||'').split(',').filter(key=>pack.articles[key]).map(key=>key.split('-')).sort((a,b)=>Number(a[0])-Number(b[0])||Number(a[1])-Number(b[1]));
    if (!items.length) throw Error('没有可导出的文章');
    const include=(params.get('include')||'word,sentence,quiz,occ').split(',');
    if (params.get('mode')==='merged') return {filename:'考研阅读-生词难句.md',blob:new Blob([mergedMD(data,items,include)],{type:'text/markdown;charset=utf-8'})};
    const files=items.map(([y,t])=>[`${y}-Text${t}.md`,articleMD(data,y,t,include)]);
    return files.length===1 ? {filename:files[0][0],blob:new Blob([files[0][1]],{type:'text/markdown;charset=utf-8'})} : {filename:'考研阅读-生词难句.zip',blob:zip(files)};
  }
  const saveBlob=(blob,filename)=>{
    const a=document.createElement('a'), url=URL.createObjectURL(blob);
    a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  };
  document.addEventListener('click',event=>{
    const a=event.target.closest?.('a');
    if (!a || !a.getAttribute('href')?.startsWith('/api/export?')) return;
    event.preventDefault();
    try {const f=exportFile(new URL(a.getAttribute('href'),'https://offline.local'));saveBlob(f.blob,f.filename);}
    catch(e){alert(e.message);}
  },true);
  // 仅拦截本应用接口；保持原前端和服务端版本的交互一致。
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async (input,options={})=>{
    const path=typeof input==='string'?input:input.url;
    if (!path.startsWith('/api/')) return nativeFetch(input,options);
    try {
      const url=new URL(path,'https://offline.local'), key=`${url.searchParams.get('year')}-${url.searchParams.get('text')}`;
      const method=(options.method||'GET').toUpperCase(), body=options.body?JSON.parse(options.body):{};
      const data=load(); normalize(data.records);
      if (url.pathname==='/api/articles' && method==='GET') return reply(Object.keys(pack.articles).map(k=>{
        const [year,text]=k.split('-').map(Number), marks=data.marks[k]||[];
        return {year,text,words:marks.filter(m=>m.type==='word').length,sentences:marks.filter(m=>m.type==='sentence').length,status:statusOf(data,k),opened:data.progress[k]?.opened||null};
      }).sort((a,b)=>a.year-b.year||a.text-b.text));
      if (url.pathname==='/api/records' && method==='GET') return reply({schemaVersion:2,exam:'考研英语一',records:data.records});
      if (url.pathname==='/api/article' && method==='GET' && pack.articles[key]) {
        const paragraphs=pack.articles[key], marks=clone(data.marks[key]||[]);
        for (const m of marks) {
          m.stale=paragraphs[m.p]?.slice(m.start,m.end)!==m.text;
          if (m.stale) for (const p of [m.p,...paragraphs.map((_,i)=>i).filter(i=>i!==m.p)]) {
            const index=paragraphs[p]?.indexOf(m.text)??-1;
            if(index>=0){Object.assign(m,{p,start:index,end:index+m.text.length,stale:false});break;}
          }
        }
        (data.progress[key]||={}).opened=new Date().toISOString();commit(data);
        const [year,text]=key.split('-').map(Number);
        return reply({year,text,paragraphs,marks,status:statusOf(data,key)});
      }
      if (url.pathname==='/api/occurrences' && method==='POST') return reply(Object.fromEntries(body.terms.map(t=>[t,count(String(t))])));
      if (method==='PUT' && pack.articles[key]) {
        if(url.pathname==='/api/marks')data.marks[key]=body.marks.filter(m=>['word','sentence'].includes(m.type));
        else if(url.pathname==='/api/status' && ['todo','doing','done'].includes(body.status))(data.progress[key]||={}).status=body.status;
        else return reply({error:'状态无效'},400);
        commit(data);return reply({ok:true});
      }
      const match=url.pathname.match(/^\/api\/records\/(201\d|202[0-6])$/);
      if(match && method==='PATCH'){
        const year=match[1], r=data.records[year], now=new Date().toISOString();
        if('question' in body){
          if(!Number.isInteger(body.question)||body.question<1||body.question>45||![true,false,null].includes(body.correct))throw Error('题目格式有误');
          const option=body.wrongOption??null;
          if(option!==null&&(body.correct!==false||!(body.question<=40?'ABCD':'ABCDEFG').includes(option)||option.length!==1))throw Error('选项格式有误');
          r.answers[body.question-1]=body.correct;r.wrongOptions[body.question-1]=body.correct===false?option:null;
        }
        if('minutes' in body){if(body.minutes!==null&&(!Number.isFinite(body.minutes)||body.minutes<0||body.minutes>1440))throw Error('用时格式有误');r.minutes=body.minutes;}
        if('studyOrder' in body){
          const position=body.studyOrder;
          if(position!==null&&position!=='append'&&(!Number.isInteger(position)||position<1||position>17))throw Error('做题顺序应为 1—17 的整数，或留空');
          if(!(position==='append'&&r.studyOrder!==null)){
            const list=ordered(data.records).filter(y=>y!==year);
            if(position!==null)list.splice(position==='append'?list.length:Math.min(position-1,list.length),0,year);
            for(const y of years){const order=list.includes(y)?list.indexOf(y)+1:null;if(order!==data.records[y].studyOrder)data.records[y].updatedAt=now;data.records[y].studyOrder=order;}
          }
        }
        r.updatedAt=now;commit(data);
        return reply({...r,studyOrders:Object.fromEntries(years.map(y=>[y,data.records[y].studyOrder]))});
      }
      return reply({error:'未找到'},404);
    } catch(e){return reply({error:e.message},400);}
  };
  // 本地版增加完整备份 / 恢复，避免换浏览器或移动文件时丢失学习记录。
  const controls=()=>{
    const bar=document.querySelector('.topbar');if(!bar||bar.querySelector('[data-offline-backup]'))return;
    const backup=document.createElement('button');backup.className='btn';backup.dataset.offlineBackup='';backup.textContent='备份数据';
    backup.onclick=()=>saveBlob(new Blob([JSON.stringify({format:'kaoyan-reading-offline',version:1,exportedAt:new Date().toISOString(),data:load()},null,2)],{type:'application/json;charset=utf-8'}),'考研阅读-完整备份.json');
    const restore=document.createElement('button');restore.className='btn';restore.textContent='恢复数据';
    restore.onclick=()=>{
      const file=document.createElement('input');file.type='file';file.accept='.json,application/json';
      file.onchange=async()=>{try{
        if(!file.files?.[0])return;
        const saved=JSON.parse(await file.files[0].text()), data=saved.data;
        if(saved.format!=='kaoyan-reading-offline'||saved.version!==1||!data?.marks||!data.progress||!data.records)throw Error('请选择本工具导出的完整备份文件');
        for(const y of years){const r=data.records[y];if(!r||!Array.isArray(r.answers)||r.answers.length!==45||!r.answers.every(a=>[true,false,null].includes(a))||!Array.isArray(r.wrongOptions)||r.wrongOptions.length!==45)throw Error('备份中的做题记录格式有误');}
        for(const [key,marks] of Object.entries(data.marks)){if(!pack.articles[key]||!Array.isArray(marks)||!marks.every(m=>m&&typeof m.id==='string'&&/^[A-Za-z0-9_-]+$/.test(m.id)&&['word','sentence'].includes(m.type)&&Number.isInteger(m.p)&&Number.isInteger(m.start)&&Number.isInteger(m.end)&&m.p>=0&&m.start>=0&&m.end>=m.start&&typeof m.text==='string'))throw Error('备份中的标注格式有误');}
        if(!confirm('恢复会替换当前浏览器内的学习记录。请先备份当前数据，确定恢复吗？'))return;
        commit(data);location.reload();
      }catch(e){alert(e.message);}};file.click();
    };
    bar.append(backup,restore);
  };
  new MutationObserver(controls).observe(document.getElementById('app'),{childList:true});
})();

</script>
<script>
/* =========================================================
   做题记录（原「英语真题记录」，并入本项目）
   数据逻辑、键盘操作、错选项、做题顺序、导出均与原项目一致；
   路由放在 #/tracker/... 下，样式统一为本项目的主题。
   ========================================================= */
(function () {
  const years = Array.from({ length: 17 }, (_, i) => 2010 + i);
  const sections = [['完形填空', 1, 20], ['阅读 · Text 1', 21, 25], ['阅读 · Text 2', 26, 30], ['阅读 · Text 3', 31, 35], ['阅读 · Text 4', 36, 40], ['新题型', 41, 45]];
  const parts = [{ id: 'cloze', label: '完形', start: 1, end: 20 }, { id: 'reading', label: '阅读', start: 21, end: 40 }, { id: 'new-type', label: '新题型', start: 41, end: 45 }];
  const pendingKey = 'english-tracker-v1-pending';
  let records = {}, loaded = null, currentYear = null, currentPart = parts[0], active = false, saving = false, retryTimer;
  let pending = [];
  try { pending = JSON.parse(localStorage.getItem(pendingKey) || '[]'); if (!Array.isArray(pending)) pending = []; } catch { pending = []; }
  const listeners = new Set();
  const notify = () => listeners.forEach((fn) => { try { fn(); } catch {} });

  /* ---------- 做题顺序 ---------- */
  function orderedYears(recs) {
    return Object.keys(recs).filter((y) => Number.isInteger(recs[y].studyOrder) && recs[y].studyOrder > 0)
      .sort((a, b) => recs[a].studyOrder - recs[b].studyOrder || Number(a) - Number(b));
  }
  function normalizeOrders(recs) {
    const ordered = orderedYears(recs);
    for (const [year, record] of Object.entries(recs)) record.studyOrder = ordered.includes(year) ? ordered.indexOf(year) + 1 : null;
  }
  function moveStudyOrder(recs, year, position) {
    year = String(year);
    normalizeOrders(recs);
    if (position === 'append' && recs[year].studyOrder !== null) return;
    const ordered = orderedYears(recs).filter((y) => y !== year);
    if (position !== null) ordered.splice(position === 'append' ? ordered.length : Math.min(position - 1, ordered.length), 0, year);
    for (const [y, record] of Object.entries(recs)) record.studyOrder = ordered.includes(y) ? ordered.indexOf(y) + 1 : null;
  }

  /* ---------- 统计 / 保存 ---------- */
  const stats = (r, start = 1, end = 45) => {
    const a = r.answers.slice(start - 1, end), done = a.filter((v) => v !== null).length, correct = a.filter((v) => v === true).length;
    return { done, correct, wrong: done - correct, unmarked: a.length - done, rate: done ? Math.round(correct / done * 1000) / 10 : null };
  };
  const percent = (s) => s.rate === null ? '—' : `${s.rate}%`;
  const safeDate = (iso) => iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '—';
  function showError(message, retry) {
    let box = document.querySelector('#trk-error');
    if (!box) { box = document.createElement('div'); box.id = 'trk-error'; box.className = 'trk-error'; box.setAttribute('role', 'alert'); document.body.append(box); }
    box.replaceChildren(document.createTextNode(message));
    if (retry) { const b = document.createElement('button'); b.textContent = '重试'; b.onclick = retry; box.append(b); }
    box.hidden = false;
  }
  const hideError = () => { const box = document.querySelector('#trk-error'); if (box) box.hidden = true; };
  function persistPending() { try { localStorage.setItem(pendingKey, JSON.stringify(pending)); } catch { /* 服务器仍是主存储 */ } }
  function applyPatch(year, patch) {
    const r = records[year];
    if ('question' in patch) { r.answers[patch.question - 1] = patch.correct; r.wrongOptions[patch.question - 1] = patch.correct === false ? (patch.wrongOption ?? null) : null; }
    if ('minutes' in patch) r.minutes = patch.minutes;
    if ('studyOrder' in patch) moveStudyOrder(records, year, patch.studyOrder);
    r.updatedAt = new Date().toISOString();
  }
  function change(year, patch) { applyPatch(year, patch); pending.push({ year, patch }); persistPending(); flush(); notify(); }
  async function flush() {
    if (saving || !pending.length) return;
    saving = true; clearTimeout(retryTimer);
    try {
      while (pending.length) {
        const item = pending[0];
        const response = await fetch(`/api/records/${item.year}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item.patch) });
        if (!response.ok) throw Error('保存失败');
        const result = await response.json(); pending.shift(); persistPending();
        if (result.studyOrders) {
          for (const [year, order] of Object.entries(result.studyOrders)) records[year].studyOrder = order;
          for (const queued of pending) if ('studyOrder' in queued.patch) moveStudyOrder(records, queued.year, queued.patch.studyOrder);
          updateOrderControls();
        }
      }
      hideError();
    } catch { showError('暂未保存，正在重试', flush); retryTimer = setTimeout(flush, 3000); }
    finally { saving = false; }
  }

  function load() {
    if (loaded) return loaded;
    loaded = (async () => {
      const response = await fetch('/api/records'); if (!response.ok) throw Error('记录读取失败');
      records = (await response.json()).records;
      for (const r of Object.values(records)) { r.wrongOptions ??= Array(45).fill(null); r.studyOrder ??= null; }
      normalizeOrders(records);
      pending = pending.filter((item) => years.includes(Number(item.year)) && item.patch && typeof item.patch === 'object');
      for (const item of pending) applyPatch(item.year, item.patch);
      flush();
      return records;
    })();
    loaded.catch(() => { loaded = null; });
    return loaded;
  }

  /* ---------- 页面 ---------- */
  const app = document.querySelector('#app');
  function shell(content, detail = false) {
    app.innerHTML = `
      <header class="topbar">
        <h1>考研英语<span>做题记录</span></h1>
        ${window.navSwitch('tracker')}
        <span class="spacer"></span>
        ${detail ? `<a class="back" href="#/tracker/${currentPart.id}">← 全部年份</a>` : ''}
        ${window.THEME_BTN}
        <button class="btn" id="export-md">下载 Markdown</button>
        <button class="btn primary" id="export-json">下载 JSON</button>
      </header>
      <main class="trk">${content}</main>`;
    document.querySelector('#export-md').onclick = () => download('md');
    document.querySelector('#export-json').onclick = () => download('json');
  }

  function renderHome() {
    shell(`
      <div class="trk-heading"><h2>年份</h2><span class="range">2010 — 2026 · 英语一客观题</span></div>
      <div class="seg trk-parts" role="group" aria-label="客观题部分">${parts.map((part) =>
        `<button type="button" data-part="${part.id}" aria-pressed="${part.id === currentPart.id}" class="${part.id === currentPart.id ? 'on' : ''}">${part.label}</button>`).join('')}</div>
      <div class="trk-table">
        <div class="trk-cols" aria-hidden="true"><span>年份</span><span>正确 / 总数</span><span>正确率</span><span>用时</span><span>做题顺序</span></div>
        <div class="trk-rows">${years.map((y) => {
          const r = records[y], s = stats(r, currentPart.start, currentPart.end);
          return `<div class="trk-row"><a class="trk-link" href="#/tracker/${currentPart.id}/${y}" aria-label="${y} 年">
              <span class="trk-year">${y}</span>
              <span class="trk-progress">${s.correct} <i>/ ${s.done + s.unmarked}</i></span>
              <span class="trk-rate"><b>${percent(s)}</b><i class="trk-bar"><i style="width:${s.rate ?? 0}%"></i></i></span>
              <span class="trk-time">${r.minutes ?? '—'}${r.minutes === null ? '' : '<i>分钟</i>'}</span></a>
            <div class="order-control" data-year="${y}"><button type="button" class="order-circle" aria-label="${y} 年做题顺序">${r.studyOrder ?? ''}</button><input hidden type="number" min="1" max="17" step="1" inputmode="numeric" aria-label="${y} 年做题顺序输入"></div></div>`;
        }).join('')}</div>
      </div>`);
    for (const button of document.querySelectorAll('[data-part]')) button.onclick = () => { location.hash = `#/tracker/${button.dataset.part}`; };
    for (const control of document.querySelectorAll('.order-control')) {
      const year = Number(control.dataset.year), input = control.querySelector('input'), button = control.querySelector('button');
      const edit = (value = records[year].studyOrder ?? '') => {
        button.hidden = true; input.hidden = false; input.value = value; input.removeAttribute('aria-invalid'); input.focus(); input.select();
      };
      const close = () => { input.hidden = true; button.hidden = false; input.removeAttribute('aria-invalid'); updateOrderControls(); };
      const commit = () => {
        if (input.hidden) return true;
        if (!input.validity.valid) { input.setAttribute('aria-invalid', 'true'); input.reportValidity(); return false; }
        const value = input.value === '' ? null : Number(input.value);
        if (value !== records[year].studyOrder) change(year, { studyOrder: value });
        close(); return true;
      };
      button.onclick = () => {
        if (records[year].studyOrder === null) { change(year, { studyOrder: 'append' }); updateOrderControls(); }
        else edit();
      };
      button.onkeydown = (e) => {
        if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); edit(e.key); }
        else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); change(year, { studyOrder: null }); updateOrderControls(); }
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (commit()) button.focus(); }
        else if (e.key === 'Escape') { e.preventDefault(); close(); button.focus(); }
      });
    }
    updateOrderControls();
  }
  function updateOrderControls() {
    for (const control of document.querySelectorAll('.order-control')) {
      const order = records[control.dataset.year].studyOrder, button = control.querySelector('button');
      button.textContent = order ?? ''; button.classList.toggle('assigned', order !== null);
      button.title = order === null ? '点击排到队尾；也可直接键入数字' : `第 ${order} 个做的年份，点击修改`;
    }
  }

  function questionMarkup(q) {
    const r = records[currentYear], answer = r.answers[q - 1], option = r.wrongOptions[q - 1];
    return `<div class="question ${answer === true ? 'correct' : answer === false ? 'wrong' : ''}" tabindex="0" data-q="${q}" role="group" aria-label="第 ${q} 题，${answer === null ? '未做' : answer ? '对' : '错'}"><span class="q-number">${q}<span class="wrong-option">${option ?? ''}</span></span><div class="q-actions"><button tabindex="-1" data-answer="null" aria-label="第 ${q} 题未做" aria-pressed="${answer === null}" class="${answer === null ? 'chosen-undone' : ''}">未做</button><button tabindex="-1" data-answer="true" aria-label="第 ${q} 题对" aria-pressed="${answer === true}" class="${answer === true ? 'chosen-correct' : ''}">✓</button><button tabindex="-1" data-answer="false" aria-label="第 ${q} 题错" aria-pressed="${answer === false}" class="${answer === false ? 'chosen-wrong' : ''}">×</button></div></div>`;
  }
  function askWrongOption(q, year = currentYear, done) {
    if (document.querySelector('#wrong-dialog')) return;
    const old = records[year].wrongOptions[q - 1] ?? '', letters = q <= 40 ? 'ABCD' : 'ABCDEFG';
    const dialog = document.createElement('dialog'); dialog.id = 'wrong-dialog'; dialog.className = 'wrong-dialog'; dialog.setAttribute('aria-labelledby', 'wrong-title');
    dialog.innerHTML = `<form><h2 id="wrong-title">第 ${q} 题</h2><label for="wrong-choice">我的选项</label><input id="wrong-choice" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" required pattern="[${letters}]" aria-label="我的选项" value="${old}"><div class="option-choices">${[...letters].map((letter) => `<button type="button" data-choice="${letter}">${letter}</button>`).join('')}</div><div class="dialog-actions"><button type="button" class="btn" id="cancel-wrong">取消</button><button type="submit" class="btn primary">确认</button></div></form>`;
    document.body.append(dialog);
    const input = dialog.querySelector('input');
    const close = () => { dialog.close(); dialog.remove(); if (active && currentYear === year) focusQuestion(q); };
    input.addEventListener('input', () => { const value = input.value.toUpperCase(); input.value = /^[1-7]$/.test(value) ? 'ABCDEFG'[Number(value) - 1] : value; });
    dialog.querySelectorAll('[data-choice]').forEach((button) => button.onclick = () => { input.value = button.dataset.choice; input.focus(); input.select(); });
    dialog.querySelector('#cancel-wrong').onclick = close;
    dialog.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
    dialog.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault(); if (!input.checkValidity()) return; const option = input.value; close();
      if (done) done(option); else if (currentYear === year) setAnswer(q, false, option);
    });
    dialog.showModal(); input.focus(); input.select();
  }
  function sectionMarkup([title, start, end], index) {
    return `<section class="trk-section ${start === 41 ? 'new-type' : ''}"><div class="section-head"><h3>${title}<span>${start}—${end}</span></h3><span class="section-stats" id="section-${index}"></span></div><div class="question-grid">${Array.from({ length: end - start + 1 }, (_, i) => questionMarkup(start + i)).join('')}</div></section>`;
  }
  function renderDetail() {
    const r = records[currentYear];
    const content = currentPart.id === 'reading'
      ? `<div class="trk-reading">${sections.slice(1, 5).map((s, i) => sectionMarkup(s, i + 1).replace('</h3>', `</h3><a class="to-read" href="#/${currentYear}/${i + 1}" title="打开这篇阅读">读原文 →</a>`)).join('')}</div>`
      : sectionMarkup(sections[currentPart.id === 'cloze' ? 0 : 5], currentPart.id === 'cloze' ? 0 : 5);
    shell(`<div class="trk-heading"><div class="year-title"><h2>${currentYear}</h2><span>英语一 · ${currentPart.label}</span></div></div>
      <div class="trk-summary">
        <div class="summary-item"><div class="metric-label">正确率</div><div class="metric-value" id="accuracy"></div></div>
        <div class="summary-item"><div class="metric-label">答对</div><div class="metric-value" id="correct-count"></div></div>
        <div class="summary-item"><div class="metric-label">正确 / 总数</div><div class="metric-value" id="done-count"></div></div>
        <div class="summary-item"><label class="metric-label" for="minutes">用时</label><div class="time-field"><input id="minutes" type="number" min="0" max="1440" step="any" inputmode="decimal" aria-label="用时（分钟）" value="${r.minutes ?? ''}"><span>分钟</span></div></div>
      </div>
      <p class="trk-keys">键盘：<kbd>1</kbd> 未做 <kbd>2</kbd> 对 <kbd>3</kbd> 错 · 方向键切题 · <kbd>Delete</kbd> 清除</p>
      ${content}`, true);
    document.querySelector('#minutes').addEventListener('input', (e) => {
      if (e.target.validity.badInput || !e.target.validity.valid) { e.target.setAttribute('aria-invalid', 'true'); return; }
      e.target.removeAttribute('aria-invalid');
      const value = e.target.value === '' ? null : Number(e.target.value);
      change(currentYear, { minutes: value });
    });
    document.querySelector('#minutes').addEventListener('blur', (e) => { if (!e.target.validity.valid) e.target.reportValidity(); });
    for (const el of document.querySelectorAll('.question')) {
      el.addEventListener('click', (e) => {
        const q = Number(el.dataset.q), button = e.target.closest('button[data-answer]');
        if (button) { if (button.dataset.answer === 'false') askWrongOption(q); else setAnswer(q, button.dataset.answer === 'true' ? true : null); }
        else el.focus();
      });
    }
    updateStats(); focusQuestion(currentPart.start, false);
  }
  function focusQuestion(q, scroll = true) {
    const el = document.querySelector(`[data-q="${q}"]`); if (!el) return;
    el.focus({ preventScroll: true });
    if (scroll) { const rect = el.getBoundingClientRect(); if (rect.top < 80 || rect.bottom > innerHeight - 16) el.scrollIntoView({ block: 'nearest', behavior: 'auto' }); }
  }
  function moveQuestionVertically(q, direction) {
    const current = document.querySelector(`[data-q="${q}"]`);
    if (!current) return;
    const rect = current.getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
    const candidates = [...document.querySelectorAll('[data-q]')].map((el) => {
      const r = el.getBoundingClientRect();
      return { q: Number(el.dataset.q), dy: direction * (r.top + r.height / 2 - y), dx: Math.abs(r.left + r.width / 2 - x) };
    }).filter((item) => item.dy > 1);
    if (!candidates.length) return;
    const nearestRow = Math.min(...candidates.map((item) => item.dy));
    const target = candidates.filter((item) => item.dy <= nearestRow + 2).sort((a, b) => a.dx - b.dx)[0];
    focusQuestion(target.q);
  }
  function setAnswer(q, answer, wrongOption = null, advance = true) {
    if (!currentYear || q < currentPart.start || q > currentPart.end) return;
    change(currentYear, { question: q, correct: answer, wrongOption });
    const el = document.querySelector(`[data-q="${q}"]`);
    el.classList.toggle('correct', answer === true); el.classList.toggle('wrong', answer === false);
    el.setAttribute('aria-label', `第 ${q} 题，${answer === null ? '未做' : answer ? '对' : '错'}`);
    for (const button of el.querySelectorAll('button')) {
      const val = button.dataset.answer === 'null' ? null : button.dataset.answer === 'true';
      button.setAttribute('aria-pressed', String(answer === val));
      button.classList.toggle('chosen-undone', val === null && answer === null);
      button.classList.toggle('chosen-correct', val === true && answer === true);
      button.classList.toggle('chosen-wrong', val === false && answer === false);
    }
    el.querySelector('.wrong-option').textContent = answer === false ? (wrongOption ?? '') : '';
    updateStats(); focusQuestion(advance ? Math.min(currentPart.end, q + 1) : q);
  }
  function updateStats() {
    const r = records[currentYear], s = stats(r, currentPart.start, currentPart.end);
    document.querySelector('#accuracy').textContent = percent(s);
    document.querySelector('#correct-count').textContent = s.correct;
    document.querySelector('#done-count').innerHTML = `${s.correct}<span class="unit">/ ${s.done + s.unmarked}</span>`;
    sections.forEach((section, i) => { const el = document.querySelector(`#section-${i}`); if (!el) return; const st = stats(r, section[1], section[2]); el.textContent = `${st.correct} / ${st.done} · ${percent(st)}`; });
  }

  async function show(rest) {
    active = true;
    try { await load(); } catch { app.innerHTML = '<div class="empty">记录读取失败</div>'; showError('无法读取本地记录', () => show(rest)); return; }
    const m = rest.match(/^(?:\/(cloze|reading|new-type))?(?:\/(201\d|202[0-6]))?$/);
    currentPart = parts.find((part) => part.id === m?.[1]) ?? parts[0];
    currentYear = m?.[2] ? Number(m[2]) : null;
    document.title = currentYear ? `${currentYear} · 做题记录` : '做题记录 · 考研英语';
    currentYear ? renderDetail() : renderHome();
  }
  function hide() { active = false; currentYear = null; }

  window.addEventListener('keydown', (e) => {
    if (!active || document.querySelector('#wrong-dialog')) return;
    if (!currentYear || (e.repeat && !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) || e.isComposing || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    if (e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
    const question = e.target.closest('[data-q]'); if (!question) return;
    const q = Number(question.dataset.q);
    if (e.key === '1' || e.code === 'Numpad1') { e.preventDefault(); setAnswer(q, null); }
    else if (e.key === '2' || e.code === 'Numpad2') { e.preventDefault(); setAnswer(q, true); }
    else if (e.key === '3' || e.code === 'Numpad3') { e.preventDefault(); askWrongOption(q); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); focusQuestion(Math.max(currentPart.start, q - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); focusQuestion(Math.min(currentPart.end, q + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveQuestionVertically(q, -1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveQuestionVertically(q, 1); }
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); setAnswer(q, null, null, false); }
  });

  /* ---------- 导出（与原项目相同） ---------- */
  function exportData() {
    return { schemaVersion: 2, exam: '考研英语一', exportedAt: new Date().toISOString(), pendingSaveCount: pending.length, scope: '2010—2026 年，客观题 1—45', accuracyDefinition: '答对题数 / 已标记题数；未做不计入分母；非分值加权', durationUnit: 'minutes', durationScope: '每年客观题总用时，手动输入', records: years.map((year) => {
      const r = records[year]; return { year, minutes: r.minutes, studyOrder: r.studyOrder ?? null, updatedAt: r.updatedAt, summary: stats(r), sections: sections.map(([name, start, end]) => ({ name, start, end, ...stats(r, start, end) })), questions: r.answers.map((answer, i) => ({ number: i + 1, result: answer === null ? 'unattempted' : answer ? 'correct' : 'incorrect', wrongOption: answer === false ? r.wrongOptions[i] : null })) };
    }) };
  }
  function markdown(data) {
    const lines = ['# 英语真题记录', '', `导出时间：${safeDate(data.exportedAt)}`, '', '范围：2010—2026 年，英语一客观题 1—45。', '正确率 = 答对题数 ÷ 已标记题数；未做不计入分母，不按分值加权。', '用时：每年客观题总用时，手动填写，单位为分钟；“—”表示未填写。', ''];
    if (data.pendingSaveCount) lines.push(`尚有 ${data.pendingSaveCount} 项本地保存未完成；本文件已包含当前页面的修改。`, '');
    lines.push('做题顺序：数字越小，做得越早；“—”表示未设置。', '', '| 年份 | 答对 | 答错 | 未做 | 正确率 | 用时（分钟） | 做题顺序 |', '| --- | ---: | ---: | ---: | ---: | ---: | ---: |');
    for (const r of data.records) lines.push(`| ${r.year} | ${r.summary.correct} | ${r.summary.wrong} | ${r.summary.unmarked} | ${percent(r.summary)} | ${r.minutes ?? '—'} | ${r.studyOrder ?? '—'} |`);
    for (const r of data.records.filter((r) => r.summary.done || r.minutes !== null)) {
      lines.push('', `## ${r.year}`, '', `最近修改：${safeDate(r.updatedAt)}`, '', `用时：${r.minutes === null ? '未填写' : `${r.minutes} 分钟`}`, '', '| 题型 | 题号 | 答对 | 答错 | 未做 | 正确率 |', '| --- | --- | ---: | ---: | ---: | ---: |');
      for (const s of r.sections) lines.push(`| ${s.name} | ${s.start}—${s.end} | ${s.correct} | ${s.wrong} | ${s.unmarked} | ${percent(s)} |`);
      lines.push('', '| 题号 | 结果 | 我的错误选项 |', '| ---: | --- | --- |');
      for (const q of r.questions) lines.push(`| ${q.number} | ${{ correct: '对', incorrect: '错', unattempted: '未做' }[q.result]} | ${q.wrongOption ?? '—'} |`);
    }
    return lines.join('\n') + '\n';
  }
  function download(format) {
    const data = exportData(), content = format === 'md' ? markdown(data) : JSON.stringify(data, null, 2);
    const blob = new Blob([content], { type: format === 'md' ? 'text/markdown;charset=utf-8' : 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `英语真题记录-2010-2026.${format}`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  if (document.modelContext?.registerTool) {
    try { Promise.resolve(document.modelContext.registerTool({ name: 'read_exam_records', title: '读取英语真题记录', description: '读取 2010 至 2026 年英语一客观题对错与用时，不修改记录。', inputSchema: { type: 'object', properties: {}, additionalProperties: false }, annotations: { readOnlyHint: true }, execute: () => { if (!Object.keys(records).length) throw Error('记录尚未读取'); return exportData(); } })).catch(() => {}); } catch {}
  }

  /* ---------- 给阅读页用的接口 ---------- */
  window.tracker = {
    show, hide, load, change, stats, percent, askWrongOption,
    records: () => records,
    onChange: (fn) => { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

</script>
  <script>
const $ = (s, el = document) => el.querySelector(s);

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

let toastTimer;
function toast(msg) {

}

/* ================= 两个模块的公共顶栏部件 ================= */

window.THEME_BTN = '<button class="btn icon theme-btn" data-theme-btn title="配色" aria-label="配色"><i class="palette"></i></button>';
window.navSwitch = (active) => `
  <nav class="seg modes" aria-label="切换模块">

/* ================= 路由 ================= */

window.addEventListener('hashchange', route);
route();

function route() {
  hidePop();
  document.body.classList.remove('selecting');

    state.art = null;

    app.innerHTML = `<div class="empty">出错了：${esc(e.message)}<br><br><a class="link" href="#/">返回首页</a></div>`;

/* ================= 首页：选年份 / Text ================= */

const keyOf = (a) => `${a.year}-${a.text}`;
const STATUS_LABEL = { todo: '未做', doing: '进行中', done: '已完成' };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const exp = {
  on: false,
  sel: new Set(store.get('exportSel', [])),
  mode: store.get('exportMode', 'separate'),
  include: store.get('exportInclude2', ['word', 'sentence', 'quiz', 'occ']),
  anchor: null,
  save() {
    store.set('exportSel', [...this.sel]);
    store.set('exportMode', this.mode);
    store.set('exportInclude2', this.include);
  },
};

async function showHome() {
  document.title = '考研阅读 · 生词难句';
  state.art = null;
  const [list, recs] = await Promise.all([api('/api/articles'), tracker.load().catch(() => null)]);
  state.list = list;
  const valid = new Set(list.map(keyOf));
  exp.sel = new Set([...exp.sel].filter((k) => valid.has(k)));

  const years = [...new Set(list.map((a) => a.year))];
  const total = list.reduce((s, a) => ((s.w += a.words), (s.s += a.sentences), s), { w: 0, s: 0 });
  const count = { todo: 0, doing: 0, done: 0 };
  list.forEach((a) => count[a.status]++);
  const pct = (n) => (list.length ? (n / list.length) * 100 : 0).toFixed(2);
  const last = list.filter((a) => a.opened).sort((a, b) => b.opened.localeCompare(a.opened))[0];

  const rows = years.map((y) => {
    const arts = list.filter((a) => a.year === y);
    const max = Math.max(4, ...arts.map((a) => a.text));
    const cards = [];
    for (let t = 1; t <= max; t++) {
      const a = arts.find((x) => x.text === t);
      const qz = quizStats(recs, y, t);
      cards.push(a
        ? `<a class="card st-${a.status}" href="#/${y}/${t}" data-key="${y}-${t}" data-status="${a.status}">
             <i class="tick"></i><span class="st"><i class="st-ic"></i>${STATUS_LABEL[a.status]}</span>
             ${qz && qz.done ? `<span class="quiz${qz.correct === qz.done ? ' full' : ''}" title="21–40 题记录：对 ${qz.correct} / 已做 ${qz.done}">✓ ${qz.correct}/${qz.done}</span>` : ''}
             <b>Text ${t}</b><small>${a.words + a.sentences ? `生词 ${a.words} · 难句 ${a.sentences}` : '尚无标注'}</small></a>`
        : `<div class="card off"><b>Text ${t}</b><small>未导入</small></div>`);
    }
    const done = arts.filter((a) => a.status === 'done').length;
    const dots = arts.map((a) => `<i class="dot ${a.status}" title="Text ${a.text} ${STATUS_LABEL[a.status]}"></i>`).join('');
    return `<section class="year" data-year="${y}">
      <div class="ylabel"><h2 data-year="${y}" title="选择模式下点击可整年选中">${y}</h2>
        <span class="dots">${dots}</span><small>${done}/${arts.length} 完成</small></div>
      <div class="texts">${cards.join('')}</div></section>`;
  });
  const chip = (f, label, n) => `<button data-filter="${f}">${label}<em>${n}</em></button>`;

  app.innerHTML = `
    <header class="topbar">
      <h1>考研英语<span>阅读标注</span></h1>
      ${navSwitch('read')}
      <span class="spacer"></span>
      <button class="btn icon theme-btn" data-theme-btn title="配色" aria-label="配色"><i class="palette"></i></button>
      <button id="selBtn" class="btn primary" ${list.length ? '' : 'disabled'}>选择导出</button>
    </header>
    <main class="home">
      ${list.length
        ? `<div class="overview">
             <div class="ring" style="--d:${pct(count.done)};--g:${pct(count.doing)}" title="已完成 ${count.done} · 进行中 ${count.doing} · 未做 ${count.todo}">
               <div class="ring-in"><b>${count.done}</b><small>/ ${list.length}</small></div>
             </div>
             <div class="ov-main">
               <div class="ov-title">已完成 <b>${count.done}</b> 篇<span class="sep"></span>进行中 <b>${count.doing}</b> 篇</div>
               <div class="ov-meta">还有 ${count.todo} 篇未做 · 已标生词 ${total.w} · 难句 ${total.s}</div>
               <span class="filters" id="filters">
                 ${chip('all', '全部', list.length)}${chip('todo', '未做', count.todo)}${chip('doing', '进行中', count.doing)}${chip('done', '已完成', count.done)}
               </span>
             </div>
             ${last ? `<a class="resume" href="#/${last.year}/${last.text}">
                 <small>继续上次</small><b>${last.year} · Text ${last.text}</b>
                 <span class="st-mini st-${last.status}"><i class="st-ic"></i>${STATUS_LABEL[last.status]}</span><em>→</em></a>` : ''}
           </div>${rows.join('')}`
        : `<div class="empty">还没有文章。<br>把原文放到 <code>articles/年份/textN.txt</code> 后刷新页面。</div>`}
    </main>
    <div class="exportbar" id="exportBar" hidden>
      <div class="eb-row">
        <b id="selCount"></b>
        <span class="eb-quick">
          <button class="link" data-q="all">全选</button>
          <button class="link" data-q="marked">仅已标注</button>
          <button class="link" data-q="invert">反选</button>
          <button class="link" data-q="none">清空</button>
        </span>
        <span class="eb-hint">点卡片选择 · 点年份整年 · Shift 连选</span>
      </div>
      <div class="eb-row">
        <span class="seg" id="modeSeg">
          <button data-mode="separate">每篇一个 md</button>
          <button data-mode="merged">合并为一个 md</button>
        </span>
        <span class="incs" id="incSeg">${incButtons()}</span>
        <span class="eb-spacer"></span>
        <button class="btn" id="selCancel">完成</button>
        <button class="btn primary" id="doExport">下载</button>
      </div>
    </div>`;

  if (!list.length) return;
  $('#filters').onclick = (e) => {
    const b = e.target.closest('button');
    if (b) applyFilter(b.dataset.filter);
  };
  applyFilter(store.get('homeFilter', 'all'));
  $('#selBtn').onclick = () => setSelecting(!exp.on);
  $('#selCancel').onclick = () => setSelecting(false);
  $('#doExport').onclick = doExport;
  $('.home').addEventListener('click', onHomeClick);
  $('#exportBar').addEventListener('click', onBarClick);
  setSelecting(exp.on);
}

/* 阅读 Text n 对应 21+5(n-1) 起的 5 道题 */
function quizStats(recs, year, text) {
  if (!recs || !recs[year] || !(text >= 1 && text <= 4)) return null;
  const start = 21 + 5 * (text - 1);
  return tracker.stats(recs[year], start, start + 4);
}

function applyFilter(f) {
  store.set('homeFilter', f);
  document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('on', b.dataset.filter === f));
  document.querySelectorAll('.card[data-key]').forEach((c) => c.classList.toggle('dim', f !== 'all' && c.dataset.status !== f));
  document.querySelectorAll('section.year').forEach((sec) => {
    sec.hidden = f !== 'all' && !sec.querySelector(`.card[data-status="${f}"]`);
  });
}

function setSelecting(on) {
  exp.on = on;
  document.body.classList.toggle('selecting', on);
  $('#exportBar').hidden = !on;
  $('#selBtn').textContent = on ? '退出选择' : '选择导出';
  $('#selBtn').classList.toggle('primary', !on);
  if (on && !exp.sel.size) state.list.filter((a) => a.words + a.sentences > 0).forEach((a) => exp.sel.add(keyOf(a)));
  paintSel();
}

function paintSel() {
  document.querySelectorAll('.card[data-key]').forEach((c) => c.classList.toggle('picked', exp.sel.has(c.dataset.key)));
  document.querySelectorAll('.year h2').forEach((h) => {
    const keys = state.list.filter((a) => a.year === +h.dataset.year).map(keyOf);
    const n = keys.filter((k) => exp.sel.has(k)).length;
    h.classList.toggle('full', n === keys.length);
    h.classList.toggle('part', n > 0 && n < keys.length);
  });
  const picked = state.list.filter((a) => exp.sel.has(keyOf(a)));
  const w = picked.reduce((s, a) => s + a.words, 0), st = picked.reduce((s, a) => s + a.sentences, 0);
  const cnt = $('#selCount');
  if (cnt) cnt.textContent = `已选 ${picked.length} 篇 · 生词 ${w} · 难句 ${st}`;
  document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === exp.mode));
  paintIncs();
  const dl = $('#doExport');
  if (dl) dl.disabled = !picked.length || !incOk();
  exp.save();
}

function onHomeClick(e) {
  if (!exp.on) return;
  const h = e.target.closest('.year h2');
  if (h) {
    const keys = state.list.filter((a) => a.year === +h.dataset.year).map(keyOf);
    const all = keys.every((k) => exp.sel.has(k));
    keys.forEach((k) => (all ? exp.sel.delete(k) : exp.sel.add(k)));
    return paintSel();
  }
  const card = e.target.closest('.card[data-key]');
  if (!card) return;
  e.preventDefault();
  const key = card.dataset.key;
  const order = state.list.map(keyOf);
  if (e.shiftKey && exp.anchor && order.includes(exp.anchor)) {
    const [i, j] = [order.indexOf(exp.anchor), order.indexOf(key)].sort((a, b) => a - b);
    const target = !exp.sel.has(key);
    order.slice(i, j + 1).forEach((k) => (target ? exp.sel.add(k) : exp.sel.delete(k)));
  } else {
    exp.sel.has(key) ? exp.sel.delete(key) : exp.sel.add(key);
  }
  exp.anchor = key;
  paintSel();
}

function onBarClick(e) {
  const b = e.target.closest('button');
  if (!b) return;
  const { q, mode, inc } = b.dataset;
  if (q) {
    state.list.forEach((a) => {
      const k = keyOf(a);
      if (q === 'all') exp.sel.add(k);
      else if (q === 'none') exp.sel.delete(k);
      else if (q === 'invert') exp.sel.has(k) ? exp.sel.delete(k) : exp.sel.add(k);
      else if (q === 'marked') a.words + a.sentences > 0 ? exp.sel.add(k) : exp.sel.delete(k);
    });
  }
  if (mode) exp.mode = mode;
  if (inc) toggleInc(inc);
  paintSel();
}

/* ---------- 导出内容选项（首页导出栏、阅读页下载共用） ---------- */
const INCLUDE_OPTS = [['word', '生词'], ['sentence', '难句'], ['quiz', '做题结果'], ['occ', '历年统计']];
const incButtons = () => INCLUDE_OPTS.map(([k, label]) =>
  `<button type="button" class="chk" data-inc="${k}" title="${k === 'occ' ? '生词表里的「历年出现 / 分布」两列，需要同时导出生词' : ''}">${label}</button>`).join('');
const incOk = () => ['word', 'sentence', 'quiz'].some((k) => exp.include.includes(k));
// 历年统计依附于生词表：没选生词时不传
const incList = () => exp.include.filter((k) => k !== 'occ' || exp.include.includes('word'));
function toggleInc(k) {
  exp.include = exp.include.includes(k) ? exp.include.filter((x) => x !== k) : [...exp.include, k];
  exp.save();
  paintIncs();
}
function paintIncs() {
  document.querySelectorAll('.chk[data-inc]').forEach((b) => {
    b.classList.toggle('on', exp.include.includes(b.dataset.inc));
    b.disabled = b.dataset.inc === 'occ' && !exp.include.includes('word');
  });
  const one = $('#dlGo');
  if (one) one.disabled = !incOk();
}

function doExport() {
  const items = state.list.map(keyOf).filter((k) => exp.sel.has(k));
  if (!items.length) return toast('请至少选择一篇');
  if (!incOk()) return toast('请至少选择生词、难句或做题结果中的一项');
  download(items, exp.mode, incList());
}

/* ================= 阅读页：选生词 / 难句 ================= */

async function showArticle(year, text) {
  document.body.classList.remove('selecting');
  const art = (state.art = await api(`/api/article?year=${year}&text=${text}`));
  document.title = `${year} Text ${text} · 考研阅读`;
  if (!state.list.length) state.list = await api('/api/articles');

  const idx = state.list.findIndex((a) => a.year === year && a.text === text);
  const prev = state.list[idx - 1]; // 列表按 年份→Text 正序排列
  const next = state.list[idx + 1];
  const nav = (a, label) => a
    ? `<a class="btn" href="#/${a.year}/${a.text}">${label}</a>`
    : `<button class="btn" disabled>${label}</button>`;

  app.innerHTML = `
    <header class="topbar">
      <a class="back" href="#/">← 返回</a>
      <h1>${year} · Text ${text}</h1>
      <span class="save-state" id="saveState"></span>
      <span class="seg status-seg" id="statusSeg" title="这篇的进度">
        <button data-st="todo">未做</button><button data-st="doing">进行中</button><button data-st="done">✓ 已完成</button>
      </span>
      ${nav(prev, '‹ 上一篇')}${nav(next, '下一篇 ›')}
      <button class="btn icon theme-btn" data-theme-btn title="配色" aria-label="配色"><i class="palette"></i></button>
      <button class="btn primary" id="dlOne">下载本篇 MD</button>
      <div class="dl-menu" id="dlMenu" hidden>
        <div class="dl-title">下载本篇 MD · 包含内容</div>
        <div class="incs">${incButtons()}</div>
        <button class="btn primary" id="dlGo">下载</button>
      </div>
    </header>
    <div class="reader" id="reader">
      <div class="main-col">
        <div class="hint">用鼠标选中单词或句子，点「生词」或「难句」（快捷键 <kbd>D</kbd> / <kbd>F</kbd>）；点击已标注内容可删除。</div>
        <article id="article"></article>
      </div>
      <aside id="side"></aside>
      <button class="side-tab" id="sideTab" title="展开侧栏" hidden></button>
    </div>`;

  $('#dlOne').onclick = (e) => {
    e.stopPropagation();
    const m = $('#dlMenu');
    m.hidden = !m.hidden;
    if (!m.hidden) paintIncs();
  };
  $('#dlMenu').onclick = (e) => {
    const b = e.target.closest('.chk[data-inc]');
    if (b) return toggleInc(b.dataset.inc);
    if (e.target.closest('#dlGo')) {
      if (!incOk()) return toast('请至少选择生词、难句或做题结果中的一项');
      download([`${year}-${text}`], 'separate', incList());
      $('#dlMenu').hidden = true;
    }
  };
  $('#statusSeg').onclick = (e) => {
    const b = e.target.closest('button');
    if (b) setStatus(b.dataset.st);
  };
  paintStatus();
  const el = $('#article');
  el.addEventListener('mouseup', onMouseUp);
  $('#sideTab').onclick = () => setSideUI({ hidden: false });
  renderArticle();
  renderSide();
  setSideUI({});
}

function sortedMarks() {
  return [...state.art.marks].sort((a, b) => a.p - b.p || a.start - b.start || b.end - a.end);
}

function renderArticle() {
  const { paragraphs, marks } = state.art;
  $('#article').innerHTML = paragraphs.map((text, i) => {
    const ms = marks.filter((m) => m.p === i && !m.stale);
    const cuts = [...new Set([0, text.length, ...ms.flatMap((m) => [m.start, m.end])])].sort((a, b) => a - b);
    let html = '';
    for (let k = 0; k < cuts.length - 1; k++) {
      const a = cuts[k], b = cuts[k + 1];
      const seg = esc(text.slice(a, b));
      const cov = ms.filter((m) => m.start <= a && m.end >= b);
      if (!cov.length) { html += seg; continue; }
      const cls = ['mk'];
      if (cov.some((m) => m.type === 'sentence')) cls.push('s');
      if (cov.some((m) => m.type === 'word')) cls.push('w');
      html += `<span class="${cls.join(' ')}" data-ids="${cov.map((m) => m.id).join(' ')}">${seg}</span>`;
    }
    return `<p data-p="${i}" data-n="${i + 1}">${html}</p>`;
  }).join('');
}

// 侧栏：整体可收起，「生词」「难句」各自可折叠；状态记在浏览器里
const sideUI = Object.assign({ hidden: false, word: false, sentence: false }, store.get('sideUI', {}));

function setSideUI(patch) {
  Object.assign(sideUI, patch);
  store.set('sideUI', sideUI);
  const reader = $('#reader');
  if (!reader) return;
  reader.classList.toggle('side-off', sideUI.hidden);
  $('#sideTab').hidden = !sideUI.hidden;
  document.querySelectorAll('#side .box').forEach((b) => {
    const c = sideUI[b.dataset.type];
    b.classList.toggle('collapsed', c);
    b.querySelector('.box-h').setAttribute('aria-expanded', String(!c));
  });
}

function renderSide() {
  const ms = sortedMarks();
  const words = ms.filter((m) => m.type === 'word');
  const sents = ms.filter((m) => m.type === 'sentence');
  const item = (m, sent) => `
    <li data-id="${m.id}" class="${m.stale ? 'stale' : ''}" title="${m.stale ? '原文已变动，找不到这处标注' : '点击定位'}">
      <span class="t ${sent ? 'sent' : ''}">${esc(m.text)}</span>
      ${sent ? '' : `<button class="occ" data-occ="${esc(m.text)}" title="历年真题中出现的次数，点开看分布">${occBadge(m.text)}</button>`}
      <span class="p">P${m.p + 1}</span>
      <button class="x" data-del="${m.id}" title="删除">✕</button>
      ${sent ? '' : `<div class="occ-detail" hidden></div>`}
    </li>`;
  const box = (type, title, sw, list, sent) => `
    <section class="box${sideUI[type] ? ' collapsed' : ''}" data-type="${type}">
      <button class="box-h" data-toggle="${type}" aria-expanded="${!sideUI[type]}" title="折叠 / 展开">
        <i class="${sw}"></i>${title}<span class="n">${list.length}</span><span class="chev"></span>
      </button>
      <div class="box-b"><div>
        ${list.length ? `<ul>${list.map((m) => item(m, sent)).join('')}</ul>` : '<div class="none">暂无，选中文字后按 ' + (type === 'word' ? 'D' : 'F') + '</div>'}
      </div></div>
    </section>`;
  const side = $('#side');
  side.innerHTML = `
    <div class="side-head">
      <span>本篇标注</span>
      <button class="side-hide" data-hide title="收起侧栏">收起 <b>›</b></button>
    </div>` +
    box('word', '生词', 'sw-w', words, false) +
    box('sentence', '难句', 'sw-s', sents, true);
  loadOcc();
  $('#sideTab').innerHTML = `<b>‹</b><span><i class="sw-w"></i>${words.length}</span><span><i class="sw-s"></i>${sents.length}</span>`;
  side.onclick = (e) => {
    const ob = e.target.closest('[data-occ]');
    if (ob) return toggleOcc(ob);
    if (e.target.closest('.occ-detail')) return;
    if (e.target.closest('[data-hide]')) return setSideUI({ hidden: true });
    const tg = e.target.closest('[data-toggle]');
    if (tg) return setSideUI({ [tg.dataset.toggle]: !sideUI[tg.dataset.toggle] });
    const del = e.target.dataset.del;
    if (del) return removeMark(del);
    const li = e.target.closest('li');
    if (li) locate(li.dataset.id);
  };
}

/* ---------- 历年出现次数 ---------- */

const occCache = {};
const occKey = (t) => t.toLowerCase().trim();

function occBadge(text) {
  const o = occCache[occKey(text)];
  if (!o) return '<i class="occ-wait"></i>';
  return `历年 ${o.total}`;
}

async function loadOcc() {
  const terms = [...new Set(state.art.marks.filter((m) => m.type === 'word').map((m) => m.text))]
    .filter((t) => !(occKey(t) in occCache));
  if (terms.length) {
    try {
      const res = await api('/api/occurrences', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ terms }),
      });
      for (const [t, info] of Object.entries(res)) occCache[occKey(t)] = info;
    } catch (e) {
      return;
    }
  }
  document.querySelectorAll('#side [data-occ]').forEach((b) => {
    const o = occCache[occKey(b.dataset.occ)];
    if (!o) return;
    b.innerHTML = occBadge(b.dataset.occ);
    b.classList.toggle('zero', o.total <= 1);
  });
}

function toggleOcc(btn) {
  const li = btn.closest('li');
  const box = li.querySelector('.occ-detail');
  const o = occCache[occKey(btn.dataset.occ)];
  if (!o) return;
  if (!box.hidden) { box.hidden = true; btn.classList.remove('open'); return; }
  const { year, text } = state.art;
  const here = `阅读 Text ${text}`;
  const years = {};
  o.by.forEach((d) => (years[d.year] = years[d.year] || []).push(d));
  const forms = Object.entries(o.forms);
  box.innerHTML = `
    <div class="occ-sum"><b>${o.total}</b> 次 · ${o.years} 年${o.exact !== o.total ? `<span>本词形 ${o.exact} 次</span>` : ''}</div>
    <div class="occ-years">${Object.entries(years).map(([y, ds]) => `
      <div class="occ-y"><em>${y}</em><span>${ds.map((d) =>
        `<i class="${+y === year && d.label === here ? 'here' : ''}">${d.label}${d.n > 1 ? ` ×${d.n}` : ''}</i>`).join('')}</span></div>`).join('')}
    </div>
    ${forms.length > 1 ? `<div class="occ-forms">词形：${forms.map(([f, n]) => `${esc(f)} ${n}`).join(' · ')}</div>` : ''}`;
  box.hidden = false;
  btn.classList.add('open');
}

function locate(id) {
  const spans = document.querySelectorAll(`#article [data-ids~="${id}"]`);
  if (!spans.length) return;
  spans[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  spans.forEach((s) => { s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); });
}

/* ---------- 选区 ---------- */

function paraOf(node) {
  const el = node.nodeType === 1 ? node : node.parentElement;
  return el && el.closest('#article p[data-p]');
}

function offsetIn(p, node, off) {
  const r = document.createRange();
  r.selectNodeContents(p);
  r.setEnd(node, off);
  return r.toString().length;
}

function onMouseUp(e) {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) {
      const span = e.target.closest('.mk');
      return span ? showMarkPop(span) : hidePop();
    }
    const range = sel.getRangeAt(0);
    const p1 = paraOf(range.startContainer), p2 = paraOf(range.endContainer);
    if (!p1 || !p2) return hidePop();
    if (p1 !== p2) { hidePop(); return toast('请在同一段内选择'); }
    const start = offsetIn(p1, range.startContainer, range.startOffset);
    const end = offsetIn(p1, range.endContainer, range.endOffset);
    if (!state.art.paragraphs[+p1.dataset.p].slice(start, end).trim()) return hidePop();
    state.pending = { p: +p1.dataset.p, start, end };
    const rect = range.getBoundingClientRect();
    pop.innerHTML = `
      <button data-act="word"><i class="sw-w"></i>生词 <kbd>D</kbd></button>
      <button data-act="sentence"><i class="sw-s"></i>难句 <kbd>F</kbd></button>`;
    placePop(rect);
  }, 0);
}

function showMarkPop(span) {
  const ids = span.dataset.ids.split(' ');
  const ms = state.art.marks.filter((m) => ids.includes(m.id));
  pop.innerHTML = ms.map((m) =>
    `<button class="del" data-del="${m.id}">✕ 删除${m.type === 'word' ? '生词' : '难句'}「${esc(m.text.length > 24 ? m.text.slice(0, 24) + '…' : m.text)}」</button>`
  ).join('');
  state.pending = null;
  placePop(span.getBoundingClientRect());
}

function placePop(rect) {
  pop.hidden = false;
  const w = pop.offsetWidth;
  const left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), window.innerWidth - w - 8);
  let top = rect.top - pop.offsetHeight - 8;
  if (top < 60) top = rect.bottom + 8;
  pop.style.left = left + window.scrollX + 'px';
  pop.style.top = top + window.scrollY + 'px';
}

function hidePop() {
  pop.hidden = true;
  state.pending = null;
}

pop.addEventListener('mousedown', (e) => e.preventDefault()); // 保持选区
pop.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.del) removeMark(btn.dataset.del);
  else if (btn.dataset.act) addMark(btn.dataset.act);
  hidePop();
});

document.addEventListener('mousedown', (e) => {
  if (!pop.hidden && !pop.contains(e.target)) hidePop();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return hidePop();
  if (!state.pending || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd' || k === 'f') {
    e.preventDefault();
    addMark(k === 'd' ? 'word' : 'sentence');
    hidePop();
  }
});

/* ---------- 增删标注 ---------- */

function addMark(type) {
  if (!state.pending) return;
  let { p, start, end } = state.pending;
  const t = state.art.paragraphs[p];

  if (type === 'word') {
    // 去掉两端标点空白，再扩展到完整单词
    while (start < end && !ALNUM.test(t[start])) start++;
    while (end > start && !ALNUM.test(t[end - 1])) end--;
    while (start > 0 && WORD_CH.test(t[start - 1])) start--;
    while (end < t.length && WORD_CH.test(t[end])) end++;
  } else {
    while (start < end && /\s/.test(t[start])) start++;
    while (end > start && /\s/.test(t[end - 1])) end--;
  }
  if (start >= end) return;

  const dup = state.art.marks.find((m) => m.type === type && m.p === p && !m.stale && m.start < end && m.end > start);
  if (dup) return toast(`与已标${type === 'word' ? '生词' : '难句'}「${dup.text.slice(0, 20)}」重叠`);

  state.art.marks.push({ id: uid(), type, p, start, end, text: t.slice(start, end) });
  if (state.art.status === 'todo') setStatus('doing');
  window.getSelection().removeAllRanges();
  refresh();
}

function removeMark(id) {
  state.art.marks = state.art.marks.filter((m) => m.id !== id);
  refresh();
}

function paintStatus() {
  document.querySelectorAll('#statusSeg button').forEach((b) => {
    b.classList.toggle('on', b.dataset.st === state.art.status);
  });
}

async function setStatus(st) {
  const { year, text } = state.art;
  const prev = state.art.status;
  state.art.status = st;
  paintStatus();
  try {
    await api(`/api/status?year=${year}&text=${text}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: st }),
    });
    const a = state.list.find((x) => x.year === year && x.text === text);
    if (a) a.status = st;
    if (st === 'done' && prev !== 'done') toast(`${year} Text ${text} 已完成`);
  } catch (e) {
    state.art.status = prev;
    paintStatus();
    toast('状态保存失败：' + e.message);
  }
}

function refresh() {
  renderArticle();
  renderSide();
  save();
}

// 保存排队：同一时间只发一个请求，期间的改动在上一个完成后再保存一次
let saving = null, saveAgain = false;
function save() {
  if (saving) { saveAgain = true; return saving; }
  saving = (async () => {
    do {
      saveAgain = false;
      await saveOnce();
    } while (saveAgain);
    saving = null;
  })();
  return saving;
}

async function saveOnce() {
  const { year, text } = state.art;
  const marks = state.art.marks.map(({ stale, ...m }) => m);
  const s = $('#saveState');
  if (s) s.textContent = '保存中…';
  try {
    await api(`/api/marks?year=${year}&text=${text}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ marks }),
    });
    if (s) s.textContent = '已保存';
    const a = state.list.find((x) => x.year === year && x.text === text);
    if (a) {
      a.words = marks.filter((m) => m.type === 'word').length;
      a.sentences = marks.length - a.words;
    }
  } catch (e) {
    if (s) s.textContent = '保存失败';
    toast('保存失败：' + e.message);
  }
}

/* ================= 配色面板 ================= */

const THEME_DEFAULT = { h: 232, sat: 100, glow: 100, mode: 'system' };
const PRESETS = [
  ['靛蓝', 232, 100], ['雾蓝', 212, 80], ['天青', 198, 100], ['青碧', 178, 85],
  ['薄荷', 158, 75], ['松绿', 140, 60], ['橄榄', 82, 45], ['琥珀', 38, 90],
  ['蜜桃', 18, 90], ['珊瑚', 2, 80], ['玫瑰', 340, 70], ['樱粉', 320, 60],
  ['紫罗兰', 268, 80], ['薰衣草', 252, 70], ['石墨', 225, 12], ['暖灰', 30, 14],
];
const theme = Object.assign({}, THEME_DEFAULT, store.get('theme', {}));
const tp = $('#themePanel');

function applyTheme(save = true) {
  const r = document.documentElement;
  r.style.setProperty('--h', theme.h);
  r.style.setProperty('--sat', theme.sat / 100);
  r.style.setProperty('--glow', theme.glow / 100);
  if (theme.mode === 'system') delete r.dataset.theme;
  else r.dataset.theme = theme.mode;
  if (save) store.set('theme', theme);
  paintThemePanel();
}

function paintThemePanel() {
  $('#tpHue').value = theme.h;
  $('#tpSat').value = theme.sat;
  $('#tpGlow').value = theme.glow;
  $('#hueVal').textContent = `${theme.h}°`;
  $('#satVal').textContent = `${theme.sat}%`;
  $('#glowVal').textContent = `${theme.glow}%`;
  document.querySelectorAll('#swatches button').forEach((b) =>
    b.classList.toggle('on', +b.dataset.h === theme.h && +b.dataset.sat === theme.sat));
  document.querySelectorAll('#themeMode button').forEach((b) => b.classList.toggle('on', b.dataset.mode === theme.mode));
}

$('#swatches').innerHTML = PRESETS.map(([name, h, sat]) =>
  `<button data-h="${h}" data-sat="${sat}" title="${name}" style="--sh:${h};--ss:${sat / 100}"><i></i><span>${name}</span></button>`
).join('');

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-theme-btn]');
  if (btn) {
    tp.hidden = !tp.hidden;
    if (!tp.hidden) paintThemePanel();
    return;
  }
  if (!tp.hidden && !tp.contains(e.target)) tp.hidden = true;
});

tp.addEventListener('click', (e) => {
  if (e.target.closest('[data-tp-close]')) { tp.hidden = true; return; }
  if (e.target.closest('[data-tp-reset]')) { Object.assign(theme, THEME_DEFAULT); return applyTheme(); }
  const sw = e.target.closest('#swatches button');
  if (sw) { theme.h = +sw.dataset.h; theme.sat = +sw.dataset.sat; return applyTheme(); }
  const md = e.target.closest('#themeMode button');
  if (md) { theme.mode = md.dataset.mode; applyTheme(); }
});

for (const [id, key] of [['#tpHue', 'h'], ['#tpSat', 'sat'], ['#tpGlow', 'glow']]) {
  $(id).addEventListener('input', (e) => { theme[key] = +e.target.value; applyTheme(); });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') tp.hidden = true; });
window.addEventListener('hashchange', () => { tp.hidden = true; });

applyTheme(false);

document.addEventListener('mousedown', (e) => {
  const m = $('#dlMenu');
  if (m && !m.hidden && !m.contains(e.target) && !e.target.closest('#dlOne')) m.hidden = true;
});

</script>
</body>
