 of public attention. [B] subject to undesirable changes. [CJ harmful to the culture of research. [D] acceptable despite the criticism.\n\n36. According to Paragraph 1, what is the author's attitude toward the AAAS's report? [A] Critical. [BJ Appreciative. [CJ Contemptuous. [DJ Tolerant.\n\n3 7. Inf l uential figures in the Congress required that the AAAS report on how to [AJ define the government's role in education. [BJ safeguard individuals' rights to education. [CJ retain people's interest in liberal education. [DJ keep a leading position in liberal education.\n\n3 8. According to Paragraph 3, the report suggests [A] an exclusive study of American history. [BJ a greater emphasis on theoretical subjects. [CJ the application of emerging technologies. [D] funding for the study of foreign languages.\n\n39. The author implies in Paragraph 5 that professors are [ A J supportive of free markets. [BJ conservative about public policy. [CJ biased against classical liberal ideas. [DJ cautious about intellectual investigation.\n\n40. Which of the following would be the best title for the text? [ A J Ways to Grasp \"The Heart of the Matter\" [BJ Illiberal Education and \"The Heart of the Matter\" [CJ The AAAS 's Contribution to Liberal Education [DJ Progressive Policy vs. Liberal Education\n"},{"year":2014,"sec":"writing","label":"写作","text":"Write a letter of about 100 words to the president of your university, suggesting how to improve students' physical condition.\n\nYou should include the details you think necessary.\n\nmartB\n\n3) give your comments.\n"},{"year":2015,"sec":"cloze","label":"完形","text":"Though not biologically related, friends are as \"related\" as fourth cousins, sharing about 1 % of genes. That is 1 a study, published from the University of California and Yale University in the Proceedings of the National Academy of Sciences, has 2 .\n\nThe study is a genome-wide analysis conducted 3 1,932 unique subjects which 4 pairs of unrelated friends and unrelated strangers. The same people were used in both 5\n\nWhile 1 % may seem 6 , it is not so to a geneticist. As James Fowler, professor of medical genetics at UC San Diego, says, \"Most people do not even 7 their fourth cousins but somehow manage to select as friends the people who 8 our kin.\"\n\nThe study 9 found that the genes for smell were something shared in friends but not genes for immunity. Why this similarity exists in smell genes is difficult to explain, for now. 10 , as the team suggests, it draws us to similar environments but there is more 11 it. There could be many mechanisms working together that 12 us in choosing genetically similar friends 13 \"functional kinship\" of being friends with 14\n\nOne of the remarkable findings of the study was that the similar genes seem to be evolving 15 than other genes. Studying this could help 16 why human evolution picked pace in the last 30,000 years, with social environment being a major 17 factor.\n\nThe findings do not simply explain people's 18 to befriend those of similar 19 backgrounds, say the researchers. Though all the subjects were drawn from a population of European extraction, care was taken to 20 that all subjects, friends and strangers, were taken from the same population.\n\n1. [A] when [B] why [C] how [D] what\n\n2. [A] defended [B] concluded [C] withdrawn [DJ advised\n\n3. [A] for [B] with [C] on [D] by\n\n4. [A] compared [B] sought [C] separated [D] connected\n\n5. [AJ tests [BJ objects [CJ samples [DJ examples\n\n6. [A] insignificant [BJ unexpected [C] unreliable [DJ incredible\n\n7. [A] visit [B] miss [C] seek [D] know\n\n8. [A] resemble [BJ influence [C] favor [DJ surpass\n\n9. [AJ again [BJ also [CJ instead [D] thus\n\n10. [A] Meanwhile [BJ Furthermore [C] Likewise [DJ Perhaps\n\n11. [AJ about [BJ to [CJ from [DJ like\n\n12. [A] d r ive [B] observe [C] confuse [D] limit\n\n13. [A] according to [BJ rather than [CJ regardless of [DJ along with\n\n14. [A] chances [B] responses [C] missions [D] benefits\n\n15. [AJ later [BJ slower [C] faster [D] earlier\n\n16. [ A J forecast [B] remember [CJ understand [D] express\n\n17. [A] unpredictable [BJ contributory [C] controllable [D] disruptive\n\n18. [A] endeavor [BJ decision [ CJ arrangement [D] tendency\n\n19. [A] political [B] religious [C] ethnic [D] economic\n\n20. [A] see [B] show [C] prove [D] tell\n"},{"year":2015,"sec":"partb","label":"新题型","text":"martB\n\nIn the following text, some sentences have been removed. For Questions 41-45, choose the most suitable one from the list A-G to fit into each of the numbered blanks. There are two extra choices, which do not fit in any of the blanks. Mark your answers on the ANSWER SHEET. (10 points)\n\nHow does your reading proceed? Clearly you try to comprehend, in the sense of identifying meanings for individual words and working out relationships between them, drawing on your implicit knowledge of English grammar. ( 4 1 ) You begin to infer a context for the text, for instance by making decisions about what kind of speech event is involved: Who is making the utterance, to whom, when and where.\n\nThe ways of reading indicated here are without doubt kinds of comprehension. But they show comprehension to consist not just of passive assimilation but of active engagement in inference and problem-solving. You infer information you feel the writer has invited you to grasp by presenting you with specific evidence and clues. (42)\n\nConceived in this way, comprehension will not follow exactly the same track for each reader. What is in question is not the retrieval of an absolute, fixed or \"true\" meaning that can be read of and checked for accuracy, or some timeless relation of the text to the world. (43)\n\nSuch background material inevitably reflects who we are. (44)\n\nThis doesn't, however, make interpretation merely relative or even pointless. Precisely because readers from different historical periods, places and social experiences produce different but overlapping readings of the same words on the page - including for texts that engage with fundamental human concerns - debates about texts can play an important role in social discussion of beliefs and values.\n\nHow we read a given text also depends to some extent on our particular interest in reading it. ( 45) Such dimensions of reading suggest - as others introduced later in the book will also do - that we bring an implicit (often unacknowledged) agenda to any act of reading. It doesn't then necessarily follow that one kind of reading is fuller, more advanced or more worthwhile than another. Ideally, different kinds of reading inform each other, and act as useful reference points for and counterbalances to one another. Together, they make up the reading component of your overall literacy, or relationship to your surrounding textual environment.\n\n[A] Are we studying that text and trying to respond in a way that fulfills the requirement of a given course? Reading it simply for pleasure? Skimming it for information? Ways of reading on a train or in bed are likely to differ considerably from reading in a seminar room.\n\n[B] Factors such as the place and period in which we are reading, our gender, ethnicity, age and social class will encourage us towards certain interpretations but at the same time obscure or even close of others.\n\n[C] If you are unfamiliar with words or idioms, you guess at their meaning, using clues presented in the context. On the assumption that they will become relevant later, you make a mental note of discourse entities as well as possible links between them.\n\n[D] In effect, you try to reconstruct the likely meanings or effects that any given sentence, image or reference might have had: These might be the ones the author intended.\n\n[E] You make further inferences, for instance, about how the text may be significant to you, or about its validity - inferences that form the basis of a personal response for which the author will inevitably be far less responsible.\n\n[F] In plays, novels and narrative poems, characters speak as constructs created by the author, not necessarily as mouthpieces for the author's own thoughts.\n\n[G] Rather, we ascribe meanings to texts on the basis of interaction between what we might call textual and contextual material: between kinds of organization or patterning we perceive in a text's formal structures (so especially its language structures) and various kinds of background, social knowledge, belief and attitude that we bring to the text.\n"},{"year":2015,"sec":"partc","label":"翻译","text":"mart`\n\nWithin the span of a hundred years, in the seventeenth and early eighteenth centuries, a tide of emigration - one of the great folk wanderings of history - swept from Europe to America. ( 46) This movement, driven by powerful and diverse motivations, built a nation out of a wilderness and, by its nature, shaped the character and destiny of an uncharted continent.\n\n( 4 7) The United States is the product of two principal forces - the immigration of European peoples with their varied ideas, customs, and national characteristics and the impact of a new country which modified these traits. Of necessity, colonial America was a projection of Europe. Across the Atlantic came successive groups of Englishmen, Frenchmen, Germans, Scots, Irishmen, Dutchmen, Swedes, and many others who attempted to transplant their habits and traditions to the new world. ( 48) But the force of geographic conditions peculiar to America, the interplay of the varied national groups upon one another, and the sheer difficulty of maintaining old-world ways in a raw, new continent caused significant changes. These changes were gradual and at first scarcely visible. But the result was a new social pattern which, although it resembled European society in many ways, had a character that was distinctly American.\n\n( 49) The first shiploads of immigrants bound for the territory which is now the United States crossed the Atlantic more than a hundred years after the 15th-and-16th-century explorations of North America. In the meantime, thriving Spanish colonies had been established in Mexico, the West Indies, and South America. These travelers to North America came in small, unmercifully overcrowded craft. During their six- to twelve-week voyage, they survived on barely enough food allotted to them. Many of the ships were lost in storms, many passengers died of disease, and inf a nts rarely survived the journey. Sometimes storms blew the vessels far of their course, and often calm brought unbearably long delay.\n\nTo the anxious travelers the sight of the American shore brought almost inexpressible relief. Said one recorder of events, \"The air at twelve leagues' distance smelt as sweet as a new-blown garden.\" The colonists' first glimpse of the new land was a sight of dense woods. (50) The virgin forest with its richness and variety of trees was a real treasure-house which extended from Maine all the way down to Georgia. Here was abundant fuel and lumber. Here was the raw material of houses and furniture, ships and potash, dyes and naval stores.\n"},{"year":2015,"sec":"questions","label":"阅读题目","text":"21. According to the first two paragraphs, King Juan Carl of Spain [A] eased his relationship with his rivals. [B] used to enjoy high public support. [CJ was unpopular among European royals. [DJ ended his reign in embarrassment.\n\n22. Monarchs are kept as heads of state in Europe mostly [ A J to give voters more public figures to look up to. [BJ to achieve a balance between tradition and reality. [CJ owing to their undoubted and respectable status. [D] due to their everlasting political embodiment.\n\n23. Which of the following is shown to be odd, according to Paragraph 4? [ A J Aristocrats' excessive reliance on inherited wealth. [BJ The role of the nobility in modem democracies. [CJ The simple lifestyle of the aristocratic families. [D] The nobility's adherence to their privileges.\n\n24. The British royals \"have most to fear\" because Charles [A] fails to adapt himself to his future role. [BJ fails to change his lifestyle as advised. [CJ takes republicans as his potential allies. [D] takes a tough line on political issues.\n\n25. Which of the following is the best title of the text? [A] Carlos, Glory and Disgrace Combined [BJ Charles, Anxious to Succeed to the Throne [C] Carlos, a Lesson for All European Monarchs [DJ Charles, Slow to React to the Coming Threats\n\n26. The Supreme Court will work out whether, during an arrest, it is legitimate to [A] prevent suspects from deleting their phone contents. [B] search for suspects' mobile phones without a warrant. [CJ check suspects' phone contents without being authorized. [DJ prohibit suspects from using their mobile phones.\n\n27. The author's attitude toward California's argument is one of [A] disapproval. [BJ indifference. [C] tolerance. [D] cautiousness.\n\n28. The author believes that exploring one's phone contents is comparable to [A] going through one's wallet. [B] handling one's historical records. [C] scanning one's correspondences. [DJ getting into one's residence.\n\n29. In Paragraphs 5 and 6, the author shows his concern that [A] principles are hard to be clearly expressed. [BJ the court is giving police less room for action. [CJ phones are used to store sensitive information. [D] citizens' privacy is not effectively protected.\n\n30. Orin Kerr's comparison is quoted to indicate that [A] the Constitution should be implemented flexibly. [BJ principles of the Constitution should never be altered. [CJ California's argument violates principles of the Constitution. [DJ new technology requires reinterpretation of the Constitution.\n\n31. It can be learned from Paragraph 1 that [A] Science intends to simplify its peer-review process. [B] journals are strengthening their statistical checks. [C] few journals are blamed for mistakes in data analysis. [D] lack of data analysis is common in research projects.\n\n32. The phrase \"flagged up\" (Para. 2) is the closest in meaning to [A] found. [B] revised. [CJ marked. [D] stored.\n\n33. Giovanni Parmigiani believes that the establishment of the SBoRE may [A] pose a threat to all its peers. [BJ meet with strong opposition. [CJ increase Science's circulation. [D] set an example for other journals.\n\n34. David Vaux holds that what Science is doing now [ A J adds to researchers' workload. [BJ diminishes the role of reviewers. [CJ has room for further improvement. [DJ is to fail in the foreseeable future.\n\n35. Which of the following is the best title of the text? [ A J Science Joins Push to Screen Statistics in Papers [BJ Professional Statisticians Deserve More Respect [CJ Data Analysis Finds Its Way onto Editors' Desks [DJ Statisticians Are Coming Back with Science\n\n36. According to the first two paragraphs, Elisabeth was upset by [A] the consequences of the current sorting mechanism. [BJ companies' financial loss due to immoral practices. [CJ governmental ineffectiveness on moral issues. [DJ the wide misuse of integrity among institutions.\n\n3 7. It can be inferred from Paragraph 3 that [ A J Glenn Mulcaire may deny phone hacking as a crime. [BJ more journalists may be found guilty of phone hacking. [CJ Andy Coulson should be helld innocent of the charge. [DJ phone hacking will be accepted on certain occasions.\n\n38. The author believes that Rebekah Brooks's defence [A] was hardly convincing. [BJ centered on trivial issues. [CJ revealed a cunning personality. [D] was part of a conspiracy.\n\n39. The author holds that the current collective doctrine shows [ A J a marginalized lifestyle. [BJ unfair wealth distribution. [CJ generally distorted values. [DJ a rigid moral code.\n\n40. Which of the following is suggested in the last paragraph? [ A J The quality of writings is of primary importance. [BJ Moral awareness matters in editing a newspaper. [CJ Common humanity is central to news reporting. [DJ Journalists need stricter industrial regulations.\n"},{"year":2015,"sec":"writing","label":"写作","text":"mart^\n\nYou are going to host a club reading session. Write an email of about 100 words recommending a book to the club members.\n\nYou should state reasons for your recommendation.\n\nmartB\n"},{"year":2016,"sec":"cloze","label":"完形","text":"In Cambodia\u000f the choice of a spouse is a complex one for the young male. It may involve not only his parents and his friends\u000f 1 those of the young woman\u000f but also a matchmaker. A young man can 2 a likely spouse on his own and then ask his parents to 3 the marriage negotiations\u000f or the young man's parents may make the choice of a spouse\u000f giving the child little to say in the selection. 4 \u000f a girl may veto the spouse her parents have chosen. 5 a spouse has been selected\u000f each family investigates the other to make sure its child is marrying 6 a good family.\n\nThe traditional wedding is a long and colorful affair. Formerly it lasted three days\u000f \u001a by the 1 \u001bMs it more commonly lasted a day and a half. Buddhist priests offer a short sermon and \u001b prayers of blessing. Parts of the ceremony involve ritual hair cutting\u000f cotton threads soaked in holy water around the bride's and groom's wrists\u000f and 10 a candle around a circle of happily married and respected couples to bless the 11 . Newlyweds traditionally move in with the wife's parents and may 12 with them up to a year\u000f 13 they can build a new house nearby.\n\nDivorce is legal and easy to 14 \u000f but not common. Divorced persons are 15 with some disapproval. Each spouse retains 16 property he or she 1\u001a into the marriage\u000f and jointly\u0010acquired property is 1\u001b equally. Divorced persons may remarry\u000f but a gender prejudice 1 up The divorced male doesn't have a waiting period before he can remarry 20 the woman must wait ten months.\n\n1. [A] as well as [B] by way of [C] on behalf of [D] with regard to\n\n2. [A] adapt to [B] provide for [C] compete with [D] decide on\n\n3. [A] renew [B] close [C] arrange [D] postpone\n\n4. [A] In theory [B] In time [C] Above all [D] For example\n\n5. [A] Although [B] Lest [C] After [D] Unless\n\n6. [A] within [B] into [C] from [D] through\n\n\u001a. [A] since [B] or [C] so [D] but\n\n\u001b. [A] test [B] recite [C] copy [D] create\n\n. [A] folding [B] piling [C] wrapping [D] tying\n\n10. [A] passing [B] lighting [C] hiding [D] serving\n\n11. [A] association [B] meeting [C] collection [D] union\n\n12. [A] grow [B] part [C] live [D] deal\n\n13. [A] whereas [B] until [C] for [D] if\n\n14. [A] follow [B] obtain [C] challenge [D] avoid\n\n15. [A] isolated [B] persuaded [C] viewed [D] exposed\n\n16. [A] whatever [B] however [C] whenever [D] wherever\n\n1\u001a. [A] changed [B] brought [C] shaped [D] pushed\n\n1\u001b. [A] withdrawn [B] invested [C] donated [D] divided\n\n1 . [A] clears [B] shows [C] warms [D] breaks\n\n20. [A] while [B] once [C] so that [D] in that\n"},{"year":2016,"sec":"partb","label":"新题型","text":"[A] Create a new image of yourself\n\n[B] Have confidence in yourself\n\n[C] Decide if the time is right\n\n[D] Understand the context\n\n[E] Work with professionals\n\n[F] .now your goals\n\n[G] Make it efficient\n\nNo matter how formal or informal the work environment\u000f the way you present yourself has an impact. This is especially true in first impressions. According to research from Princeton University\u000f people assess your competence\u000f trustworthiness\u000f and likeability in just a tenth of a second\u000f solely based on the way you look.\n\nThe difference between today's workplace and the \"dress for success\" era is that the range of options is so much broader. Norms have evolved and fragmented. In some settings\u000f red sneakers or dress 7\u0010shirts can convey status in others not so much. Plus\u000f whatever image we present is magnified by social\u0010media services like Linkedln. Chances are\u000f your headshots are seen much more often now than a decade or two ago. Millennials\u000f it seems\u000f face the paradox of being the least formal generation yet the most conscious of style and personal branding. It can be confusing.\n\nSo how do we navigate this? How do we know when to invest in an upgrade? And what's the best way to pull off one that enhances our goals? Here are some tips\n\nAs an executive coach\u000f I've seen image upgrades be particularly helpfu during transitions ± when looking for a new job\u000f stepping into a new or more public role\u000f or changing work environments. If you're in a period of change or just feeling stuck and in a rut\u000f now may be a good time. If you're not sure\u000f ask for honest feedback from trusted friends\u000f colleagues and professionals. Look for cues\n\nabout how others perceive you. Maybe there's no need for an upgrade and that's 2..\n\nGet clear on what impact you're hoping to have. Are you looking to refresh your image or pivot it? For one person\u000f the goal may be to be taken more seriously and enhance their professional image. For another\u000f it may be to be perceived as more approachable\u000f or more modern and stylish. For someone moving from finance to advertising\u000f maybe they want to look more \"SoHo.\" It's 2. to use characterizations like that.\n\nLook at your work environment like an anthropologist. What are the norms of your environment? What conveys status? Who are your most important audiences? How do the people you respect and look up to present themselves? The better you understand the cultural context\u000f the more control you can have over your impact.\n\nEnlist the support of professionals and share with them your goals and context. Hire a personal stylist\u000f or use the free styling service of a store like J.Crew. Try a hair stylist instead of a barber. Work with a professiona photographer instead of your spouse or friend. It's not as expensive as you might think.\n\nThe point of a style upgrade isn't to become more vain or to spend more time fussing over what to wear. Instead\u000f use it as an opportunity to reduce decision fatigue. Pick a standard work uniform or a few go\u0010to options. Buy all your clothes at once with a stylist instead of shopping alone\u000f one article of clothing at a time.\n"},{"year":2016,"sec":"partc","label":"翻译","text":"Mental health is our birthright. 46 We don't have to learn how to be mentally healthy it is built into us in the same way that our bodies know how to heal a cut or mend a broken bone. Mental health can't be learned\u000f only reawakened. It is like the immune system of the body\u000f which under stress or through lack of nutrition or exercise can be weakened\u000f but which never leaves us. When we don't understand the value of mental health and we don't know how to gain access to it\u000f mental health will remain hidden from us. 4\u001a Our mental health doesn't really go anywhere like the sun behind a cloud\u000f it can be temporarily hidden from view\u000f but it is fully capable of being restored in an instant.\n\nMental health is the seed that contains self\u0010esteem ± confidence in ourselves and an ability to trust in our common sense. It allows us to have perspective on our lives ± the ability to not take ourselves too seriously\u000f to laugh at ourselves\u000f to see the bigger picture\u000f and to see that things will work out. It's a form of innate or unlearned optimism. 4\u001b Mental health allows us to view others with sympathy if they are having troubles\u000f with kindness if they are in pain\u000f and with unconditiona love no matter who they are. Mental health is the source of creativity for solving problems\u000f resolving conflict\u000f making our surroundings more beautiful\u000f managing our home life\u000f or coming up with a creative business idea or invention to make our lives easier. It gives us patience for ourselves and toward others as well as patience while driving\u000f catching a fish\u000f working on our car\u000f or raising a child. It allows us to see the beauty that surrounds us each moment in nature\u000f in culture\u000f in the flow of our daily lives.\n\n4 Although mental health is the cure\u0010all for living our lives\u000f it is perfectly ordinary as you will see that it has been there to direct you through all your difficult decisions. It has been available even in the most mundane of life situations to show you right from wrong\u000f good from bad\u000f friend from foe. Mental health has commonly been called conscience\u000f instinct\u000f wisdom\u000f common sense\u000f or the inner voice. We think of it simply as a healthy and helpful flow of intelligent thought. 50 As you will come to see\u000f knowing that mental health is always available and knowing to trust it allow us to slow down to the moment and live life happily.\n"},{"year":2016,"sec":"questions","label":"阅读题目","text":"21. According to the first paragraph\u000f what would happen in France? [A] Physical beauty would be redefined. [B] New runways would be constructed. [C] Websites about dieting would thrive. [D] The fashion industry would decline.\n\n22. The phrase \"impinging on\" Line 2\u000f Para. 2 is closest in meaning to [A] indicating the state of. [B] heightening the value of. [C] losing faith in. [D] doing harm to.\n\n23. Which of the following is true of the fashion industry? [A] The French measures have already failed. [B] Its inherent problems are getting worse. [C] Models are no longer under peer pressure. [D] New standards are being set in Denmark.\n\n24. A designer is most likely to be rejected by CFW for [A] pursuing perfect physical conditions. [B] caring too much about models' character. [C] showing little concern for health factors. [D] setting a high age threshold for models.\n\n25. Which of the following may be the best title of the text? [A] The Great Threats to the Fashion Industry [B] Just Another Round of Struggle for Beauty [C] A Dilemma for the Starving Models in France [D] A Challenge to the Fashion Industry's Body Ideals\n\n26. Britain's public sentiment about the countryside [A] is not well reflected in politics. [B] is fully backed by the royal family. [C] didn't start till the Shakespearean age. [D] has brought much benefit to the NHS.\n\n30. In the last paragraph\u000f the author shows his appreciation of [A] the size of population in Britain. [B] the enviable urban lifestyle in Britain. [C] the town\u0010and\u0010country planning in Britain. [D] the political life in today's Britain.\n\n31. The author views Milton Friedman's statement about CSR with [A] tolerance. [B] skepticism. [C] approval. [D] uncertainty.\n\n32. According to Paragraph 2\u000f CSR helps a company by [A] guarding it against malpractices. [B] protecting it from being defamed. [C] winning trust from consumers. [D] raising the quality of its products.\n\n33. The expression \"more lenient\" Para.4 is closest in meaning to [A] less controversial. [B] more effective. [C] more lasting. [D] less severe.\n\n34. When prosecutors evaluate a case\u000f a company's CSR record [A] has an impact on their decision. [B] comes across as reliable evidence. [C] increases the chance of being penalized. [D] constitutes part of the investigation.\n\n35. Which of the following is true of CSR\u000f according to the last paragraph? [A] Its negative effects on businesses are often overlooked. [B] The necessary amount of companies' spending on it is unknown. [C] Companies' financial capacity for it has been overestimated. [D] It has brought much benefit to the banking industry.\n\n36. qhe kew vork qimes is considering ending its print edition partly due to [A] the high cost of operation. [B] the increasing on line ad sales. [C] the pressure from its investors. [D] the complaints from its readers.\n\n40. Which of the following would be the best title of the text? [A] Shift to Online Newspapers All at Once [B] Make Your Print Newspaper a Luxury Good [C] .eep Your Newspapers Forever in Fashion [D] Cherish the Newspaper Still in Your Hand\n"},{"year":2016,"sec":"writing","label":"写作","text":"Suppose you are a librarian in your university. Write a notice of about 100 words\u000f providing the newly\u0010enrolled international students with relevant information about the library.\n\nao not sign your own name at the end of the notice. Use \"Li Ming\" instead.\n\nao not write the address. 10 points\n\n2 interpret the meaning\u000f and\n"},{"year":2017,"sec":"cloze","label":"完形","text":"Could a hug a day keep the doctor away? The answer may be a resounding 'yes! \" 1 helping you feel close and 2 to people you care about, it turns out that hugs can bring a 3 of health benefits to your body and mind. Believe it or not, a warm embrace might even help you 4 getting sick this winter.\n\nIn a recent study 5 over 400 healthy adults, researchers from Carnegie Mellon University in Pennsylvania examined the effects of perceived social support and the receipt of hugs 6 the participants' susceptibility to developing the common cold after being 7 to the virus. People who perceived greater social support were less likely to come 8 with a cold, and the researchers 9 that the stress-reducing effects of hugging 10 about 32 percent of that beneficial effect. 11 among those who got a cold, the ones who felt greater social support and received more frequent hugs had less severe 12\n\n\"Hugging protects people who are under stress from the 13 risk for colds that's usually 14 with stress,\" notes Sheldon Cohen, a professor of psychology at Carnegie. Hugging \"is a marker of intimacy and helps 15 the feeling that others are there to help 16 difficulty.\"\n\nSome experts 17 the stress-reducing, health-related benefits of hugging to the release of oxytocin, often called \"the bonding hormone\" 18 it promotes attachment in relationships, including that between mothers and their newborn babies. Oxytocin is made primarily in the central lower part of the brain, and some of it is released into the bloodstream. But some of it 19 in the brain, where it 20 mood, behavior and physiology.\n\n1. [A] Unlike [B] Besides [C] Despite [D] Throughout\n\n2. [A] connected [B] restricted [C] equal [D] inferior\n\n3. [A] choice [B] view [C] lesson [D] host\n\n4. [A] recall [B] forget [C] avoid [D] keep\n\n5. [A] collecting [B] involving [C] guiding [D] affecting\n\n6. [A] of [BJ in [CJ at [DJ on\n\n7. [A] devoted [B] exposed [C] lost [D] attracted\n\n8. [A] across [B] along [C] down [D] out\n\n9. [A] calculated [BJ denied [CJ doubted [DJ imagined\n\n10. [A] served [B] required [C] restored [D] explained\n\n11. [A] Even [B] Still [C] Rather [D] Thus\n\n12. [AJ defeats [B] symptoms [C] tests [D] errors\n\n13. [ A J minimized [BJ highlighted [CJ controlled [DJ increased\n\n14. [ A J equipped [B] associated [CJ presented [D] compared\n\n15. [AJ assess [BJ moderate [CJ generate [D] record\n\n16. [A] in the face of [B] in the form of [C] in the way of [D] in the name of\n\n17. [ A J transfer [B] commit [C] attribute [D] return\n\n18. [AJ because [B] unless [C] though [DJ until\n\n19. [AJ emerges [BJ vanishes [CJ remains [DJ decreases\n\n20. [ A J experiences [BJ combines [CJ justifies [DJ influences\n"},{"year":2017,"sec":"partb","label":"新题型","text":"martB\n\nThe following paragraphs are given in a wrong order. For questions 4 1-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-G and filling them into the numbered boxes. Paragraphs B and D have been correctly placed. Mark your answers on the ANSWER SHEET. ( 10 points)\n\n[AJ The first published sketch, \"A Dinner at Poplar Walk\" brought tears to Dickens's eyes when he discovered it in the pages of The Monthly Magzine. From then on his sketches, which appeared under the pen name \"Boz\" in The Evening Chronicle, earned him a modest reputation.\n\n[BJ The runaway success of The Pickwick Papers, as it is generally known today, secured Dickens's fame. There were Pickwick coats and Pickwick cigars, and the plump, spectacled hero, Samuel Pickwick, became a national figure.\n\n[CJ Soon after Sketches by Boz appeared, a publishing firm approached Dickens to write a story in monthly installments, as a backdrop for a series of woodcuts by the then-famous artist Robert Seymour, who had originated the idea for the story. With characteristic confidence, Dickens successfully insisted that Seymour's pictures illustrate his own story instead. After the first installment, Dickens wrote to the artist and asked him to correct a drawing Dickens felt was not faithful enough to his prose. Seymour made the change, went into his backyard, and expressed his displeasure by committing suicide. Dickens and his publishers simply pressed on with a new artist. The comic novel, The Posthumous Papers of the Pickwick Club, appeared serially in 1836 and 1837 and was first published in book form in 183 7.\n\n[DJ Charles Dickens is probably the best-known and, to many people, the greatest English novelist of the 19th century. A moralist, satirist, and social reformer, Dickens crafted complex plots and striking characters that capture the panorama of English society.\n\n[EJ Soon after his father's release from prison, Dickens got a better job as errand boy in law offices. He taught himself shorthand to get an even better job later as a court stenographer and as a reporter in Parliament. At the same time, Dickens, who had a reporter's eye for transcribing the life around him, especially anything comic or odd, submitted short sketches to obscure magazmes.\n\n[F] Dickens was born in Portsmouth, on England's southern coast. His father was a clerk in the British Navy pay office - a respectable position, but with little social status. His paternal grandparents, a steward and a housekeeper, possessed even less status, having been servants, and Dickens later concealed their background. Dickens's mother supposedly came from a more respectable family. Yet two years before Dickens's birth, his mother's f a ther was caught stealing and fled to Europe, never to return. The family's increasing poverty forced Dickens out of school at age 12 to work in Warren's Blacking Warehouse, a shoe-polish factory, where the other working boys mocked him as \"the young gentleman.\" His father was then imprisoned for debt. The humiliations of his father's imprisonment and his labor in the blacking factory formed Dickens's greatest wound and became his deepest secret. He could not confide them even to his wife, although they provide the unacknowledged foundation of his fiction.\n\n[G] After Pickwick, Dickens plunged into a bleaker world. In Oliver Twist, he traces an orphan's progress from the workhouse to the criminal slums of London. Nicholas Nickle by, his next novel, combines the darkness of Oliver Twist with the sunlight of Pickwick. The popularity of these novels consolidated Dickens' as a nationally and internationally celebrated man of letters.\n\nAA\n\n\\boxed {4 1.} \\rightarrow\n\nAA\n\nAA\n\nAA\n"},{"year":2017,"sec":"partc","label":"翻译","text":"mart`\n\nThe growth of the use of English as the world's primary language for international communication has obviously been continuing for several decades. ( 46) But even as the number of English speakers expands further there are signs that the global predominance of the language may fade within the foreseeable future.\n\nComplex international, economic, technological and cultural changes could start to diminish the leading position of English as the language of the world market, and UK interests which enjoy advantage from the breadth of English usage would consequently face new pressures. Those realistic possibilities are highlighted in the study presented by David Graddol. ( 4 7) His analysis should therefore end any self-contentedness among those who may believe that the global position of English is so stable that the young generations of the United Kingdom do not need additional language capabilities.\n\nDavid Graddol concludes that monoglot English graduates face a bleak economic future as qualified multilingual youngsters from other countries are proving to have a competitive advantage over their British counterparts in global companies and organisations. Alongside that, ( 48) many countries are introducing English into the primary-school curriculum but British schoolchildren and students do not appear to be gaining greater encouragement to achieve fluency in other languages.\n\nIf left to themselves, such trends will diminish the relative strength of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process outsourcing in other languages such as Japanese, French and German, spreads.\n\n( 49) The changes identified by David Graddol all present clear and major challenges to the UK's providers of English language teaching to people of other countries and to broader education business sectors. The English language teaching sector directly earns nearly £ 1.3 billion for the UK in invisible exports and our other education related exports earn up to £ 10 billion a year more. As the international education market expands, the recent slowdown in the numbers of international students studying in the main English-speaking countries is likely to continue, especially if there are no effective strategic policies to prevent such slippage.\n\nThe anticipation of possible shifts in demand provided by this study is significant: (50) It gives a basis to all organisations which seek to promote the learning and use of English, a basis for planning to meet the possibilities of what could be a very different operating environment. That is a necessary and practical approach. In this as in much else, those who wish to influence the future must prepare for it.\n"},{"year":2017,"sec":"questions","label":"阅读题目","text":"21. The crash of EgyptAir Flight 804 is mentioned to [A] explain American's tolerance of current security checks. [B] stress the urgency to strengthen security worldwide. [C] highlight the necessity of upgrading major U.S. airports. [D] emphasize the importance of privacy protection.\n\n22. Which of the following contributes to long waits at major airports? [A] New restrictions on cary-on bags. [B] The declining efficiency of the TSA. [C] An increase in the number of travelers. [D] Frequent unexpected secret checks.\n\n23. The word \"expedited\" (Line 4, Para. 5) is closest in meaning to [A] quieter. [B] cheaper. [C] wider. [D] faster.\n\n24. One problem with the PreCheck program is [A] a dramatic reduction of its scale. [B] its wrongly-directed implementation. [C] the government's reluctance to back it. [D] an unreasonable price for enrollment.\n\n25. Which of the following would be the best title for the text? [A] Less Screening for More Safety [B] PreCheck - a Belated Solution [C] Get t ing Stuck in Security Lines [D] Underused PreCheck Lanes\n\n26. Queen Liliuokalani's remark in Paragraph 1 indicates [A] her conservative view on the historical role of astronomy. [B] the importance of astronomy in ancient Hawaiian society. [C] the regrettable decline of astronomy in ancient times. [D] her appreciation of star watchers' feats in her time.\n\n27. Mauna Kea is deemed as an ideal astronomical site due to [A] its geographical features. [B] its protective surroundings. [C] its religious implications. [D] its existing infrastructure.\n\n28. The construction of the TMT is opposed by some locals partly because [A] it may risk ruining their intellectual life. [B] it reminds them of a humiliating history. [C] their culture will lose a chance of revival. [D] they fear losing control of Mauna Kea.\n\n29. It can be inferred from Paragraph 5 that progress in today's astronomy [A] is fulfilling the dreams of ancient Hawaiians. [B] helps spread Hawaiian culture across the world. [C] may uncover the origin of Hawaiian culture. [D] will eventually soften Hawaiians' hostility.\n\n30. The author's attitude toward choosing Mauna Kea as the TMT site is one of [A] severe criticism. [B] passive acceptance. [C] slight hesitancy. [D] full approval.\n\n31. Robert F. Kennedy is cited because he [A] praised the UK for its GDP. [B] identified GDP with happiness. [C] misinterpreted the role of GDP. [D] had a low opinion of GDP.\n\n32. It can be inferred from Paragraph 2 that [A] the UK is reluctant to remold its economic pattern. [B] GDP as the measure of success is widely defied in the UK. [C] the UK will contribute less to the world economy. [D] policymakers in the UK are paying less attention to GDP.\n\n33. Which of the following is true about the recent annual study? [A] It is sponsored by 163 countries. [B] It excludes GDP as an indicator. [C] Its criteria are questionable. [D] Its results are enlightening.\n\n34. In the last two paragraphs, the author suggests that [A] the UK is preparing for an economic boom. [B] high GDP foreshadows an economic decline. [C] it is essential to consider factors beyond GDP. [D] it requires caution to handle economic issues.\n\n35. Which of the following is the best title for the text? [A] High GDP But Inadequate Well-being, a UK Lesson [B] GDP Figures, a Window on Global Economic Health [C] Robert F. Kennedy, a Terminator of GDP [D] Brexit, the UK's Gateway to Well-being\n\n36. The underlined sentence (Para. 1) most probably shows that the court [A] avoided defining the extent of McDonnell's duties. [B] made no compromise in convicting McDonnell. [C] was contemptuous of McDonnell's conduct. [D] refused to comment on McDonnell's ethics.\n\n37. According to Paragraph 4, an official act is deemed corruptive only if it involves [A] leaking secrets intentionally. [B] sizable gains in the form of gifts. [C] concrete returns for gift-givers. [D] breaking contracts officially.\n\n38. The court's ruling is based on the assumption that public officials are [A] justified in addressing the needs of their constituents. [B] qualified to deal independently with bureaucratic issues. [C] allowed to focus on the concerns of their supporters. [D] exempt from conviction on the charge of favoritism.\n\n39. Well-enforced laws in government transparency are needed to [A] awaken the conscience of officials. [B] guarantee fair play in official access. [C] allow for certain kinds of lobbying. [D] inspire hopes in average people.\n\n40. The author's attitude toward the court's ruling is [A] sarcastic. [BJ tolerant. [CJ skeptical. [DJ supportive.\n"},{"year":2017,"sec":"writing","label":"写作","text":"You are to write an email to James Cook, a newly-arrived Australian professor, recommending some tourist attractions in your city. Please give reasons for your recommendation.\n\nmartB\n\n2 ) interpret the meaning, and\n"},{"year":2018,"sec":"cloze","label":"完形","text":"Trust is a tricky business. On the one hand, it's a necessary condition \\_1\\_ many worthwhile things: child care, friendships, etc. On the other hand, putting your 2 in the wrong place often carries a high 3\n\n4 why do we trust at all? Well, because it feels good. -=5 '- people place their trust in an individual or an institution, their brains release oxytocin, a hormone that 6 pleasurable feelings and triggers the herding instinct that prompts humans to --'7- with one another. Scientists have found that exposure 8 this hormone puts us in a trusting 9 : fu a Swiss study, researchers sprayed oxytocin into the noses of half the subjects; those subjects were ready to lend significantly higher amounts of money to strangers than were their 10 who inhaled something else.\n\n1�1� for us, we also have a sixth sense for dishonesty that may 12 us. A Canadian study found that children as young as 14 months can differentiate --=1 =-3- a credible person and a dishonest one. Sixty toddlers were each 14 to an adult tester holding a plastic container. The tester would ask, \"What's in here?\" before looking into the container, smiling, and exclaiming, \"Wow!\" Each subject was then invited to look 15 . Half of them found a toy; the other half \\_\\_ l-'6 \\_ the container was empty - and realized the tester had 17 them.\n\nAmong the children who had not been tricked, the majority were 18 to cooperate with the tester in learning a new skill, demonstrating that they trusted his leadership. 19 , only five of the 30 children paired with the \" 20 \" tester participated in a follow-up activity.\n\n1. [AJ on [BJ like [CJ for [DJ from\n\n2. [AJ faith [BJ concern [CJ attention [DJ interest\n\n3. [AJ benefit [B] debt [CJ hope [D] price\n\n4. [ A J Therefore [BJ Then [CJ Instead [DJ Again\n\n5. [AJ Until [B] Unless [ C] Although [D] When\n\n6. [AJ selects [B] produces [C] applies [D] maintains\n\n7. [AJ consult [BJ compete [CJ connect [DJ compare\n\n8. [AJ at [B] by [CJ of [D] to\n\n9. [AJ context [B] mood [CJ period [D] circle\n\n10. [AJ counterparts [BJ substitutes [CJ colleagues [DJ supporters\n\n11. [AJ Funny [B] Lucky [CJ Odd [D] Ironic\n\n12. x^g monitor xBg protect x`g surprise xag delight\n\n13. [AJ between [B] within [CJ toward [D] over\n\n14. [AJ transferred [BJ added [ CJ introduced [DJ entrusted\n\n15. [AJ out [B] back [CJ around [D] inside\n\n16. [AJ discovered [B] proved [C] insisted [D] remembered\n\n17. [AJ betrayed [BJ wronged [CJ fooled [D] mocked\n\n18. [AJ forced [BJ willing [C] hesitant [D] entitled\n\n19. [AJ In contrast [B] As a result [CJ On the whole [D] For instance\n\n20. x^g inflexible xBg incapable x`g unreliable xag unsuitable\n"},{"year":2018,"sec":"partb","label":"新题型","text":"martB\n\nThe following paragraphs are given in a wrong order. For Questions 41-45, you are required to reorganize these paragraphs into a coherent article by choosing from the list A-G and filling them into the numbered boxes. Paragraphs C and F have been correctly placed. Mark your answers on the ANSWER SHEET. ( 10 points)\n\n[A] In December of 1869, Congress appointed a commission to select a site and prepare plans and cost estimates for a new State Department Building. The commission was also to consider possible arrangements for the War and Navy Departments. To the horror of some who expected a Greek Revival twin of the Treasury Building to be erected on the other side of the White House, the elaborate French Second Empire style design by Alfred Mullett was selected, and construction of a building to house all three departments began in June of 187 1.\n\n[B] Completed in 1875, the State Department's south wing was the first to be occupied, with its elegant four-story library ( completed in 1876), Diplomatic Reception Room, and Secretary's office decorated with carved wood, Oriental rugs, and stenciled wall patterns. The Navy Department moved into the east wing in 1879, where elaborate wall and ceiling stenciling and marquetry floors decorated the office of the Secretary.\n\n[C] The State, War, and Navy Building, as it was originally known, housed the three Executive Branch Departments most intimately associated with formulating and conducting the nation's foreign policy in the last quarter of the nineteenth century and the first quarter of the twentieth century - the period when the United States emerged as an international power. The building has housed some of the nation's most significant diplomats and politicians and has been the scene of many historic events.\n\n[D] Many of the most celebrated national figures have participated in historical events that have taken place within the EEOB's granite walls. Theodore and Franklin D. Roosevelt, William Howard Taft, Dwight D. Eisenhower, Lyndon B. Johnson, Gerald Ford, and George H. W. Bush all had offices in this building before becoming president. It has housed 16 Secretaries of the Navy, 2 1 Secretaries of War, and 24 Secretaries of State. Winston Churchill once walked its corridors and Japanese emissaries met here with Secretary of State Cordell Hull after the bombing of Pearl Harbor.\n\n[E] The Eisenhower Executive Office Building (EEOB) commands a unique position in both the national history and the architectural heritage of the United States. Designed by Supervising Architect of the Treasury, Alfred B. Mullett, it was built from 187 1 to 1888 to house the growing staffs of the State, War, and Navy Departments, and is considered one of the best examples of French Second Empire architecture in the country.\n\n[F] Construction took 17 years as the building slowly rose wing by wing. When the EEOB was finished, it was the largest office building in Washington, with nearly 2 miles of black and white tiled corridors. Almost all of the interior detail is of cast iron or plaster; the use of wood was minimized to insure fire safety. Eight monumental curving staircases of granite with over 4,000 individually cast bronze balusters are capped by four skylight domes and two stained glass rotundas.\n\n[G] The history of the EEOB began long before its foundations were laid. The first executive offices were constructed between 1799 and 1820. A series of fires (including those set by the British in 18 14) and overcrowded conditions led to the construction of the existing Treasury Building. In 1866, the construction of the North Wing of the Treasury Building necessitated the demolition of the State Department building.\n"},{"year":2018,"sec":"partc","label":"翻译","text":"mart`\n\nShakespeare's lifetime was coincident with a period of extraordinary activity and achievement in the drama. ( 46) By the date of his birth Europe was witnessing the passing of the religious drama, and the creation of new forms under the incentive of classical tragedy and comedy. These new forms were at first mainly written by scholars and performed by amateurs, but in England, as everywhere else in western Europe, the growth of a class of professional actors was threatening to make the drama popular, whether it should be new or old, classical or medieval, literary or farcical. Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and ( 4 7) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring honor to England.\n\nWhen Shakespeare was twelve years old the first public playhouse was built in London. For a time literature showed no interest in this public stage. Plays aiming at literary distinction were written for schools or court, or for the choir boys of St.Paul's and the royal chapel, who, however, gave plays in public as well as at court. ( 48) But the professional companies prospered in their permanent theaters, and university men with literary ambitions were quick to tum to these theaters as ofering a means of livelihood. By the time that Shakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once popular and literary; Kyd had written a tragedy that crowded the pit; and Marlowe had brought poetry and genius to triumph on the common stage - where they had played no part since the death of Euripides. ( 49) native literary drama had been created, its alliance with the public playhouses established, and at least some of its great traditions had been begun.\n\nThe development of the Elizabethan drama for the next twenty-five years is of exceptional interest to students of literary history, for in this brief period we may trace the beginning, growth, blossoming, and decay of many kinds of plays, and of many great careers. We are amazed today at the mere number of plays produced, as well as by the number of dramatists writing at the same time for this London of two hundred thousand inhabitants. (50) To realize how great was the dramatic activity, we must remember further that hosts of plays have been lost, and that probably there is no author of note whose entire work has survived.\n"},{"year":2018,"sec":"questions","label":"阅读题目","text":"21. Who will be most threatened by automation? [ A J Leading politicians. [BJ Low-wage laborers. [CJ Robot owners. [DJ Middle-class workers.\n\n22. Which of the following best represents the author's view? [AJ Worries about automation are in fact groundless. [BJ Optimists' opinions on new tech find little support. [CJ Issues arising from automation need to be tackled. [DJ Negative consequences of new tech can be avoided.\n\n23. Education in the age of automation should put more emphasis on [ A J creative potential. [BJ job-hunting skills. [CJ individual needs. [DJ cooperative spirit.\n\n24. The author suggests that tax policies be aimed at [ A J encouraging the development of automation. [BJ increasing the return on capital investment. [CJ easing the hostility between rich and poor. [DJ preventing the income gap from widening.\n\n25. In this text, the author presents a problem with [ A J opposing views on it. [BJ possible solutions to it. [CJ its alarming impacts. [DJ its major variations.\n\n26. According to Paragraphs 1 and 2, many young Americans cast doubts on [AJ the justification of the news-filtering practice. [BJ people's preference for social media platforms. [CJ the administration's ability to handle information. [DJ social media as a reliable source of news.\n\n27. The phrase \"beef up\" (Line 2, Para. 2) is closest in meaning to [ A J sharpen. [BJ define. [CJ boast. [DJ share.\n\n28. According to the Knight Foundation survey, young people [ A J tend to voice their opinions in cyberspace. [BJ verify news by referring to diverse sources. [CJ have a strong sense of responsibility. [DJ like to exchange views on \"distributed trust\".\n\n29. The Barna survey found that a main cause for the fake news problem is [ A J readers' outdated values. [BJ journalists' biased reporting. [CJ readers' misinterpretation. [DJ journalists' made-up stories.\n\n30. Which of the following would be the best title for the text? [AJ A Rise in Critical Skills for Sharing News Online. [BJ A Counteraction Against the Over-tweeting Trend. [CJ The Accumulation of Mutual Trust on Social Media. [DJ The Platforms for Projection of Personal Interests.\n\n31. What is true of the agreement between the NHS and DeepMind? [ A J It caused conflicts among tech giants. [BJ It failed to pay due attention to patients' rights. [CJ It fell short of the latter's expectations. [DJ It put both sides into a dangerous situation.\n\n32. The NHS trust responded to Denham's verdict with [ A J empty promises. [BJ tough resistance. [CJ necessary adjustments. [DJ sincere apologies.\n\n33. The author argues in Paragraph 2 that [ A J privacy protection must be secured at all costs. [BJ leaking patients' data is worse than selling it. [CJ making profits from patients' data is illegal. [DJ the value of data comes from the processing of it.\n\n34. According to the last paragraph, the real worry arising from this deal is [ A J the vicious rivalry among big pharmas. [BJ the ineffective enforcement of privacy law. [CJ the uncontrolled use of new software. [DJ the monopoly of big data by tech giants.\n\n35. The author's attitude toward the application of AI to healthcare is [ A J ambiguous. [BJ cautious. [CJ appreciative. [DJ contemptuous.\n\n36. The financial problem with the USPS is caused partly by [ A J its unbalanced budget. [BJ its rigid management. [CJ the cost for technical upgrading. [DJ the withdrawal of bank support.\n\n3 7. According to Paragraph 2, the USPS fails to modernize itself due to [AJ the interference from interest groups. [BJ the inadequate funding from Congress. [CJ the shrinking demand for postal service. [DJ the incompetence of postal unions.\n\n38. The long-standing complaint by the USPS and its unions can be addressed by [ A J removing its burden of retiree health care. [BJ making more investment in new vehicles. [CJ adopting a new rate-increase mechanism. [DJ attracting more first-class mail users.\n\n39. In the last paragraph, the author seems to view legislators with [ A J respect. [BJ tolerance. [ CJ discontent. [DJ gratitude.\n\n40. Which of the following would be the best title for the text? [AJ The USPS Starts to Miss Its Good Old Days. [BJ The Postal Service: Keep Away from My Cheese. [CJ The USPS: Chronic Illness Requires a Quick Cure. [DJ The Postal Service Needs More Than a Band-Aid.\n"},{"year":2018,"sec":"writing","label":"写作","text":"Write an email to all international experts on campus inviting them to attend the graduation ceremony. In your email you should include time, place and other relevant information about the ceremony.\n\nmartB\n\n2) interpret the meaning, and\n\n3) give your comments.\n"},{"year":2019,"sec":"cloze","label":"完形","text":"Today we live in a world where GPS systems, digital maps, and other navigation apps are available on our smartphones. \\_1\\_ of us just walk straight into the woods without a phone. But phones \\_2\\_ on batteries, and batteries can die faster than we realize. \\_3\\_ you get lost without a phone or a compass, and you \\_4\\_ can't find north, we have a few tricks to help you navigate \\_5\\_ to civilization, one of which is to follow the land.\n\nWhen you find yourselfwell \\_6\\_ a trail, but not in a completely \\_7\\_ area, you have to answer two questions: Which \\_8\\_ is downhill, in this particular area? And where is the nearest water source? Humans overwhelmingly live in valleys, and on supplies of fresh water. \\_9\\_, if you head downhill, and follow any H2O you find, you should 10 see signs of people.\n\nIf you've explored the area before, keep an eye out for familiar sights - you may be 11 how quickly identifying a distinctive rock or tree can restore your bearings.\n\nAnother 12 : Climb high and look for signs of human habitation. 13 even in dense forest, you should be able to 14 gaps in the tree line due to roads, train tracks, and other paths people carve 15 the woods. Head toward these 16 to find a way out. At night, scan the horizon for 17 light sources, such as fires and streetlights, then walk toward the glow of light pollution.\n\n�18�\\_, assuming you're lost in an area humans tend to frequent, look for the 19 we leave on the landscape. Trail blazes, tire tracks, and other features can 20 you to civilization.\n\n3. [AJ Since [BJ If [CJ Though [DJ Until\n\n4. [ A J formally [BJ relatively [CJ gradually [DJ literally\n\n5. [AJ back [BJ next [CJ around [DJ away\n\n6. [AJ onto [BJ of [CJ across [DJ alone\n\n7. [ A J unattractive [BJ uncrowded [ CJ unchanged [DJ unfamiliar\n\n8. [AJ site [BJ point [CJ way [DJ place\n\n9. [AJ So [BJ Yet [CJ Instead [DJ Besides\n\n10. [AJ immediately [BJ intentionally [ CJ unexpectedly [DJ eventually\n\n11. [ A J surprised [BJ annoyed [ CJ frightened [DJ confused\n\n12. x^g problem xBg option x`g view xag result\n\n13. [AJ Above all [BJ In contrast [CJ On average [DJ For example\n\n14. [AJ bridge [BJ avoid [CJ spot [DJ separate\n\n15. [AJ from [BJ through [CJ beyond [DJ under\n\n16. x^g posts xBg links x`g shades xag breaks\n\n1 7. [ A J artificial [BJ mysterious [CJ hidden [DJ limited\n\n18. [AJ Finally [BJ Consequently [ CJ Incidentally [DJ Generally\n\n19. [AJ memories [BJ marks [CJ notes [DJ belongings\n\n20. [AJ restrict [BJ adopt [C] lead [DJ expose\n"},{"year":2019,"sec":"partb","label":"新题型","text":"martB\n\nThe following paragraphs are given in a wrong order. For Questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-G and filling them into the numbered boxes. Paragraphs C and F have been correctly placed. Mark your answers on the ANSWER SHEET. ( 10 points)\n\n[A] These tools can help you win every argument - not in the unhelpful sense of beating your opponents but in the better sense of learning about the issues that divide people. Learning why they disagree with us and learning to talk and work together with them. If we readjust our view of arguments - from a verbal fight or tennis game to a reasoned exchange through which we all gain mutual respect, and under s tanding - then we change the very nature of what it means to ''win\" an argument.\n\n[BJ Of course, many discussions are not so successful. Still, we need to be careful not to accuse opponents of bad arguments too quickly. We need to learn how to evaluate them properly. A large part of evaluation is calling out bad arguments, but we also need to admit good arguments by opponents and to apply the same critical standards to ourselves. Humility requires you to recognize weakness in your own arguments and sometimes also to accept reasons on the opposite side.\n\n[CJ None of these will be easy but you can start even if others refuse to. Next time you state your position, formulate an argument for what you claim and honestly ask yourself whether your argument is any good. Next time you talk with someone who takes a stand, ask them to give you a reason for their view. Spell out their argument fully and charitably. Assess its strength impartially. Raise objections and listen carefully to their replies.\n\n[DJ Carnegie would be right if arguments were fights, which is how we often think of them. Like physical fights, verbal fights can leave both sides bloodied. Even when you win, you end up no better of. Your prospects would be almost as dismal if arguments were even just competitions - like, say, tennis games. Pairs of opponents hit the ball back and forth until one winner emerges from all who entered. Everybody else loses. This kind of thinking is why so many people try to avoid arguments, especially about politics and religion.\n\n[E] In his 1936 work How to Win Friends and Influence People, Dale Carnegie wrote: \"There is only one way . . . to get the best of an argument - and that is to avoid it.\" This aversion to arguments is common, but it depends on a mistaken view of arguments that causes profound problems for our personal and social lives - and in many ways misses the point of arguing in the first place.\n\n[F] These views of arguments also undermine reason. If you see a conversation as a fight or competition, you can win by cheating as long as you don't get caught. You will be happy to convince people with bad arguments. You can call their views stupid, or joke about how ignorant they are. None of these tricks will help you understand them, their positions or the issues that divide you, but they can help you win - in one way.\n\n[G] There is a better way to win arguments. Imagine that you f a vor increasing the minimum wage in our state, and I do not. If you yell, \"Yes,\" and I yell, \"No,\" neither of us learns anything. We neither understand nor respect each other, and we have no basis for compromise or cooperation. In contrast, suppose you give a reasonable argument: that full-time workers should not have to live in poverty. Then I counter with another reasonable argument: that a higher minimum wage will force businesses to employ fewer people for less time. Now we can understand each other's positions and recognize our shared values, since we both care about needy workers.\n"},{"year":2019,"sec":"partc","label":"翻译","text":"It was only after I started to write a weekly column about the medical journals, and began to read scientific papers from beginning to end, that I realised just how bad much of the medical literature frequently was. I came to recognise various signs of a bad paper: the kind of paper that purports to show that people who eat more than one kilo of broccoli a week were 1.1 7 times more likely than those who eat less to suffer late in life from pernicious anaemia. ( 46) There is a great deal of this kind of nonsense in the medical journals which, when taken up by broadcasters and the lay press, generates both health scares and short-lived dietary enthusiasms.\n\nWhy is so much bad science published? A recent paper, titled \"The Natural Selection of Bad Science\", published on the Royal Society's open science website, attempts to answer this intriguing and important question. It says that the problem is not merely that people do bad science, but that our current system of career advancement positively encourages it. What is important is not truth, but publica t ion, which has become almost an end in itself. There has been a kind of inflationary process at work: ( 4 7) nowadays anyone applying for a research post has to have published twice the number of papers that would have been required for the same post only 10 years ago. Never mind the quality, then, count the number.\n\n( 48) Atempts have been made to curb this tendency, for example, by trying to incorporate some measure of quality as well as quantity into the assessment of an applicant's papers. This is the famed citation index, that is to say the number of times a paper has been quoted elsewhere in the scientific literau, the assumption being that an important paper will be cited more often than one of small account. ( 49) This would be reasonable if it were not for the fact that scientists can easily arrange to cite themselves in their future publications, or get associates to do so for them in return for similar favours.\n\nBoilng down an individual's output to simple metrics, such as number of publications or journal impacts, entails considerable savings in time, energy and ambiguity. Unfortunately, the long-term costs of using simple quantitative metrics to assess researcher merit are likely to be quite great. (50) If we are serious about ensuring that our science is both meaningful and reproducible, we must ensure that our institutions encourage that kind of science.\n"},{"year":2019,"sec":"questions","label":"阅读题目","text":"21. According to Paragraph 1, one motive in imposing the new rule is to [AJ enhance bankers' sense of responsibility. [BJ help corporations achieve larger profits. [CJ build a new system of financial regulation. [DJ guarantee the bonuses of top 's novel Frankenstein is mentioned because it [ A J fascinates AI scientists all over the world. [BJ has remained popular for as long as 200 years. [CJ involves some concerns raised by AI today. [DJ has sparked serious ethical controversies.\n\n32. In David Eagleman's opinion, our current knowledge of consciousness [ A J helps explain artificial intelligence. [BJ can be misleading to robot making. [CJ inspires popular sci-fi TV series. [DJ is too limited for us to reproduce it.\n\n33. The solution to the ethical issues brought by autonomous vehicles [ A J can hardly ever be found. [BJ is still beyond our capacity. [CJ causes little public concern. [DJ has aroused much curiosity.\n\n34. The author's attitude toward Google's pledges is one of [ A J affirmation. [BJ skepticism. [ CJ contempt. [DJ respect.\n\n35. Which of the following would be the best title for the text? [AJ Al's Future: In the Hands of Tech Giants [BJ Frankenstein, the Novel Predicting the Age of AI [CJ The Conscience of AI: Complex But Inevitable [DJ AI Shall Be Killers Once Out of Control\n\n36. The Supreme Court decision Thursday will [ A J better businesses' relations with states. [BJ put most on line businesses in a dilemma. [CJ make more on line shoppers pay sales tax. [DJ force some states to cut sales tax.\n\n3 7. It can be learned from paragraphs 2 and 3 that the overruled decisions [ A J have led to the dominance of e-commerce. [BJ have cost consumers a lot over the years. [CJ were widely criticized by on line purchasers. [DJ were considered unfavorable by states.\n\n38. According to Justice Anthony Kennedy, the physical presence rule has [ A J hindered economic development. [BJ brought prosperity to the country. [CJ harmed fair market competition. [DJ boosted growth in states' revenue.\n\n39. Who are most likely to welcome the Supreme Court ruling? [ A J Internet entrepreneurs. [BJ Big-chain owners. [CJ Third-party sellers. [DJ Small retailers.\n\n40. In dealing with the Supreme Court decision Thursday, the author [ A J gives a factual account of it and discusses its consequences. [BJ describes the long and complicated process of its making. [CJ presents its main points with conflicting views on them. [DJ cites some cases related to it and analyzes their implications.\n"},{"year":2019,"sec":"writing","label":"写作","text":"Suppose you are working for the \"Aiding Rural Primary School\" project of your university. Write an email to answer the inquiry from an international student volunteer, specifying the details of the project.\n\nmartB\n\n2) interpret the implied meaning, and\n"},{"year":2020,"sec":"cloze","label":"完形","text":"Even if families don't sit down to eat together as frequently as before, millions of Britons will nonetheless have got a share this weekend of one of the nation's great traditions: the Sunday roast. ] a cold winter 5 s day, few culinary pleasures can 2 it. Yet as we report now, the food police are determined that this 3 should be rendered yet another guilty pleasure 4 to damage our health.\n\nThe Food Standards Authority (FSA) has 5 a public warning about the risks of a compound called acrylamide that forms in some foods cooked 6 high temperatures. This means that people should 7 crisping their roast potatoes, reject thin-crust pizzas and only 8 toast their bread. But where is the evidence to support such alarmist advice? 9 studies have shown that acrylamide can cause neurological damage in mice, there is no 10 evidence that it causes cancer in humans.\n\nScientists say the compound is 11 to cause cancer but have no hard scientific proof 12 the precautionary principle, it could be argued that it is 13 to follow the FSA advice. 14 , it was rumoured that smoking caused cancer for years before the evidence was found to prove a 15\n\nDoubtless a piece of boiled beef can always be 16 up on Sunday alongside some steamed vegetables, without the Yorkshire pudding and no wine. But would life be worth living? 17 , the FSA says it is not telling people to cut out roas foods 18 , but to reduce their lifetime intake. However, their 19 risks coming across as being pushy and overprotective. Constant health scares just 20 with no one listening.\n\n1. [A] In [B] Towards [C] On [D] Till\n\n2. [A] match [B] express [C] satisfy [D] influence\n\n3. [A] patience [B] enjoyment [C] surprise [D] concern\n\n4. [A] intensified [B] privileged [C] compelled [D] guaranteed\n\n5. [A] issued [B] received [C] ignored [D] cancelled\n\n6. [A] under [B ]at [C] for [D]by\n\n7. [A] forget [B] regret [C] finish [D] avoid\n\n8. [A] partially [B] regularly [C] easily [D] initially\n\n9. [A] Unless [B] Since [C] If [D] While\n\n10. [A] secondary [B] external [C] conclusive [D] negative\n\n11. [A] insufficient [B] bound [C] likely [D] slow\n\n12. [A] On the basis of [B] At the cost of [C] In addition to [D] In contrast to\n\n13. [A] interesting [B] advisable [C] urgent [D] fortunate\n\n14. [A]] As usual [B] In particular [C] By definition [D] After all\n\n15. [A] resemblance [B] combination [C] connection [D] pattern\n\n16. [A] made [B] served [C] saved [D] used\n\n17. [A] To be fair [B] For instance [C] To be brief [D] In general\n\n18. [A] reluctantly [B] entirely [C] gradually [D] carefully\n\n19. [A] promise [B] experience [C] campaign [D] competition\n\n20. [A] follow up [B] pick up [C] open up [D] end up\n"},{"year":2020,"sec":"partb","label":"新题型","text":"martB\n\n[A] Eye fixations are brie\n\n[B] Too much eye contact is instinctively felt to be rud\n\n[C] Eye contact can be a friendly social signa\n\n[D] Personality can affect how a person reacts to eye contac\n\n[E] Biological factors behind eye contact are being investigate\n\n[F] Most people are not comfortable holding eye contact with stranger\n\n[G] Eye contact can also be aggressiv\n\nIn a social situation, eye contact with another person can show that you are paying attention in a friendly way. But it can also be antagonistic, such as when a political candidate turns toward their competitor during a debate and makes eye contact that signals hostility. Here's what hard science reveals about eye contact:\n\nWe know that a typical infant will instinctively gaze into its mother's eyes, and she will look back. This mutual gaze is a major part of the attachment between mother and child. In adulthood, looking at someone else in a pleasant way can be a complimentary sign of paying attention. It can catch someone's attention in a crowded room. \"Eye contact and smile^^ can signal availability and confidence, a common-sense notion supported in studies by psychologist Monica Moore.\n\nNeuroscientist Bonnie Auyeung found that the hormone oxytocin increased the amount of eye contact from men toward the interviewer during a briefinterview when the direction of their gaze was recorded. This was also found in high-functioning men with some autistic spectrum symptoms, who may tend to avoid eye contact. Specific brain regions that respond during direct gaze are being explored by other researchers, using advanced methods oforain scanning.\n\nWith the use of eye-tracking technology, Julia Minson of the Harvard Kenned School of Government concluded that eye contact can signal very different kinds of messages, depending on the situation. While eye contact may be a sign of connection or trust in friendly situations, ifs more likely to be associated with dominance or intimidation in adversarial situations. \"Whether you're a politician or a parent, it might be helpful to keep in mind that trying to maintain eye contact may backfire if you're trying to convince someone who has a different set of beliefs than you,\" said Minson.\n\nWhen we look at a face or a picture, our eyes pause on one spot at a time, often on the eyes or mouth. These pauses typically occur at about three per second, and the eyes then jump to another spot, until several important points in the image are registered like a series of snapshots. How the whole image is then assembled and perceived is still a mystery although it is the subject of current research.\n\nIn people who score high in a test of neuroticism, a personality dimension associated with self-consciousness and anxiety, eye contact triggered more activity associated with avoidance, according to the Finnish researcher Jari Hietanen and colleagues. 6( Our findings indicate that people do not only feel different when they are the centre of attention but that their brain reactions also differ.\" A more direct finding is that people who scored highly for negative emotions like anxiety looked at others for shorter periods of time and reported more comfortable feelings when others did not look directly at them.\n"},{"year":2020,"sec":"partc","label":"翻译","text":"mart`\n\nFollowing the explosion of creativity in Florence during the 14th century known as the Renaissance, the modem world saw a departure from what it had once known. It turned from God and the authority of the Roman Catholic Church and instead favoured a more humanistic approach to being. Renaissance ideas had spread throughout Europe well into the 17th century, with the arts and sciences flourishing extraordinarily among those with a more logical disposition. (46) With the Church's teachings and ways of thinking being eclipsed by the Renaissance, the gap between the Medieval and modem periods had been bridged, leading to new and unexplored intellectual territories.\n\nDuring the Renaissance, the great minds of Nicolaus Copernicus, Johannes Kepler and Galileo Galilei demonstrated the power of scientific study and discovery. (47) Before each of their revelations, many thinkers at the time had sustained more ancient ways of thinking, including the geocentric view that the Earth was at the centre of our universe. Copernicus theorised in 1543 that all of the planets that we knew of revolved not around the Earth, but the Sun, a system that was later upheld by Galileo at his own expense. Offering up such a theory during a time of high tension between scientific and religious minds was branded as heresy, and any such heretics that continued to spread these lies were to be punished by imprisonment or even death.\n\n(48) Despite attempts by the Church to suppress this new generation of logicians and rationalists, more explanations for how the universe fimctioiied were being made at a rate that the people could no longer ignore. It was with these great revelations that a new kind of philosophy founded in reason was bom.\n\nThe Church's long-standing dogma was losing the great battle for truth to rationalists and scientists. This very fact embodied the new ways of thinking that swept through Europe during most of the 17th century. (49) As many took on the duty of trying to integrate reasoning and scientific philosophies into the world, the Renaissance was over and it was time for a new era - the Age of Reason.\n\nThe 17th and 18th centuries were times of radical change and curiosity. Scientifi method, reductionism and the questioning of Church ideals was to be encouraged, as were ideas of liberty, tolerance and progress. (50) Such actions to seek knowledge and to understand what information we already knew were captured by the Latin phrase 'sapere aude' or 'dare to know', after Immanuel Kant used it in his essay An Answer to the Question: What is Enlightenment?. It was the purpose and responsibility of great minds to go forth and seek out the truth, which they believed to be founded in knowledge.\n"},{"year":2020,"sec":"questions","label":"阅读题目","text":"21. Cooper and her colleagues argue that a \"town of culture^^ award coul [A] consolidate the town-city ties in Britai [B] promote cooperation among Britain's town [C] increase the economic strength of Britain 5 s town [D] focus Britain's limited resources on cultural event\n\n22. According to Paragraph 2, the proposal might be regarded by some [A] a sensible compromis [B] a self-deceiving attemp [C] an eye-catching bonu [D] an inaccessible targe\n\n23. The author suggests that a title holder is successful only if [A] endeavours to maintain its imag [B] meets the aspiration of its peopl [C] brings its local arts to prominenc [D] commits to its long-term growt\n\n24. Glasgow is mentioned in Paragraph 3 to prese [A] a contrasting cas [B] a supporting exampl [C] a background stor [D] a related topi\n\n25. What is the author's attitude towards the proposa [A] Skeptica [B] Objectiv [C] Favourabl [D] Critica\n\n26. Scientific publishing is seen as \"a license to print money\" partly becaus [A] its funding has enjoyed a steady in creas [B] its marketing strategy has been successfu [C] its payment for peer review is reduce [D] its content acquisition costs not hin\n\n27. According to Paragraphs 2 and 3, scientific publishers like Elsevier ha [A] thrived mainly on university librarie [B] gone through an existential crisi [C] reviewed the publishing industr [D] financed researchers generousl\n\n28. How does the author feel about the success ofSci-Hu [A] Relieved [B] Puzzle [C] Concerne [D] Encourage\n\n29. It can be learned from Paragraphs 5 and 6 that open access term [A] allow publishers some room to make mone [B] render publishing much easier for scientist [C] reduce the cost of publication substantiall [D] free universities from financial burden\n\n30. Which of the following characterizes the scientific publishing mode [A] Trial subscription is offere [B] Labour triumphs over statu [C] Costs are well controlle [D] The few feed on the man\n\n31. The author believes that the bills sponsored by Lewis and Haddad wi [A] help little to reduce gender bias. [B] pose a threat to the state governmen [C] raise women's position in politic [D] greatly broaden career option\n\n32. Which of the following is true of the California measure [A] It has irritated private business owner [B] It is welcomed by the Supreme Cour [C] It may go against the Constitutio [D] It will settle the prior controversie\n\n33. The author mentions the st
